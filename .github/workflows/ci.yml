name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:openapi
      - run: npm run lint:lang

  database:
    # Same steps as locally: compose, migrations, database tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run dev:up
      - run: npm run test:db
      - name: The latest migration can be rolled back and reapplied with data in the tables
        run: |
          npx dbmate --env TEST_DATABASE_URL --no-dump-schema rollback
          npx dbmate --env TEST_DATABASE_URL --no-dump-schema up
      - name: All migrations can be rolled back and reapplied
        run: |
          for _ in db/migrations/*.sql; do npx dbmate --env TEST_DATABASE_URL --no-dump-schema rollback; done
          npm run db:migrate
          npm run test:db
      - if: failure()
        run: docker compose logs postgres
