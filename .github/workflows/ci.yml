name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:openapi

  database:
    # Samma steg som lokalt: compose, migreringar, databastester.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run dev:up
      - run: npm run test:db
      - name: Senaste migreringen går att backa och köra igen med data i tabellerna
        run: |
          npx dbmate --env TEST_DATABASE_URL --no-dump-schema rollback
          npx dbmate --env TEST_DATABASE_URL --no-dump-schema up
      - name: Alla migreringar går att backa och köra igen
        run: |
          for _ in db/migrations/*.sql; do npx dbmate --env TEST_DATABASE_URL --no-dump-schema rollback; done
          npm run db:migrate
          npm run test:db
      - if: failure()
        run: docker compose logs postgres
