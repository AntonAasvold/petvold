        refundId: { type: string, pattern: '^ref_[A-Za-z0-9]+$' }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        partyId: { $ref: '#/components/schemas/PartyId' }
        amount: { type: integer, minimum: 1, description: In minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason: { type: string, enum: [requested, nothing-more-to-bill] }
    InvoiceOverdueData:
      type: object
      additionalProperties: false
      required: [invoiceId, invoiceNo, accountId, partyId, dueDate, open, currency, reference, reminderNo]
