        partyId: { $ref: '#/components/schemas/PartyId' }
        total: { type: integer, minimum: 1, description: In minor units of currency. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason: { type: string, enum: [policy.changed, policy.cancelled, policy.transferred, policy.reinstated, manual, write-off], description: 'The policy event that led to it, or a person: manual for a credit note, write-off for a write-off.' }
        kind: { type: string, enum: [credit, write-off] }
    NoticeCreatedData:
      type: object
      additionalProperties: false
      required: [noticeId, noticeType, schema, recipientPartyId, language, dueBy]
      properties:
        noticeId: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' }
        noticeType: { type: string }
        schema: { type: string, description: 'e.g. renewal-notice.v1' }
        recipientPartyId: { $ref: '#/components/schemas/PartyId' }
        language: { type: string, pattern: '^[a-z]{2}$' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        invoiceId: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
        dueBy: { $ref: '#/components/schemas/Date' }
        documentMaker: { type: string, enum: [insurer, petvold], description: 'Who makes the document. petvold: wait for notice.document_made.' }
    NoticeDocumentMadeData:
      type: object
      additionalProperties: false
      required: [noticeId, noticeType, documentId, sha256]
      properties:
        noticeId: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' }
        noticeType: { type: string }
        documentId: { type: string, pattern: '^doc_[A-Za-z0-9_]+$', description: The PDF in Petvold's archive. }
