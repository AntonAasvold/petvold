        invoiceId: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
        invoiceNo: { type: string }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        partyId: { $ref: '#/components/schemas/PartyId' }
        dueDate: { $ref: '#/components/schemas/Date' }
        open: { type: integer, minimum: 1, description: Still to pay, in minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reference: { type: string }
        reminderNo: { type: integer, minimum: 1 }
    InvoicePaidData:
      type: object
      additionalProperties: false
      required: [invoiceId, invoiceNo, accountId, partyId, total, currency, paidWith, paidOn]
      properties:
        invoiceId: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
        invoiceNo: { type: string }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        partyId: { $ref: '#/components/schemas/PartyId' }
        total: { type: integer, minimum: 0, description: The invoice's total in minor units, before credit notes. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
