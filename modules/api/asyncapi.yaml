      required: [noticeId, deliveryId, channel, sentAt, documentId, late]
      properties:
        noticeId: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' }
        deliveryId: { type: string }
        channel: { type: string }
        sentAt: { type: string, format: date-time }
        documentId: { type: string, description: 'The document''s id in the insurer''s archive, or in Petvold''s when Petvold made it.' }
        late: { type: boolean, description: Sent after dueBy. }
    NoticeFailedData:
      type: object
      additionalProperties: false
      required: [noticeId, deliveryId]
