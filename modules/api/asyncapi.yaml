        currency: { type: string, pattern: '^[A-Z]{3}$' }
    PaymentSucceededData:
      type: object
      additionalProperties: false
      required: [paymentId, direction, provider, amount, currency, reference, bookedOn]
      properties:
        paymentId: { type: string, pattern: '^pay_[A-Za-z0-9]+$' }
        direction: { type: string, enum: [incoming] }
        provider: { type: string, description: "The adapter that reported it, e.g. fake." }
        amount: { type: integer, minimum: 1, description: In minor units of currency. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
