      properties:
        payoutId: { type: string, pattern: '^pyo_[A-Za-z0-9]+$' }
        purpose: { type: string, enum: [claim, premium-refund] }
        claimId: { type: string }
        policyId: { type: string }
        partyId: { $ref: '#/components/schemas/PartyId' }
        clinicId: { type: string }
        orderId: { type: string, description: The payout order in claim.payout_ordered. }
