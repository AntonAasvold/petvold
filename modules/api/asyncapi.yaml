asyncapi: 3.0.0
info:
  title: Petvold events
  version: 0.1.0
  description: |
    The events Petvold sends to the insurer's systems with webhooks (ADR 0033).
    Each is a CloudEvent 1.0 in structured mode, signed as Standard Webhooks.
    `data` holds ids and fields that are not personal data; fetch the rest with
    the API (`modules/api/openapi.yaml`) and your own token.

    Subscribe with `POST /v1/webhook-subscriptions`. Check `webhook-signature`:
    the HMAC-SHA256 of `webhook-id.webhook-timestamp.body` with the secret after
    `whsec_`, base64. Reject a timestamp more than five minutes off. Use
    `webhook-id` (the event's `id`) to recognize repeats; delivery is at least
    once and in no promised order.

    The fields of `data` per type are the contract. `lint:openapi` checks them
    against the catalog in `modules/webhooks/src/index.ts` (`PUBLIC_EVENTS`).
defaultContentType: application/cloudevents+json

channels:
  subscription:
    address: '{url}'
    description: The address of a webhook subscription.
    parameters:
      url:
        description: The subscription's url.
    messages:
      claimRegistered: { $ref: '#/components/messages/claimRegistered' }
      claimDecisionProposed: { $ref: '#/components/messages/claimDecisionProposed' }
      claimProposalReturned: { $ref: '#/components/messages/claimProposalReturned' }
      claimDecided: { $ref: '#/components/messages/claimDecided' }
      claimPayoutOrdered: { $ref: '#/components/messages/claimPayoutOrdered' }
      claimReviewRequested: { $ref: '#/components/messages/claimReviewRequested' }
      claimWithdrawn: { $ref: '#/components/messages/claimWithdrawn' }
      claimDismissed: { $ref: '#/components/messages/claimDismissed' }
      claimCorrected: { $ref: '#/components/messages/claimCorrected' }
      claimAttachmentAdded: { $ref: '#/components/messages/claimAttachmentAdded' }
      claimInformationRequested: { $ref: '#/components/messages/claimInformationRequested' }
      claimInformationReminded: { $ref: '#/components/messages/claimInformationReminded' }
      claimInformationReceived: { $ref: '#/components/messages/claimInformationReceived' }
      claimInformationExpired: { $ref: '#/components/messages/claimInformationExpired' }
      claimInformationCancelled: { $ref: '#/components/messages/claimInformationCancelled' }
      jobFailed: { $ref: '#/components/messages/jobFailed' }
      animalOwnershipChanged: { $ref: '#/components/messages/animalOwnershipChanged' }
      animalDied: { $ref: '#/components/messages/animalDied' }
      policyIssued: { $ref: '#/components/messages/policyIssued' }
      policyChanged: { $ref: '#/components/messages/policyChanged' }
      policyRenewed: { $ref: '#/components/messages/policyRenewed' }
      policyTransferred: { $ref: '#/components/messages/policyTransferred' }
      policyCancelled: { $ref: '#/components/messages/policyCancelled' }
      policyReinstated: { $ref: '#/components/messages/policyReinstated' }
      applicationReceived: { $ref: '#/components/messages/applicationReceived' }
      applicationAccepted: { $ref: '#/components/messages/applicationAccepted' }
      applicationReferred: { $ref: '#/components/messages/applicationReferred' }
      applicationDeclined: { $ref: '#/components/messages/applicationDeclined' }
      applicationWithdrawn: { $ref: '#/components/messages/applicationWithdrawn' }
      applicationExpired: { $ref: '#/components/messages/applicationExpired' }
      proposalCreated: { $ref: '#/components/messages/proposalCreated' }
      noticeCreated: { $ref: '#/components/messages/noticeCreated' }
      noticeDelivered: { $ref: '#/components/messages/noticeDelivered' }
      noticeFailed: { $ref: '#/components/messages/noticeFailed' }

operations:
  sendEvent:
    action: send
    channel: { $ref: '#/channels/subscription' }
    summary: Petvold posts an event to the subscription's address.
    messages:
      - { $ref: '#/channels/subscription/messages/claimRegistered' }
      - { $ref: '#/channels/subscription/messages/claimDecisionProposed' }
      - { $ref: '#/channels/subscription/messages/claimProposalReturned' }
      - { $ref: '#/channels/subscription/messages/claimDecided' }
      - { $ref: '#/channels/subscription/messages/claimPayoutOrdered' }
      - { $ref: '#/channels/subscription/messages/claimReviewRequested' }
      - { $ref: '#/channels/subscription/messages/claimWithdrawn' }
      - { $ref: '#/channels/subscription/messages/claimDismissed' }
      - { $ref: '#/channels/subscription/messages/claimCorrected' }
      - { $ref: '#/channels/subscription/messages/claimAttachmentAdded' }
      - { $ref: '#/channels/subscription/messages/claimInformationRequested' }
      - { $ref: '#/channels/subscription/messages/claimInformationReminded' }
      - { $ref: '#/channels/subscription/messages/claimInformationReceived' }
      - { $ref: '#/channels/subscription/messages/claimInformationExpired' }
      - { $ref: '#/channels/subscription/messages/claimInformationCancelled' }
      - { $ref: '#/channels/subscription/messages/jobFailed' }
      - { $ref: '#/channels/subscription/messages/animalOwnershipChanged' }
      - { $ref: '#/channels/subscription/messages/animalDied' }
      - { $ref: '#/channels/subscription/messages/policyIssued' }
      - { $ref: '#/channels/subscription/messages/policyChanged' }
      - { $ref: '#/channels/subscription/messages/policyRenewed' }
      - { $ref: '#/channels/subscription/messages/policyTransferred' }
      - { $ref: '#/channels/subscription/messages/policyCancelled' }
      - { $ref: '#/channels/subscription/messages/policyReinstated' }
      - { $ref: '#/channels/subscription/messages/applicationReceived' }
      - { $ref: '#/channels/subscription/messages/applicationAccepted' }
      - { $ref: '#/channels/subscription/messages/applicationReferred' }
      - { $ref: '#/channels/subscription/messages/applicationDeclined' }
      - { $ref: '#/channels/subscription/messages/applicationWithdrawn' }
      - { $ref: '#/channels/subscription/messages/applicationExpired' }
      - { $ref: '#/channels/subscription/messages/proposalCreated' }
      - { $ref: '#/channels/subscription/messages/noticeCreated' }
      - { $ref: '#/channels/subscription/messages/noticeDelivered' }
      - { $ref: '#/channels/subscription/messages/noticeFailed' }

components:
  messageTraits:
    webhook:
      headers:
        type: object
        required: [webhook-id, webhook-timestamp, webhook-signature]
        properties:
          webhook-id: { type: string, description: The event's id. The same at every attempt. }
          webhook-timestamp: { type: string, description: Unix seconds when this attempt was signed. }
          webhook-signature: { type: string, description: "One or more 'v1,<base64>', separated by spaces: two during a rotation of the secret." }

  messages:
    claimRegistered:
      name: petvold.claim.registered.v1
      title: claim.registered
      summary: 'A claim was registered.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.registered.v1 }
              data: { $ref: '#/components/schemas/ClaimRegisteredData' }
    claimDecisionProposed:
      name: petvold.claim.decision_proposed.v1
      title: claim.decision_proposed
      summary: "A decision above the handler's limit waits for approval (ADR 0019)."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.decision_proposed.v1 }
              data: { $ref: '#/components/schemas/ClaimDecisionProposedData' }
    claimProposalReturned:
      name: petvold.claim.proposal_returned.v1
      title: claim.proposal_returned
      summary: 'An approver returned a decision proposal.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.proposal_returned.v1 }
              data: { $ref: '#/components/schemas/ClaimProposalReturnedData' }
    claimDecided:
      name: petvold.claim.decided.v1
      title: claim.decided
      summary: 'A claim was decided or reassessed.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.decided.v1 }
              data: { $ref: '#/components/schemas/ClaimDecidedData' }
    claimPayoutOrdered:
      name: petvold.claim.payout_ordered.v1
      title: claim.payout_ordered
      summary: 'A decision raised the payout: pay the difference.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.payout_ordered.v1 }
              data: { $ref: '#/components/schemas/ClaimPayoutOrderedData' }
    claimReviewRequested:
      name: petvold.claim.review_requested.v1
      title: claim.review_requested
      summary: 'The customer asked for a person to review an automated decision (ADR 0018).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.review_requested.v1 }
              data: { $ref: '#/components/schemas/ClaimReviewRequestedData' }
    claimWithdrawn:
      name: petvold.claim.withdrawn.v1
      title: claim.withdrawn
      summary: 'The customer withdrew the claim before it was decided (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.withdrawn.v1 }
              data: { $ref: '#/components/schemas/ClaimWithdrawnData' }
    claimDismissed:
      name: petvold.claim.dismissed.v1
      title: claim.dismissed
      summary: 'The claim was dismissed before it was decided, e.g. as a duplicate. Not a rejection (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.dismissed.v1 }
              data: { $ref: '#/components/schemas/ClaimDismissedData' }
    claimInformationRequested:
      name: petvold.claim.information_requested.v1
      title: claim.information_requested
      summary: 'The claims handler asked the customer or the clinic for more information (ADR 0036). The note stays inside Petvold.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_requested.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationReminded:
      name: petvold.claim.information_reminded.v1
      title: claim.information_reminded
      summary: 'The request was still open on its reminder day, and a reminder is due (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_reminded.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationReceived:
      name: petvold.claim.information_received.v1
      title: claim.information_received
      summary: 'The information came in and the request is answered, also after the due date (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_received.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationExpired:
      name: petvold.claim.information_expired.v1
      title: claim.information_expired
      summary: 'The due date passed without an answer. The claim goes back to a claims handler; it is not rejected (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_expired.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationCancelled:
      name: petvold.claim.information_cancelled.v1
      title: claim.information_cancelled
      summary: 'The request is no longer needed, or the claim was closed (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_cancelled.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimAttachmentAdded:
      name: petvold.claim.attachment_added.v1
      title: claim.attachment_added
      summary: 'A document was added to the claim, as a reference to the insurer''s archive (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.attachment_added.v1 }
              data: { $ref: '#/components/schemas/ClaimAttachmentAddedData' }
    claimCorrected:
      name: petvold.claim.corrected.v1
      title: claim.corrected
      summary: 'The claim''s details were corrected and it has a new revision (ADR 0036). Which fields changed, not the values or the reason.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.corrected.v1 }
              data: { $ref: '#/components/schemas/ClaimCorrectedData' }
    jobFailed:
      name: petvold.job.failed.v1
      title: job.failed
      summary: 'A run failed in a market (ADR 0037), for the insurer''s operations to alert on. See the error in the run''s history.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.job.failed.v1 }
              data: { $ref: '#/components/schemas/JobFailedData' }
    animalOwnershipChanged:
      name: petvold.animal.ownership_changed.v1
      title: animal.ownership_changed
      summary: 'An animal has a new owner.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.animal.ownership_changed.v1 }
              data: { $ref: '#/components/schemas/AnimalOwnershipChangedData' }
    animalDied:
      name: petvold.animal.died.v1
      title: animal.died
      summary: 'An animal died.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.animal.died.v1 }
              data: { $ref: '#/components/schemas/AnimalDiedData' }
    policyIssued:
      name: petvold.policy.issued.v1
      title: policy.issued
      summary: 'A policy was issued.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.issued.v1 }
              data: { $ref: '#/components/schemas/PolicyIssuedData' }
    policyChanged:
      name: petvold.policy.changed.v1
      title: policy.changed
      summary: 'The choices changed during a term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.changed.v1 }
              data: { $ref: '#/components/schemas/PolicyChangedData' }
    policyRenewed:
      name: petvold.policy.renewed.v1
      title: policy.renewed
      summary: 'A new term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.renewed.v1 }
              data: { $ref: '#/components/schemas/PolicyRenewedData' }
    policyTransferred:
      name: petvold.policy.transferred.v1
      title: policy.transferred
      summary: 'A new policyholder took over the policy.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.transferred.v1 }
              data: { $ref: '#/components/schemas/PolicyTransferredData' }
    policyCancelled:
      name: petvold.policy.cancelled.v1
      title: policy.cancelled
      summary: 'A policy ends early or at the end of a term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.cancelled.v1 }
              data: { $ref: '#/components/schemas/PolicyCancelledData' }
    policyReinstated:
      name: petvold.policy.reinstated.v1
      title: policy.reinstated
      summary: 'A cancellation was reversed.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.reinstated.v1 }
              data: { $ref: '#/components/schemas/PolicyReinstatedData' }
    applicationReceived:
      name: petvold.application.received.v1
      title: application.received
      summary: 'An application came in.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.received.v1 }
              data: { $ref: '#/components/schemas/ApplicationReceivedData' }
    applicationAccepted:
      name: petvold.application.accepted.v1
      title: application.accepted
      summary: 'An application was accepted and the policy issued.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.accepted.v1 }
              data: { $ref: '#/components/schemas/ApplicationAcceptedData' }
    applicationReferred:
      name: petvold.application.referred.v1
      title: application.referred
      summary: 'An application waits for a person.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.referred.v1 }
              data: { $ref: '#/components/schemas/ApplicationReferredData' }
    applicationDeclined:
      name: petvold.application.declined.v1
      title: application.declined
      summary: 'An application was declined, by the rules (reasons) or a person (reason).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.declined.v1 }
              data: { $ref: '#/components/schemas/ApplicationDeclinedData' }
    applicationWithdrawn:
      name: petvold.application.withdrawn.v1
      title: application.withdrawn
      summary: 'The channel withdrew a referred application.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.withdrawn.v1 }
              data: { $ref: '#/components/schemas/ApplicationWithdrawnData' }
    applicationExpired:
      name: petvold.application.expired.v1
      title: application.expired
      summary: 'A referred application was not decided in time.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.expired.v1 }
              data: { $ref: '#/components/schemas/ApplicationExpiredData' }
    proposalCreated:
      name: petvold.proposal.created.v1
      title: proposal.created
      summary: 'A proposal to accept or reject: a transfer to a new owner, or a cancellation when the animal died.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.proposal.created.v1 }
              data: { $ref: '#/components/schemas/ProposalCreatedData' }
    noticeCreated:
      name: petvold.notice.created.v1
      title: notice.created
      summary: 'A notice the law requires was made (ADR 0032). Fetch it with GET /v1/notices/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.created.v1 }
              data: { $ref: '#/components/schemas/NoticeCreatedData' }
    noticeDelivered:
      name: petvold.notice.delivered.v1
      title: notice.delivered
      summary: 'The document system reported a notice sent.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.delivered.v1 }
              data: { $ref: '#/components/schemas/NoticeDeliveredData' }
    noticeFailed:
      name: petvold.notice.failed.v1
      title: notice.failed
      summary: 'The document system reported a notice that could not be sent.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.failed.v1 }
              data: { $ref: '#/components/schemas/NoticeFailedData' }

  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, market, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, description: Unique per source. Use it to recognize repeats. }
        source: { type: string, enum: [/petvold/claims, /petvold/animals, /petvold/policies, /petvold/communications] }
        type: { type: string, pattern: '^petvold\.[a-z]+\.[a-z_]+\.v[0-9]+$' }
        subject: { type: string, description: The id of the resource the event concerns. }
        time: { type: string, format: date-time }
        datacontenttype: { const: application/json }
        market: { type: string, pattern: '^[A-Z]{2}$' }
        data: { type: object }
    Date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    PartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: integer, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ClaimRegisteredData:
      type: object
      additionalProperties: false
      required: [claimId, claimNo, policyId, animalId, channel, treatmentFrom, treatmentTo, diagnosisCode, currency]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        claimNo: { type: string }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        channel: { type: string }
        clinicId: { type: string }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        treatmentTo: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ClaimDecisionProposedData:
      type: object
      additionalProperties: false
      required: [claimId, proposalId, action, outcome, payout, currency, deviatesFromProposal]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        proposalId: { type: string }
        action: { type: string, enum: [accept, reject] }
        outcome: { type: string }
