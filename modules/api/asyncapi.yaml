    InvoiceIssuedData:
      type: object
      additionalProperties: false
      required: [invoiceId, invoiceNo, accountId, partyId, issueDate, dueDate, total, currency, reference, policyIds]
      properties:
        invoiceId: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
        invoiceNo: { type: string, description: 'From the market''s unbroken series, e.g. SE-2026-000001.' }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        partyId: { $ref: '#/components/schemas/PartyId' }
        issueDate: { $ref: '#/components/schemas/Date' }
        dueDate: { $ref: '#/components/schemas/Date' }
        total: { type: integer, minimum: 0, description: In minor units of currency. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reference: { type: string, description: 'The payment reference: OCR in Sweden, RF (ISO 11649) in EUR markets.' }
        policyIds:
          type: array
          items: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    InvoiceCreditedData:
      type: object
      additionalProperties: false
