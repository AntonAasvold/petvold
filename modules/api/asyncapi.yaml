asyncapi: 3.0.0
info:
  title: Petvold events
  version: 0.1.0
  description: |
    The events Petvold sends to the insurer's systems with webhooks (ADR 0033).
    Each is a CloudEvent 1.0 in structured mode, signed as Standard Webhooks.
    `data` holds ids and fields that are not personal data; fetch the rest with
    the API (`modules/api/openapi.yaml`) and your own token.

    Subscribe with `POST /v1/webhook-subscriptions`. Check `webhook-signature`:
    the HMAC-SHA256 of `webhook-id.webhook-timestamp.body` with the secret after
    `whsec_`, base64. Reject a timestamp more than five minutes off. Use
    `webhook-id` (the event's `id`) to recognize repeats; delivery is at least
    once and in no promised order.

    The fields of `data` per type are the contract. `lint:openapi` checks them
    against the catalog in `modules/webhooks/src/index.ts` (`PUBLIC_EVENTS`).
defaultContentType: application/cloudevents+json

channels:
  subscription:
    address: '{url}'
    description: The address of a webhook subscription.
    parameters:
      url:
        description: The subscription's url.
    messages:
      claimRegistered: { $ref: '#/components/messages/claimRegistered' }
      claimDecisionProposed: { $ref: '#/components/messages/claimDecisionProposed' }
      claimProposalReturned: { $ref: '#/components/messages/claimProposalReturned' }
      claimDecided: { $ref: '#/components/messages/claimDecided' }
      claimPayoutOrdered: { $ref: '#/components/messages/claimPayoutOrdered' }
      claimPayoutReduced: { $ref: '#/components/messages/claimPayoutReduced' }
      claimReviewRequested: { $ref: '#/components/messages/claimReviewRequested' }
      claimWithdrawn: { $ref: '#/components/messages/claimWithdrawn' }
      claimDismissed: { $ref: '#/components/messages/claimDismissed' }
      claimCorrected: { $ref: '#/components/messages/claimCorrected' }
      claimAttachmentAdded: { $ref: '#/components/messages/claimAttachmentAdded' }
      claimInformationRequested: { $ref: '#/components/messages/claimInformationRequested' }
      claimInformationReminded: { $ref: '#/components/messages/claimInformationReminded' }
      claimInformationReceived: { $ref: '#/components/messages/claimInformationReceived' }
      claimInformationExpired: { $ref: '#/components/messages/claimInformationExpired' }
      claimInformationCancelled: { $ref: '#/components/messages/claimInformationCancelled' }
      jobFailed: { $ref: '#/components/messages/jobFailed' }
      animalOwnershipChanged: { $ref: '#/components/messages/animalOwnershipChanged' }
      animalDied: { $ref: '#/components/messages/animalDied' }
      policyIssued: { $ref: '#/components/messages/policyIssued' }
      policyChanged: { $ref: '#/components/messages/policyChanged' }
      policyRenewed: { $ref: '#/components/messages/policyRenewed' }
      policyTransferred: { $ref: '#/components/messages/policyTransferred' }
      policyCancelled: { $ref: '#/components/messages/policyCancelled' }
      policyReinstated: { $ref: '#/components/messages/policyReinstated' }
      applicationReceived: { $ref: '#/components/messages/applicationReceived' }
      applicationAccepted: { $ref: '#/components/messages/applicationAccepted' }
      applicationReferred: { $ref: '#/components/messages/applicationReferred' }
      applicationDeclined: { $ref: '#/components/messages/applicationDeclined' }
      applicationWithdrawn: { $ref: '#/components/messages/applicationWithdrawn' }
      applicationExpired: { $ref: '#/components/messages/applicationExpired' }
      proposalCreated: { $ref: '#/components/messages/proposalCreated' }
      noticeCreated: { $ref: '#/components/messages/noticeCreated' }
      noticeDocumentMade: { $ref: '#/components/messages/noticeDocumentMade' }
      noticeDelivered: { $ref: '#/components/messages/noticeDelivered' }
      noticeFailed: { $ref: '#/components/messages/noticeFailed' }
      invoiceIssued: { $ref: '#/components/messages/invoiceIssued' }
      invoiceCredited: { $ref: '#/components/messages/invoiceCredited' }
      invoicePaid: { $ref: '#/components/messages/invoicePaid' }
      invoiceOverdue: { $ref: '#/components/messages/invoiceOverdue' }
      refundOrdered: { $ref: '#/components/messages/refundOrdered' }
      paymentMatched: { $ref: '#/components/messages/paymentMatched' }
      recoveryProposed: { $ref: '#/components/messages/recoveryProposed' }
      recoveryDecided: { $ref: '#/components/messages/recoveryDecided' }
      accountingDayClosed: { $ref: '#/components/messages/accountingDayClosed' }
      paymentSucceeded: { $ref: '#/components/messages/paymentSucceeded' }
      payoutPaid: { $ref: '#/components/messages/payoutPaid' }
      payoutFailed: { $ref: '#/components/messages/payoutFailed' }

operations:
  sendEvent:
    action: send
    channel: { $ref: '#/channels/subscription' }
    summary: Petvold posts an event to the subscription's address.
    messages:
      - { $ref: '#/channels/subscription/messages/claimRegistered' }
      - { $ref: '#/channels/subscription/messages/claimDecisionProposed' }
      - { $ref: '#/channels/subscription/messages/claimProposalReturned' }
      - { $ref: '#/channels/subscription/messages/claimDecided' }
      - { $ref: '#/channels/subscription/messages/claimPayoutOrdered' }
      - { $ref: '#/channels/subscription/messages/claimPayoutReduced' }
      - { $ref: '#/channels/subscription/messages/claimReviewRequested' }
      - { $ref: '#/channels/subscription/messages/claimWithdrawn' }
      - { $ref: '#/channels/subscription/messages/claimDismissed' }
      - { $ref: '#/channels/subscription/messages/claimCorrected' }
      - { $ref: '#/channels/subscription/messages/claimAttachmentAdded' }
      - { $ref: '#/channels/subscription/messages/claimInformationRequested' }
      - { $ref: '#/channels/subscription/messages/claimInformationReminded' }
      - { $ref: '#/channels/subscription/messages/claimInformationReceived' }
      - { $ref: '#/channels/subscription/messages/claimInformationExpired' }
      - { $ref: '#/channels/subscription/messages/claimInformationCancelled' }
      - { $ref: '#/channels/subscription/messages/jobFailed' }
      - { $ref: '#/channels/subscription/messages/animalOwnershipChanged' }
      - { $ref: '#/channels/subscription/messages/animalDied' }
      - { $ref: '#/channels/subscription/messages/policyIssued' }
      - { $ref: '#/channels/subscription/messages/policyChanged' }
      - { $ref: '#/channels/subscription/messages/policyRenewed' }
      - { $ref: '#/channels/subscription/messages/policyTransferred' }
      - { $ref: '#/channels/subscription/messages/policyCancelled' }
      - { $ref: '#/channels/subscription/messages/policyReinstated' }
      - { $ref: '#/channels/subscription/messages/applicationReceived' }
      - { $ref: '#/channels/subscription/messages/applicationAccepted' }
      - { $ref: '#/channels/subscription/messages/applicationReferred' }
      - { $ref: '#/channels/subscription/messages/applicationDeclined' }
      - { $ref: '#/channels/subscription/messages/applicationWithdrawn' }
      - { $ref: '#/channels/subscription/messages/applicationExpired' }
      - { $ref: '#/channels/subscription/messages/proposalCreated' }
      - { $ref: '#/channels/subscription/messages/noticeCreated' }
      - { $ref: '#/channels/subscription/messages/noticeDocumentMade' }
      - { $ref: '#/channels/subscription/messages/noticeDelivered' }
      - { $ref: '#/channels/subscription/messages/noticeFailed' }
      - { $ref: '#/channels/subscription/messages/invoiceIssued' }
      - { $ref: '#/channels/subscription/messages/invoiceCredited' }
      - { $ref: '#/channels/subscription/messages/invoicePaid' }
      - { $ref: '#/channels/subscription/messages/invoiceOverdue' }
      - { $ref: '#/channels/subscription/messages/refundOrdered' }
      - { $ref: '#/channels/subscription/messages/paymentMatched' }
      - { $ref: '#/channels/subscription/messages/recoveryProposed' }
      - { $ref: '#/channels/subscription/messages/recoveryDecided' }
      - { $ref: '#/channels/subscription/messages/accountingDayClosed' }
      - { $ref: '#/channels/subscription/messages/paymentSucceeded' }
      - { $ref: '#/channels/subscription/messages/payoutPaid' }
      - { $ref: '#/channels/subscription/messages/payoutFailed' }

components:
  messageTraits:
    webhook:
      headers:
        type: object
        required: [webhook-id, webhook-timestamp, webhook-signature]
        properties:
          webhook-id: { type: string, description: The event's id. The same at every attempt. }
          webhook-timestamp: { type: string, description: Unix seconds when this attempt was signed. }
          webhook-signature: { type: string, description: "One or more 'v1,<base64>', separated by spaces: two during a rotation of the secret." }

  messages:
    claimRegistered:
      name: petvold.claim.registered.v1
      title: claim.registered
      summary: 'A claim was registered.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.registered.v1 }
              data: { $ref: '#/components/schemas/ClaimRegisteredData' }
    claimDecisionProposed:
      name: petvold.claim.decision_proposed.v1
      title: claim.decision_proposed
      summary: "A decision above the handler's limit waits for approval (ADR 0019)."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.decision_proposed.v1 }
              data: { $ref: '#/components/schemas/ClaimDecisionProposedData' }
    claimProposalReturned:
      name: petvold.claim.proposal_returned.v1
      title: claim.proposal_returned
      summary: 'An approver returned a decision proposal.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.proposal_returned.v1 }
              data: { $ref: '#/components/schemas/ClaimProposalReturnedData' }
    claimDecided:
      name: petvold.claim.decided.v1
      title: claim.decided
      summary: 'A claim was decided or reassessed.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.decided.v1 }
              data: { $ref: '#/components/schemas/ClaimDecidedData' }
    claimPayoutOrdered:
      name: petvold.claim.payout_ordered.v1
      title: claim.payout_ordered
      summary: 'A decision raised the payout: pay the difference.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.payout_ordered.v1 }
              data: { $ref: '#/components/schemas/ClaimPayoutOrderedData' }
    claimPayoutReduced:
      name: petvold.claim.payout_reduced.v1
      title: claim.payout_reduced
      summary: 'A decision lowered the payout: billing proposes recovery of the difference (ADR 0040).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.payout_reduced.v1 }
              data: { $ref: '#/components/schemas/ClaimPayoutReducedData' }
    claimReviewRequested:
      name: petvold.claim.review_requested.v1
      title: claim.review_requested
      summary: 'The customer asked for a person to review an automated decision (ADR 0018).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.review_requested.v1 }
              data: { $ref: '#/components/schemas/ClaimReviewRequestedData' }
    claimWithdrawn:
      name: petvold.claim.withdrawn.v1
      title: claim.withdrawn
      summary: 'The customer withdrew the claim before it was decided (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.withdrawn.v1 }
              data: { $ref: '#/components/schemas/ClaimWithdrawnData' }
    claimDismissed:
      name: petvold.claim.dismissed.v1
      title: claim.dismissed
      summary: 'The claim was dismissed before it was decided, e.g. as a duplicate. Not a rejection (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.dismissed.v1 }
              data: { $ref: '#/components/schemas/ClaimDismissedData' }
    claimInformationRequested:
      name: petvold.claim.information_requested.v1
      title: claim.information_requested
      summary: 'The claims handler asked the customer or the clinic for more information (ADR 0036). The note stays inside Petvold.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_requested.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationReminded:
      name: petvold.claim.information_reminded.v1
      title: claim.information_reminded
      summary: 'The request was still open on its reminder day, and a reminder is due (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_reminded.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationReceived:
      name: petvold.claim.information_received.v1
      title: claim.information_received
      summary: 'The information came in and the request is answered, also after the due date (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_received.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationExpired:
      name: petvold.claim.information_expired.v1
      title: claim.information_expired
      summary: 'The due date passed without an answer. The claim goes back to a claims handler; it is not rejected (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_expired.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimInformationCancelled:
      name: petvold.claim.information_cancelled.v1
      title: claim.information_cancelled
      summary: 'The request is no longer needed, or the claim was closed (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.information_cancelled.v1 }
              data: { $ref: '#/components/schemas/ClaimInformationRequestData' }
    claimAttachmentAdded:
      name: petvold.claim.attachment_added.v1
      title: claim.attachment_added
      summary: 'A document was added to the claim, as a reference to the insurer''s archive (ADR 0036).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.attachment_added.v1 }
              data: { $ref: '#/components/schemas/ClaimAttachmentAddedData' }
    claimCorrected:
      name: petvold.claim.corrected.v1
      title: claim.corrected
      summary: 'The claim''s details were corrected and it has a new revision (ADR 0036). Which fields changed, not the values or the reason.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.claim.corrected.v1 }
              data: { $ref: '#/components/schemas/ClaimCorrectedData' }
    jobFailed:
      name: petvold.job.failed.v1
      title: job.failed
      summary: 'A run failed in a market (ADR 0037), for the insurer''s operations to alert on. See the error in the run''s history.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.job.failed.v1 }
              data: { $ref: '#/components/schemas/JobFailedData' }
    animalOwnershipChanged:
      name: petvold.animal.ownership_changed.v1
      title: animal.ownership_changed
      summary: 'An animal has a new owner.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.animal.ownership_changed.v1 }
              data: { $ref: '#/components/schemas/AnimalOwnershipChangedData' }
    animalDied:
      name: petvold.animal.died.v1
      title: animal.died
      summary: 'An animal died.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.animal.died.v1 }
              data: { $ref: '#/components/schemas/AnimalDiedData' }
    policyIssued:
      name: petvold.policy.issued.v1
      title: policy.issued
      summary: 'A policy was issued.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.issued.v1 }
              data: { $ref: '#/components/schemas/PolicyIssuedData' }
    policyChanged:
      name: petvold.policy.changed.v1
      title: policy.changed
      summary: 'The choices changed during a term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.changed.v1 }
              data: { $ref: '#/components/schemas/PolicyChangedData' }
    policyRenewed:
      name: petvold.policy.renewed.v1
      title: policy.renewed
      summary: 'A new term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.renewed.v1 }
              data: { $ref: '#/components/schemas/PolicyRenewedData' }
    policyTransferred:
      name: petvold.policy.transferred.v1
      title: policy.transferred
      summary: 'A new policyholder took over the policy.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.transferred.v1 }
              data: { $ref: '#/components/schemas/PolicyTransferredData' }
    policyCancelled:
      name: petvold.policy.cancelled.v1
      title: policy.cancelled
      summary: 'A policy ends early or at the end of a term.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.cancelled.v1 }
              data: { $ref: '#/components/schemas/PolicyCancelledData' }
    policyReinstated:
      name: petvold.policy.reinstated.v1
      title: policy.reinstated
      summary: 'A cancellation was reversed.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.policy.reinstated.v1 }
              data: { $ref: '#/components/schemas/PolicyReinstatedData' }
    applicationReceived:
      name: petvold.application.received.v1
      title: application.received
      summary: 'An application came in.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.received.v1 }
              data: { $ref: '#/components/schemas/ApplicationReceivedData' }
    applicationAccepted:
      name: petvold.application.accepted.v1
      title: application.accepted
      summary: 'An application was accepted and the policy issued.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.accepted.v1 }
              data: { $ref: '#/components/schemas/ApplicationAcceptedData' }
    applicationReferred:
      name: petvold.application.referred.v1
      title: application.referred
      summary: 'An application waits for a person.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.referred.v1 }
              data: { $ref: '#/components/schemas/ApplicationReferredData' }
    applicationDeclined:
      name: petvold.application.declined.v1
      title: application.declined
      summary: 'An application was declined, by the rules (reasons) or a person (reason).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.declined.v1 }
              data: { $ref: '#/components/schemas/ApplicationDeclinedData' }
    applicationWithdrawn:
      name: petvold.application.withdrawn.v1
      title: application.withdrawn
      summary: 'The channel withdrew a referred application.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.withdrawn.v1 }
              data: { $ref: '#/components/schemas/ApplicationWithdrawnData' }
    applicationExpired:
      name: petvold.application.expired.v1
      title: application.expired
      summary: 'A referred application was not decided in time.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.application.expired.v1 }
              data: { $ref: '#/components/schemas/ApplicationExpiredData' }
    proposalCreated:
      name: petvold.proposal.created.v1
      title: proposal.created
      summary: 'A proposal to accept or reject: a transfer to a new owner, or a cancellation when the animal died.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.proposal.created.v1 }
              data: { $ref: '#/components/schemas/ProposalCreatedData' }
    invoiceIssued:
      name: petvold.invoice.issued.v1
      title: invoice.issued
      summary: 'The invoicing run made an invoice (ADR 0040). Fetch it with GET /v1/invoices/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.invoice.issued.v1 }
              data: { $ref: '#/components/schemas/InvoiceIssuedData' }
    invoiceCredited:
      name: petvold.invoice.credited.v1
      title: invoice.credited
      summary: 'A credit note took an amount off an invoice, after a change, a cancellation or a transfer (ADR 0040). Fetch it with GET /v1/credit-notes/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.invoice.credited.v1 }
              data: { $ref: '#/components/schemas/InvoiceCreditedData' }
    accountingDayClosed:
      name: petvold.accounting.day_closed.v1
      title: accounting.day_closed
      summary: "A day of verifications is closed and handed to the insurer's system (ADR 0040). The subject is the day; the file with GET /v1/day-closes/{market}/{day}/file."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.accounting.day_closed.v1 }
              data: { $ref: '#/components/schemas/AccountingDayClosedData' }
    paymentMatched:
      name: petvold.payment.matched.v1
      title: payment.matched
      summary: 'A payment belongs to a payer account now: by an invoice''s reference, or matched by a person (ADR 0040). Fetch it with GET /v1/received-payments/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.payment.matched.v1 }
              data: { $ref: '#/components/schemas/PaymentMatchedData' }
    recoveryProposed:
      name: petvold.recovery.proposed.v1
      title: recovery.proposed
      summary: "A claim's payout was lowered after it was ordered: the difference is proposed for recovery, for a person to decide (ADR 0040)."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.recovery.proposed.v1 }
              data: { $ref: '#/components/schemas/RecoveryProposedData' }
    recoveryDecided:
      name: petvold.recovery.decided.v1
      title: recovery.decided
      summary: 'A person decided a recovery: recover it from the customer, offset it against their credit, or write it off (ADR 0040).'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.recovery.decided.v1 }
              data: { $ref: '#/components/schemas/RecoveryDecidedData' }
    refundOrdered:
      name: petvold.refund.ordered.v1
      title: refund.ordered
      summary: "A payer's credit is paid back (ADR 0040). Payments pays it out as payout.paid with purpose premium-refund. Fetch it with GET /v1/refunds."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.refund.ordered.v1 }
              data: { $ref: '#/components/schemas/RefundOrderedData' }
    invoiceOverdue:
      name: petvold.invoice.overdue.v1
      title: invoice.overdue
      summary: 'An invoice is still open after the market''s days past its due date, and the payer is reminded (ADR 0040). Notice of cancellation may follow as policy.cancelled with the reason unpaid-premium.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.invoice.overdue.v1 }
              data: { $ref: '#/components/schemas/InvoiceOverdueData' }
    invoicePaid:
      name: petvold.invoice.paid.v1
      title: invoice.paid
      summary: 'A payment settled what was left on an invoice (ADR 0040). The invoice and its payments with GET /v1/invoices/{id} and GET /v1/received-payments.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.invoice.paid.v1 }
              data: { $ref: '#/components/schemas/InvoicePaidData' }
    paymentSucceeded:
      name: petvold.payment.succeeded.v1
      title: payment.succeeded
      summary: 'A payment reached the insurer''s account, as the payment service reported it (ADR 0017). Fetch it with GET /v1/payments/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.payment.succeeded.v1 }
              data: { $ref: '#/components/schemas/PaymentSucceededData' }
    payoutPaid:
      name: petvold.payout.paid.v1
      title: payout.paid
      summary: "A claim's payout reached the payee (ADR 0040). Fetch it with GET /v1/payouts/{id}."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.payout.paid.v1 }
              data: { $ref: '#/components/schemas/PayoutData' }
    payoutFailed:
      name: petvold.payout.failed.v1
      title: payout.failed
      summary: "The payment service could not pay a claim's payout (ADR 0040)."
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.payout.failed.v1 }
              data: { $ref: '#/components/schemas/PayoutData' }
    noticeCreated:
      name: petvold.notice.created.v1
      title: notice.created
      summary: 'A notice the law requires was made (ADR 0032). Fetch it with GET /v1/notices/{id}.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.created.v1 }
              data: { $ref: '#/components/schemas/NoticeCreatedData' }
    noticeDocumentMade:
      name: petvold.notice.document_made.v1
      title: notice.document_made
      summary: 'Petvold made the notice''s PDF (ADR 0038), for a market where Petvold makes the documents. Fetch it with GET /v1/documents/{documentId}, send it, and report the delivery without documentId and sha256.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.document_made.v1 }
              data: { $ref: '#/components/schemas/NoticeDocumentMadeData' }
    noticeDelivered:
      name: petvold.notice.delivered.v1
      title: notice.delivered
      summary: 'The document system reported a notice sent.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.delivered.v1 }
              data: { $ref: '#/components/schemas/NoticeDeliveredData' }
    noticeFailed:
      name: petvold.notice.failed.v1
      title: notice.failed
      summary: 'The document system reported a notice that could not be sent.'
      traits: [{ $ref: '#/components/messageTraits/webhook' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type: { const: petvold.notice.failed.v1 }
              data: { $ref: '#/components/schemas/NoticeFailedData' }

  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, market, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, description: Unique per source. Use it to recognize repeats. }
        source: { type: string, enum: [/petvold/claims, /petvold/animals, /petvold/policies, /petvold/communications, /petvold/scheduling, /petvold/billing, /petvold/payments, /petvold/accounting] }
        type: { type: string, pattern: '^petvold\.[a-z]+\.[a-z_]+\.v[0-9]+$' }
        subject: { type: string, description: The id of the resource the event concerns. }
        time: { type: string, format: date-time }
        datacontenttype: { const: application/json }
        market: { type: string, pattern: '^[A-Z]{2}$' }
        data: { type: object }
        sequence:
          type: string
          pattern: '^[0-9]{20}$'
          description: |
            CloudEvents extension: the event's position in its source's outbox,
            zero-padded so that it orders as a string. Increasing per `source`.
            A gap does not mean an event is missing (a transaction that rolled
            back leaves one). Omitted for events without an outbox, e.g. job.failed.
    Date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    PartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: integer, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ClaimRegisteredData:
      type: object
      additionalProperties: false
      required: [claimId, claimNo, policyId, animalId, channel, treatmentFrom, treatmentTo, diagnosisCode, currency]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        claimNo: { type: string }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        channel: { type: string }
        clinicId: { type: string }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        treatmentTo: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ClaimDecisionProposedData:
      type: object
      additionalProperties: false
      required: [claimId, proposalId, action, outcome, payout, currency, deviatesFromProposal]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        proposalId: { type: string }
        action: { type: string, enum: [accept, reject] }
        outcome: { type: string }
        payout: { type: integer, minimum: 0, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        deviatesFromProposal: { type: boolean }
        reasonCode: { type: string }
    ClaimProposalReturnedData:
      type: object
      additionalProperties: false
      required: [claimId, proposalId]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        proposalId: { type: string }
    ClaimDecidedData:
      type: object
      additionalProperties: false
      required: [claimId, decisionId, seq, outcome, payout, currency, automated, deviatesFromProposal]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        decisionId: { type: string }
        seq: { type: integer, minimum: 1 }
        outcome: { type: string }
        payout: { type: integer, minimum: 0, description: "Minor units. The claim's whole payout after this decision, not the change. An increase over the previous decision gives a claim.payout_ordered with the difference." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        automated: { type: boolean, description: No person judged the outcome. }
        deviatesFromProposal: { type: boolean }
        reasonCode: { type: string }
        reviewRequestId: { type: string }
    ClaimPayoutOrderedData:
      type: object
      additionalProperties: false
      required: [claimId, payoutOrderId, decisionId, policyId, amount, currency, channel]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        payoutOrderId: { type: string }
        decisionId: { type: string }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        amount: { type: integer, minimum: 1, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        channel: { type: string }
        clinicId: { type: string }
    ClaimPayoutReducedData:
      type: object
      additionalProperties: false
      required: [claimId, payoutReductionId, decisionId, policyId, amount, currency, channel]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        payoutReductionId: { type: string }
        decisionId: { type: string }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        amount: { type: integer, minimum: 1, description: "Minor units: the decrease. Nothing is drawn back by itself; billing proposes recovery." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        channel: { type: string }
        clinicId: { type: string }
    ClaimReviewRequestedData:
      type: object
      additionalProperties: false
      required: [claimId, reviewRequestId, decisionId, decisionSeq]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        reviewRequestId: { type: string }
        decisionId: { type: string }
        decisionSeq: { type: integer, minimum: 1 }
    ClaimWithdrawnData:
      type: object
      additionalProperties: false
      required: [claimId, closureId]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        closureId: { type: string }
    ClaimDismissedData:
      type: object
      additionalProperties: false
      required: [claimId, closureId, reasonCode]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        closureId: { type: string }
        reasonCode: { type: string, enum: [duplicate, registered-in-error, not-a-claim] }
        duplicateOf: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
    ClaimAttachmentAddedData:
      type: object
      additionalProperties: false
      required: [claimId, attachmentId, kind, mediaType, size, sha256, url]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        attachmentId: { type: string }
        kind: { type: string, enum: [invoice, medical-record, referral, photo, other] }
        mediaType: { type: string }
        size: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        url: { type: string, description: 'The address in the insurer''s archive.' }
        replaces: { type: string }
    ClaimCorrectedData:
      type: object
      additionalProperties: false
      required: [claimId, correctionId, revision, fields, reopens]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        correctionId: { type: string }
        revision: { type: integer, minimum: 2 }
        fields:
          type: array
          minItems: 1
          items: { type: string, enum: [channel, treatmentFrom, treatmentTo, diagnosisCode, lines] }
        reopens: { type: boolean, description: 'The claim waits for a new decision by a person.' }
    ClaimInformationRequestData:
      type: object
      additionalProperties: false
      required: [claimId, requestId, recipient, items, dueDate, status]
      properties:
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        requestId: { type: string, pattern: '^inf_[A-Za-z0-9_]+$' }
        recipient: { type: string, enum: [customer, clinic] }
        items:
          type: array
          minItems: 1
          items: { type: string, enum: [itemised-invoice, medical-record, referral, other] }
        dueDate: { type: string, format: date, description: 'The last day to answer, in the claim''s market.' }
        status: { type: string, enum: [open, answered, expired, cancelled] }
    JobFailedData:
      type: object
      additionalProperties: false
      required: [runId, job, trigger, startedAt]
      properties:
        runId: { type: string }
        job: { type: string, description: 'The job''s name, e.g. policies.renewal.' }
        trigger: { type: string, enum: [schedule, manual, api] }
        startedAt: { type: string, format: date-time }
    AnimalOwnershipChangedData:
      type: object
      additionalProperties: false
      required: [animalId, fromPartyId, toPartyId, from]
      properties:
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        fromPartyId: { $ref: '#/components/schemas/PartyId' }
        toPartyId: { $ref: '#/components/schemas/PartyId' }
        from: { $ref: '#/components/schemas/Date' }
    AnimalDiedData:
      type: object
      additionalProperties: false
      required: [animalId, deceasedOn]
      properties:
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
    PolicyIssuedData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, animalId, policyholderPartyId, productVersion, startDate, endDate, premium]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        policyholderPartyId: { $ref: '#/components/schemas/PartyId' }
        productVersion: { type: string, description: 'e.g. SE-HUND-PLUS@2026.1' }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date', description: Exclusive. }
        premium: { $ref: '#/components/schemas/Money' }
        paymentInterval: { type: string, enum: [year, half-year, quarter, month], description: 'How often the customer chose to pay (ADR 0040).' }
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
    PolicyChangedData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, termNo, changeNo, from]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        termNo: { type: integer, minimum: 1 }
        changeNo: { type: integer, minimum: 1 }
        from: { $ref: '#/components/schemas/Date' }
        premiumAdjustment: { type: integer, description: Minor units; negative is money back. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    PolicyRenewedData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, termNo, startDate, endDate, productVersion, premium]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        termNo: { type: integer, minimum: 1 }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date', description: Exclusive. }
        productVersion: { type: string, description: 'e.g. SE-HUND-PLUS@2026.1' }
        premium: { $ref: '#/components/schemas/Money' }
    PolicyTransferredData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, fromPartyId, toPartyId, from]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        fromPartyId: { $ref: '#/components/schemas/PartyId' }
        toPartyId: { $ref: '#/components/schemas/PartyId' }
        from: { $ref: '#/components/schemas/Date' }
        premium: { $ref: '#/components/schemas/Money' }
    PolicyCancelledData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, reason, effectiveDate, refund]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        reason: { type: string, description: A reason code. }
        effectiveDate: { $ref: '#/components/schemas/Date', description: The first day the policy no longer applies. }
        refund: { $ref: '#/components/schemas/Money' }
    PolicyReinstatedData:
      type: object
      additionalProperties: false
      required: [policyId, transactionId, reverses]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        transactionId: { type: string, pattern: '^ptx_' }
        reverses: { type: string, description: The transaction reversed. }
        refundReversed: { $ref: '#/components/schemas/Money' }
    ApplicationReceivedData:
      type: object
      additionalProperties: false
      required: [applicationId, animalId, productVersion]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        productVersion: { type: string, description: 'e.g. SE-HUND-PLUS@2026.1' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    ApplicationAcceptedData:
      type: object
      additionalProperties: false
      required: [applicationId, policyId]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        outcome: { type: string }
        riders: { type: integer, minimum: 0, description: How many riders the policy got. }
    ApplicationReferredData:
      type: object
      additionalProperties: false
      required: [applicationId, outcome, reasons]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        outcome: { type: string }
        reasons: { type: array, items: { type: string }, description: Reason codes. }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    ApplicationDeclinedData:
      type: object
      additionalProperties: false
      required: [applicationId]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        outcome: { type: string }
        reasons: { type: array, items: { type: string }, description: Reason codes. }
        reason: { type: string, description: A reason code. }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    ApplicationWithdrawnData:
      type: object
      additionalProperties: false
      required: [applicationId]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    ApplicationExpiredData:
      type: object
      additionalProperties: false
      required: [applicationId, deadline]
      properties:
        applicationId: { type: string, pattern: '^app_[A-Za-z0-9]+$' }
        deadline: { $ref: '#/components/schemas/Date' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    ProposalCreatedData:
      type: object
      additionalProperties: false
      required: [policyId, proposalId, kind]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        proposalId: { type: string }
        kind: { type: string, enum: [transfer, cancel-death] }
        fromPartyId: { $ref: '#/components/schemas/PartyId' }
        toPartyId: { $ref: '#/components/schemas/PartyId' }
        from: { $ref: '#/components/schemas/Date' }
        deadline: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
    AccountingDayClosedData:
      type: object
      additionalProperties: false
      required: [day, verificationCount, totals, chartVersion, unmapped, csvSha256]
      properties:
        day: { $ref: '#/components/schemas/Date' }
        verificationCount: { type: integer, minimum: 0 }
        totals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, debit, credit]
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              debit: { type: integer, minimum: 0 }
              credit: { type: integer, minimum: 0 }
        chartVersion: { type: integer, minimum: 0 }
        unmapped: { type: array, items: { type: string } }
        csvSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    PaymentMatchedData:
      type: object
      additionalProperties: false
      required: [paymentId, accountId, amount, currency, how, bookedOn]
      properties:
        paymentId: { type: string, pattern: '^pay_[A-Za-z0-9]+$' }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        amount: { type: integer, minimum: 1, description: The whole payment, in minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        how: { type: string, enum: [reference, manual] }
        bookedOn: { $ref: '#/components/schemas/Date' }
        invoiceId: { type: string, pattern: '^inv_[A-Za-z0-9]+$', description: The invoice it paid first. }
    RecoveryProposedData:
      type: object
      additionalProperties: false
      required: [recoveryId, claimId, policyId, partyId, amount, currency]
      properties:
        recoveryId: { type: string, pattern: '^rcv_[A-Za-z0-9]+$' }
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        partyId: { type: string }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$', description: "The payer's account, if the customer has one." }
        amount: { type: integer, minimum: 1, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    RecoveryDecidedData:
      type: object
      additionalProperties: false
      required: [recoveryId, claimId, policyId, partyId, amount, currency, outcome]
      properties:
        recoveryId: { type: string, pattern: '^rcv_[A-Za-z0-9]+$' }
        claimId: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        partyId: { type: string }
        accountId: { type: string, pattern: '^bac_[A-Za-z0-9]+$', description: "The payer's account, if the customer has one." }
        amount: { type: integer, minimum: 1, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
