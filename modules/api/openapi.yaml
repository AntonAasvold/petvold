openapi: 3.1.0
info:
  title: Petvold API
  version: 0.1.0
  summary: Headless core for pet insurance – claims, rule sets, products, reference data, animals and access.
  description: |
    The contract is the source of truth. The server validates incoming
    requests against the schemas here, and the contract tests validate the responses.

    Conventions:
    - All amounts are integers in the smallest currency unit (`Money`); the currency is on the object.
    - Dates are `YYYY-MM-DD`, points in time ISO 8601 with time zone.
    - Errors are returned as `application/problem+json` (RFC 9457).
    - All creating POST requests require `Idempotency-Key`.
    - Every operation requires one permission, given in `x-permission`
      (e.g. `claims:decide`). The caller's roles come from the token and are
      mapped to permissions per installation. A missing permission gives 403.
    - Every caller has a scope (ADR 0016): the markets in its token, and for
      some roles its own clinic (`clinicId`) or a list of policies
      (`policyIds`). A claim outside the scope answers 404 exactly like a
      claim that does not exist. Registering or previewing a claim outside
      the scope gives 403. A clinic's claims get its `clinicId` from the token.
    - Market (ISO 3166-1) and currency (ISO 4217) are on every claim.
      Amounts are never converted: a claim has the same currency as the policy.
    - Rule outcomes have a stable `reason` and `params`. The text in `message`
      is a convenience in the language requested with `Accept-Language`
      (sv, en; default en).
servers:
  - url: http://localhost:8787
security:
  - bearerAuth: []
tags:
  - name: claims
  - name: decisions
  - name: reviews
  - name: approvals
  - name: access
  - name: rule-sets
  - name: reference-data
  - name: products
  - name: animals
  - name: previews
  - name: limits

paths:
  /v1/claims:
    post:
      tags: [claims]
      operationId: registerClaim
      x-permission: claims:register
      summary: Register a claim
      description: |
        Requires the permission `claims:register`.

        The claim is assessed immediately. If every rule is green and the amount
        is below the auto-settle limit, the decision is made automatically
        and returned in `decision`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            examples:
              otit:
                $ref: '#/components/examples/ClaimOtitAuto'
              korsband:
                $ref: '#/components/examples/ClaimKorsbandManual'
              foreStart:
                $ref: '#/components/examples/ClaimBeforePolicy'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterClaimResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}:
    get:
      tags: [claims]
      operationId: getClaim
      x-permission: claims:read
      description: Requires the permission `claims:read`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/assessment:
    get:
      tags: [claims]
      operationId: assessClaim
      x-permission: claims:read
      summary: Current assessment, without storing anything
      description: |
        Requires the permission `claims:read`.

        `knownAt` assesses against the policy as it was known at a given
        point in time (system time). Omitted = now.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: knownAt
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/decisions:
    get:
      tags: [decisions]
      operationId: listDecisions
      x-permission: claims:read
      description: Requires the permission `claims:read`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All decisions in order, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [decisions]
      operationId: decideClaim
      x-permission: claims:decide
      summary: Make a claims handler decision
      description: |
        Requires the permission `claims:decide`.

        `accept` decides as the assessment proposes. `reject` against a proposal
        to approve is a deviation (ADR 0018): it also requires the permission
        `claims:override` (403 without it), and `reasonCode` and `reason` (422
        without them). The decision records `deviatesFromProposal`.

        Every decision stores its evidence: exactly the input the engine
        assessed, the calculation model and the engine version.

        If the payout exceeds the caller's decision limit in the claim's
        currency, nothing is decided: the answer is `202` with a decision
        proposal that someone else with `claims:approve` must approve
        (ADR 0019). While a proposal is open, no other decision can be made
        on the claim (409). A decision that increases the payout writes the
        event `claim.payout_ordered`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
            examples:
              godkann:
                $ref: '#/components/examples/DecideAccept'
              avsla:
                $ref: '#/components/examples/DecideReject'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Decision made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '202':
          description: The payout exceeds the caller's limit. A proposal awaits approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/proposals:
    get:
      tags: [approvals]
      operationId: listProposals
      x-permission: claims:read
      summary: List the claim's decision proposals
      description: Requires the permission `claims:read`. Oldest first, open and closed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The proposals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DecisionProposal' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/proposals/{proposalId}/approvals:
    post:
      tags: [approvals]
      operationId: approveProposal
      x-permission: claims:approve
      summary: Approve a decision proposal
      description: |
        Requires the permission `claims:approve`.

        Turns an open proposal into a decision (ADR 0019). The approver must
        not be the proposer (403, four eyes), and the payout must be within
        the approver's limit (403). The engine assesses the claim again; if
        the basis is no longer the one the proposal was made on, the approval
        is refused (409) and the proposal must be returned. The decision is
        booked as usual and records `approvedBy` and `proposalId`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Approved; the decision is made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/proposals/{proposalId}/returns:
    post:
      tags: [approvals]
      operationId: returnProposal
      x-permission: claims:approve
      summary: Return a decision proposal without a decision
      description: |
        Requires the permission `claims:approve`.

        Closes an open proposal with a reason. Nothing is decided or booked,
        and a new decision can be made on the claim.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnProposalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/reference-data/{kind}:
    get:
      tags: [reference-data]
      operationId: listReferenceItems
      x-permission: catalog:read
      summary: The codes of a kind of reference data
      description: |
        Requires the permission `catalog:read`.

        Reference data are the code lists other data point at: `species`,
        `breed` and `sex` (ADR 0022). A code never changes and is never
        deleted; it is deactivated instead. `label` is in the language asked
        for with `Accept-Language`, and `labels` has every language.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - name: parent
          in: query
          description: Only the children of this code, e.g. the breeds of `dog`.
          schema: { type: string }
        - name: active
          in: query
          description: Only active (`true`) or inactive (`false`) codes. Omitted means both.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The latest revision of every code, ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceItem' }

  /v1/reference-data/{kind}/{code}:
    get:
      tags: [reference-data]
      operationId: getReferenceItem
      x-permission: catalog:read
      summary: One code
      description: Requires the permission `catalog:read`.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The latest revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
    put:
      tags: [reference-data]
      operationId: putReferenceItem
      x-permission: catalog:write
      summary: Create a code or store a new revision of it
      description: |
        Requires the permission `catalog:write`.

        - A new code: omit `basedOnRevision`. A breed needs an active `parent` species.
        - A change: `basedOnRevision` is the current revision, and `reason` is required.
          Another revision stored since gives `409`.
        - The parent never changes. Deactivate with `active: false`.
        - Repeating a change that is already stored returns it unchanged, so a retry is safe.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceItemChange' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The code was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
        '200':
          description: The new revision, or the stored one if nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/reference-data/{kind}/{code}/revisions:
    get:
      tags: [reference-data]
      operationId: listReferenceItemRevisions
      x-permission: catalog:read
      summary: Every revision of a code
      description: Requires the permission `catalog:read`. Shows who changed what, when and why.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: All revisions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceItem' }

  /v1/products/on-sale:
    get:
      tags: [products]
      operationId: listProductsOnSale
      x-permission: catalog:read
      summary: Published product versions on sale on a date
      description: |
        Requires the permission `catalog:read`.

        At most one version of each product is on sale on a day (ADR 0023).
        `name` is in the language asked for with `Accept-Language`.
      parameters:
        - name: date
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: market
          in: query
          schema: { $ref: '#/components/schemas/Market' }
        - name: species
          in: query
          description: A species code from the reference data, e.g. `dog`.
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The versions on sale, ordered by product
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductVersion' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions:
    get:
      tags: [products]
      operationId: listProductVersions
      x-permission: catalog:read
      summary: The versions of a product
      description: |
        Requires the permission `catalog:read`.

        A product version (e.g. `SE-HUND-VV-LIV@2026.2`) says what can be sold:
        market, currency, species, sales period, the rule series claims are
        assessed with, and the options for vet care (ADR 0021, 0023).
        Lifecycle: `draft` → `in_review` → `published`, with four eyes.
      parameters:
        - $ref: '#/components/parameters/Product'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions, ordered by sales start
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductVersion' }
    post:
      tags: [products]
      operationId: createProductDraft
      x-permission: catalog:write
      summary: Create a draft of a product version
      description: Requires the permission `catalog:write`. The version label is chosen by the author, e.g. `2026.2`.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}:
    get:
      tags: [products]
      operationId: getProductVersion
      x-permission: catalog:read
      summary: One product version
      description: Requires the permission `catalog:read`.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
    put:
      tags: [products]
      operationId: updateProductDraft
      x-permission: catalog:write
      summary: Change a draft
      description: Requires the permission `catalog:write`. Only drafts can change.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraftUpdate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The changed draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/vet-care-terms:
    get:
      tags: [products]
      operationId: getVetCareTerms
      x-permission: catalog:read
      summary: The vet care terms for a customer's choices
      description: |
        Requires the permission `catalog:read`. The terms a policy gets when
        written with these choices. A choice left out takes the product's default.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - name: annualLimit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: deductible
          in: query
          description: The code of a deductible option, e.g. `standard`.
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VetCareTerms' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/submissions:
    post:
      tags: [products]
      operationId: submitProductVersion
      x-permission: catalog:write
      summary: Submit a draft for review
      description: Requires the permission `catalog:write`. Locks the content and computes its checksum. Every species must be active, and the rule series must have a published version in force when sales start.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/returns:
    post:
      tags: [products]
      operationId: returnProductVersion
      x-permission: catalog:publish
      summary: Return a version in review to draft
      description: Requires the permission `catalog:publish`. Needs a reason.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/publications:
    post:
      tags: [products]
      operationId: publishProductVersion
      x-permission: catalog:publish
      summary: Publish a version in review
      description: Requires the permission `catalog:publish`, and someone other than the submitter (four eyes). No other version of the product may be on sale in the same period. A published version never changes.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/sales-ends:
    post:
      tags: [products]
      operationId: endProductSales
      x-permission: catalog:publish
      summary: Bring the end of sales forward
      description: Requires the permission `catalog:publish`. Never before today, and never later than an earlier end. Policies already written keep the version and its rule series.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesEndRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals:
    get:
      tags: [animals]
      operationId: findAnimals
      x-permission: animals:read
      summary: Find animals by identifier or owner
      description: |
        Requires the permission `animals:read`. Give exactly one of the filters.
        Only animals in the caller's markets are returned. Roles bound to a
        clinic or to policies see no animals (ADR 0024); a clinic uses
        `GET /v1/animal-lookup` instead (ADR 0025).
      parameters:
        - { name: microchip, in: query, schema: { type: string }, description: '15 digits (ISO 11784). Spaces and hyphens are ignored.' }
        - { name: registration, in: query, schema: { type: string } }
        - { name: passport, in: query, schema: { type: string } }
        - { name: ownerPartyId, in: query, schema: { type: string }, description: 'Animals the party owns today.' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The animals found
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AnimalRecord' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [animals]
      operationId: registerAnimal
      x-permission: animals:write
      summary: Register an animal with its first owner
      description: |
        Requires the permission `animals:write`. Species, breed and sex are
        codes from the reference data; the breed must belong to the species.
        An identifier that another animal has gives `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animal-lookup:
    get:
      tags: [animals]
      operationId: lookupAnimal
      x-permission: animals:lookup
      summary: Look up an animal by identifier, e.g. a clinic reading a microchip
      description: |
        Requires the permission `animals:lookup`. Give exactly one identifier.
        Finds the animal only if it is open for lookup (`allowLookup`) and in
        one of the caller's markets. Shows the details and identifiers, never
        the owners or the change history (ADR 0025). An animal that is not
        found, closed or outside the markets all give an empty list.
      parameters:
        - { name: microchip, in: query, schema: { type: string }, description: '15 digits (ISO 11784). Spaces and hyphens are ignored.' }
        - { name: registration, in: query, schema: { type: string } }
        - { name: passport, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The animal, or an empty list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1
                    items: { $ref: '#/components/schemas/AnimalSummary' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}:
    get:
      tags: [animals]
      operationId: getAnimal
      x-permission: animals:read
      summary: An animal with its identifiers and owners
      description: Requires the permission `animals:read`. An animal outside the caller's markets answers 404.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
    put:
      tags: [animals]
      operationId: correctAnimal
      x-permission: animals:write
      summary: Correct or update an animal's details
      description: |
        Requires the permission `animals:write`. A new revision with a reason,
        e.g. neutered, a corrected breed or a date of death. `basedOnRevision`
        must be the current revision. Market and species never change.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}/revisions:
    get:
      tags: [animals]
      operationId: listAnimalRevisions
      x-permission: animals:read
      summary: Every revision of an animal's details
      description: Requires the permission `animals:read`. Shows who changed what, when and why.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: All revisions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Animal' }

  /v1/animals/{animalId}/identifiers:
    post:
      tags: [animals]
      operationId: addAnimalIdentifier
      x-permission: animals:write
      summary: Add an identifier
      description: Requires the permission `animals:write`. Identifiers are never removed. Adding one the animal already has returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentifierInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}/ownerships:
    post:
      tags: [animals]
      operationId: transferAnimal
      x-permission: animals:write
      summary: Change owner from a date
      description: Requires the permission `animals:write`. The current ownership ends the day the new one starts. Not after the animal died.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/access/roles:
    get:
      tags: [access]
      operationId: getRoles
      x-permission: access:read
      summary: The role settings in force
      description: |
        Requires the permission `access:read`.

        Which permissions, binding and amount limits each role has in this
        installation (ADR 0016, 0019, 0020). Changes apply at once.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConfig' }

  /v1/access/roles/versions:
    get:
      tags: [access]
      operationId: listRoleVersions
      x-permission: access:read
      summary: The history of the role settings
      description: Requires the permission `access:read`. Every version, oldest first. Versions never change.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoleConfig' }
    post:
      tags: [access]
      operationId: changeRoles
      x-permission: access:manage
      summary: Store a new version of the role settings
      description: |
        Requires the permission `access:manage`.

        Replaces the whole role set with a new version (ADR 0020), e.g. to
        raise a handler's decision limit. Refused when:
        - `basedOnVersion` is not the current version: someone else changed
          the settings in between (409)
        - the change touches a role the caller holds: nobody raises their own
          limits or removes their own access (403)
        - a permission, binding, currency or limit is invalid, or the reason
          is empty (422)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRolesRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The new version, in force at once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConfig' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions:
    get:
      tags: [rule-sets]
      operationId: listRuleSetVersions
      x-permission: rules:read
      summary: The versions of a rule series
      description: |
        Requires the permission `rules:read`.

        A rule series (e.g. `SE-HUND-VV`) holds a product's claims rules as
        numbered versions (ADR 0018, 0021). Lifecycle: `draft` → `in_review` →
        `published` → `retired`. The claims engine uses the published version
        with the latest `effectiveFrom` not after the treatment date.
      parameters:
        - $ref: '#/components/parameters/Series'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RuleSetVersion' }
    post:
      tags: [rule-sets]
      operationId: createRuleSetDraft
      x-permission: rules:write
      summary: Create a draft with the next version number
      description: Requires the permission `rules:write`. The calculation model must be one the engine has.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSetDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}:
    get:
      tags: [rule-sets]
      operationId: getRuleSetVersion
      x-permission: rules:read
      summary: One version of a rule series
      description: Requires the permission `rules:read`.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      tags: [rule-sets]
      operationId: updateRuleSetDraft
      x-permission: rules:write
      summary: Change a draft
      description: Requires the permission `rules:write`. Only drafts can change (409 otherwise).
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSetDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The changed draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/simulations:
    post:
      tags: [rule-sets]
      operationId: simulateRuleSet
      x-permission: rules:simulate
      summary: Simulate a rule set version against stored decisions
      description: |
        Requires the permission `rules:simulate`.

        Runs the version's rules (a draft or any other version) against the
        stored evidence of decisions made in [`from`, `to`): each claim's
        latest decision, from the same series, within the caller's scope
        (ADR 0018). Shows how many decisions would change, moves between
        automatic and manual handling, and payouts per currency. Nothing is
        stored or booked, so no `Idempotency-Key` is needed. Each decision is
        simulated on its own; knock-on effects between claims, such as
        deductible periods, are not simulated.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/submissions:
    post:
      tags: [rule-sets]
      operationId: submitRuleSet
      x-permission: rules:write
      summary: Submit a draft for review
      description: |
        Requires the permission `rules:write`.

        Locks the content and computes its checksum.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/returns:
    post:
      tags: [rule-sets]
      operationId: returnRuleSet
      x-permission: rules:publish
      summary: Return a version in review to draft
      description: |
        Requires the permission `rules:publish`.

        Needs a reason. The checksum is removed, and the draft can change again.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/publications:
    post:
      tags: [rule-sets]
      operationId: publishRuleSet
      x-permission: rules:publish
      summary: Publish a version in review
      description: |
        Requires the permission `rules:publish`.

        Someone other than the submitter (403, four eyes). From `effectiveFrom`, new assessments use it. A published version never changes. Two published versions in a series cannot apply from the same date (409).
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/retirements:
    post:
      tags: [rule-sets]
      operationId: retireRuleSet
      x-permission: rules:publish
      summary: Retire a published version
      description: |
        Requires the permission `rules:publish`.

        Needs a reason. New assessments no longer use it; stored decisions keep their rules in their evidence.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/decisions/{seq}/replays:
    post:
      tags: [decisions]
      operationId: replayDecision
      x-permission: claims:read
      summary: Recalculate a stored decision from its evidence
      description: |
        Requires the permission `claims:read`.

        Runs the decision's stored evidence (input, rules and calculation model)
        through the engine again and compares the result with the stored
        assessment (ADR 0018). Nothing is stored or booked, so no
        `Idempotency-Key` is needed. `identical: true` proves the decision can
        be reproduced exactly. Decisions made before evidence was stored give 404.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The result of the recalculation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/decisions/{seq}/explanation:
    get:
      tags: [decisions]
      operationId: explainDecision
      x-permission: claims:read
      summary: Explain a decision
      description: |
        Requires the permission `claims:read`.

        Why the decision came out as it did (ADR 0018, GDPR art. 13–15 and 22):
        the main reason, every rule the engine checked, the calculation step by
        step, a handler's motivation when the decision deviates from the
        proposal, and whether a human review can be requested. Built from the
        stored decision and its evidence, so it is the same today and later.
        Every part has a stable `reason` and `params`; `message` is the text in
        the language from `Accept-Language`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionExplanation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/decisions/{seq}/review-requests:
    post:
      tags: [reviews]
      operationId: requestReview
      x-permission: claims:request-review
      summary: Request a human review of an automated decision
      description: |
        Requires the permission `claims:request-review`.

        The customer's right to human review, to state their view and to
        contest an automated decision (ADR 0018, GDPR art. 22). Allowed for
        the claim's latest decision when it is automated (`automated: true`),
        and only one open request per claim (409 otherwise). The request is
        open until a claims handler decides the claim; that decision is the
        review, carries `reviewRequestId` and closes the request.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequestInput' }
            examples:
              withStatement:
                $ref: '#/components/examples/ReviewRequestWithStatement'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The request is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/review-requests:
    get:
      tags: [reviews]
      operationId: listReviewRequests
      x-permission: claims:read
      summary: List the claim's review requests
      description: Requires the permission `claims:read`. Oldest first, open and closed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/reassessments:
    post:
      tags: [decisions]
      operationId: reassessClaim
      x-permission: claims:reassess
      summary: Reassess a decided claim
      description: |
        Requires the permission `claims:reassess`.

        Reassesses the claim against the current basis, e.g. after a retroactive
        policy change. If the basis has changed, a new decision is created and
        the ledger books the difference. 204 if nothing changed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassessRequest' }
            examples:
              omprovning:
                $ref: '#/components/examples/Reassess'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: New decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '204':
          description: Basis unchanged, no new decision
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/claim-previews:
    post:
      tags: [previews]
      operationId: previewClaim
      x-permission: claims:preview
      summary: Pre-approval, e.g. at the clinic's checkout
      description: |
        Requires the permission `claims:preview`.

        Assesses a draft without storing or reserving anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            examples:
              otit:
                $ref: '#/components/examples/ClaimOtitAuto'
              korsband:
                $ref: '#/components/examples/ClaimKorsbandManual'
              foreStart:
                $ref: '#/components/examples/ClaimBeforePolicy'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/animals/{animalId}/limits:
    get:
      tags: [limits]
      operationId: getLimits
      x-permission: limits:read
      summary: Consumed and remaining annual limit
      description: Requires the permission `limits:read`.
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string }
        - name: animalId
          in: path
          required: true
          schema: { type: string }
        - name: onDate
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Amounts for the policy year the date falls in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Limits' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

webhooks:
  claim.registered:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimRegisteredEvent' }
      responses:
        '2XX': { description: Received }
  claim.decided:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDecidedEvent' }
      responses:
        '2XX': { description: Received }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string }
    ReferenceKind:
      name: kind
      in: path
      required: true
      description: The kind of reference data.
      schema: { type: string, enum: [species, breed, sex] }
    ReferenceCode:
      name: code
      in: path
      required: true
      description: The code, e.g. `dog` or `dog-labrador-retriever`. Never changes.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
    Product:
      name: product
      in: path
      required: true
      description: The product, e.g. SE-HUND-VV-LIV.
      schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$' }
    ProductVersionLabel:
      name: version
      in: path
      required: true
      description: The version label, e.g. 2026.2.
      schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,31}$' }
    AnimalId:
      name: animalId
      in: path
      required: true
      schema: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
    Series:
      name: series
      in: path
      required: true
      description: The rule series, e.g. SE-HUND-VV.
      schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$' }
    RuleSetVersionNo:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Seq:
      name: seq
      in: path
      required: true
      description: The decision's sequence number on the claim, 1 for the first.
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    Unauthenticated:
      description: No valid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller lacks the operation's permission (`x-permission`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  examples:
    ClaimOtitAuto:
      summary: Ear infection – settled automatically
      description: |
        SEK 4,000 billed. Every rule green and below the auto-settle limit.
        Expected outcome: approved immediately, SEK 1,500 payout (SEK 2,000 fixed
        deductible, 25 % variable). Change `id` and `claimNo` to send it again.
      value:
        id: clm_ex_otit
        claimNo: EX-0001
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: clinic_direct
        treatmentFrom: '2026-11-11'
        treatmentTo: '2026-11-11'
        diagnosisCode: ORA-OTIT
        lines:
          - { id: l1, description: Examination, category: examination, amount: 65000 }
          - { id: l2, description: Ear flush and medication, category: medication, amount: 335000 }
    ClaimKorsbandManual:
      summary: Cruciate ligament injury – goes to a handler
      description: |
        SEK 18,640 billed for TPLO surgery. Bella has a rider in the same
        diagnosis group and the amount is above the auto-settle limit.
        Expected outcome: no decision; the assessment proposes a partial payout
        (food is not reimbursed) and waits for a handler.
      value:
        id: clm_ex_korsband
        claimNo: EX-0002
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: clinic_direct
        treatmentFrom: '2026-11-11'
        treatmentTo: '2026-11-13'
        diagnosisCode: ORT-KORSBAND-V
        lines:
          - { id: l1, description: Examination orthopaedics, category: examination, amount: 85000 }
          - { id: l2, description: X-ray hind legs, category: diagnostics, amount: 290000 }
          - { id: l3, description: Sedation and anaesthesia, category: anaesthesia, amount: 124000 }
          - { id: l4, description: TPLO surgery left, category: surgery, amount: 1240000 }
          - { id: l5, description: Pain relief 10 days, category: medication, amount: 83000 }
          - { id: l6, description: Prescription food, category: food, amount: 42000 }
    ClaimBeforePolicy:
      summary: Treatment before the policy year starts – rejected
      description: |
        The treatment date is before the policy version that exists.
        Expected outcome: rejection is proposed because no policy applied on that date.
      value:
        id: clm_ex_fore_start
        claimNo: EX-0003
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: customer
        treatmentFrom: '2026-03-20'
        treatmentTo: '2026-03-20'
        diagnosisCode: GI-ENTERIT
        lines:
          - { id: l1, description: Examination, category: examination, amount: 80000 }
    DecideAccept:
      summary: Accept as proposed
      description: Add `expectedInputHash` from the assessment to guard against a stale basis.
      value:
        action: accept
        reason: The rider covers the right hind leg; the injury is on the left.
    DecideReject:
      summary: Reject against the proposal (needs claims:override)
      value:
        action: reject
        reasonCode: pre_existing_condition
        reason: The injury is covered by the rider.
    ReviewRequestWithStatement:
      summary: The customer contests an automatic decision
      value:
        statement: The ear infection started after the waiting period, see the attached journal.
    Reassess:
      summary: Reassess after a change
      value:
        reason: The policy has been changed retroactively.

  schemas:
    Money:
      type: integer
      description: Amount in the smallest currency unit (cents, pence …).
    NonNegativeMoney:
      type: integer
      minimum: 0
      description: Amount in the smallest currency unit, never negative.
    Market:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2, e.g. SE, NO, DK, FI, DE.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217, e.g. SEK, NOK, DKK, EUR.
    Date:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      format: date
    DateTime:
      type: string
      format: date-time

    ClaimLine:
      type: object
      additionalProperties: false
      required: [id, description, category, amount]
      properties:
        id: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category:
          type: string
          description: Category per the product's claims rules, e.g. examination, surgery, food.
        diagnosisCode: { type: string }
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Amount including VAT.
        vat:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: The VAT part of amount, if the invoice states it.

    ClaimFields:
      type: object
      required: [id, claimNo, policyId, animalId, market, currency, channel, treatmentFrom, treatmentTo, diagnosisCode, lines]
      properties:
        id: { type: string, minLength: 1 }
        claimNo: { type: string, minLength: 1 }
        policyId: { type: string, minLength: 1 }
        animalId: { type: string, minLength: 1 }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        channel: { type: string, enum: [clinic_direct, customer] }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        treatmentTo: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ClaimLine' }

    ClaimInput:
      description: What the client sends. receivedAt is set by the server.
      allOf:
        - $ref: '#/components/schemas/ClaimFields'
      unevaluatedProperties: false

    Claim:
      allOf:
        - $ref: '#/components/schemas/ClaimFields'
        - type: object
          required: [receivedAt]
          properties:
            receivedAt: { $ref: '#/components/schemas/DateTime' }
            clinicId:
              type: string
              description: The clinic that submitted the claim, taken from the caller's token. Never set by the client.
      unevaluatedProperties: false

    RuleResult:
      type: object
      required: [code, status, reason, params]
      properties:
        code:
          type: string
          enum: [POLICY_FOUND, POLICY_ACTIVE, ANIMAL_MATCHES, MARKET_CURRENCY, WAITING_PERIOD, COVERAGE, RIDER, DIAGNOSIS_KNOWN, LIMIT]
        status: { type: string, enum: [pass, fail, review, info] }
        reason:
          type: string
          description: Stable key, e.g. rider.possible. Use it for logic and your own translations.
        params:
          type: object
          additionalProperties:
            type: [string, number]
        message:
          type: string
          description: Text in the language from Accept-Language.

    Calculation:
      type: object
      required:
        - currency
        - billed
        - nonReimbursable
        - vatExcluded
        - base
        - opensDeductiblePeriod
        - deductibleFixed
        - deductibleVariableBp
        - deductibleVariable
        - payableBeforeLimit
        - annualLimit
        - consumedBefore
        - remainingBefore
        - payout
        - customerShare
        - cappedByLimit
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        billed: { $ref: '#/components/schemas/Money' }
        nonReimbursable: { $ref: '#/components/schemas/Money' }
        vatExcluded:
          $ref: '#/components/schemas/Money'
          description: VAT that is not reimbursed in the market.
        base: { $ref: '#/components/schemas/Money' }
        opensDeductiblePeriod: { type: boolean }
        deductibleFixed: { $ref: '#/components/schemas/Money' }
        deductibleVariableBp:
          type: integer
          description: Variable deductible in basis points (2500 = 25 %), after age adjustment.
        deductibleVariable: { $ref: '#/components/schemas/Money' }
        payableBeforeLimit: { $ref: '#/components/schemas/Money' }
        annualLimit: { $ref: '#/components/schemas/Money' }
        consumedBefore: { $ref: '#/components/schemas/Money' }
        remainingBefore: { $ref: '#/components/schemas/Money' }
        payout: { $ref: '#/components/schemas/Money' }
        customerShare: { $ref: '#/components/schemas/Money' }
        cappedByLimit: { type: boolean }

    Assessment:
      type: object
      required: [claimId, market, currency, policyVersionId, productVersion, rulesVersion, rules, calculation, proposedOutcome, mode, diagnosisGroup, inputHash]
      properties:
        claimId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        policyVersionId: { type: [string, 'null'] }
        productVersion: { type: [string, 'null'] }
        rulesVersion: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RuleResult' }
        calculation:
          oneOf:
            - $ref: '#/components/schemas/Calculation'
            - type: 'null'
        proposedOutcome: { $ref: '#/components/schemas/Outcome' }
        mode:
          type: string
          enum: [auto, manual]
          description: auto = may be settled without a claims handler.
        diagnosisGroup: { type: [string, 'null'] }
        inputHash:
          type: string
          description: Hash of the whole basis. Send it as expectedInputHash when deciding.

    Outcome:
      type: string
      enum: [approved, partial, rejected]

    Decision:
      type: object
      required: [id, claimId, seq, outcome, payout, assessment, decidedBy, decidedAt, deviatesFromProposal, automated]
      properties:
        id: { type: string }
        claimId: { type: string }
        seq: { type: integer, minimum: 1 }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        assessment: { $ref: '#/components/schemas/Assessment' }
        decidedBy: { type: string }
        decidedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }
        deviatesFromProposal:
          type: boolean
          description: True if the handler decided against the assessment's proposal. Then `reasonCode` and `reason` are always set.
        reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
        automated:
          type: boolean
          description: |
            True if no person judged the outcome (automatic settlement or
            reassessment). The customer may request a human review of an
            automated decision.
        reviewRequestId:
          type: string
          description: Set when this decision is the human review of a request.
        approvedBy:
          type: string
          description: Set when the decision needed approval (ADR 0019). Never the same as `decidedBy`.
        proposalId:
          type: string
          description: The proposal the approval turned into this decision.

    DecisionProposal:
      type: object
      required: [id, claimId, action, outcome, payout, currency, inputHash, proposedBy, proposedAt, deviatesFromProposal, proposerLimit, status]
      properties:
        id: { type: string }
        claimId: { type: string }
        action: { type: string, enum: [accept, reject] }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        inputHash: { type: string, description: The basis the proposal was made on. An approval requires the same basis. }
        proposedBy: { type: string }
        proposedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }
        reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
        deviatesFromProposal: { type: boolean }
        proposerLimit:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: The proposer's limit in the claim's currency, which the payout exceeded.
        status: { type: string, enum: [open, approved, returned] }
        closedBy: { type: string }
        closedAt: { $ref: '#/components/schemas/DateTime' }
        decisionId: { type: string, description: The decision the approval became. }
        returnReason: { type: string }

    ApproveRequest:
      type: object
      additionalProperties: false
      description: Empty for now. An object, so fields can be added later.

    ReturnProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    AmountLimits:
      type: object
      description: Highest payout per currency in the smallest unit. A currency that is missing has the limit 0.
      propertyNames: { pattern: '^[A-Z]{3}$' }
      additionalProperties: { type: integer, minimum: 0 }

    RoleDefinition:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string, pattern: '^[a-z-]+:[a-z-]+$' }
        bindsTo: { type: string, enum: [clinic, policies] }
        decisionLimits: { $ref: '#/components/schemas/AmountLimits' }
        approvalLimits: { $ref: '#/components/schemas/AmountLimits' }

    RoleConfig:
      type: object
      required: [version, roles, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        roles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RoleDefinition' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ChangeRolesRequest:
      type: object
      additionalProperties: false
      required: [basedOnVersion, roles, reason]
      properties:
        basedOnVersion: { type: integer, minimum: 1, description: The version the change was made from. }
        roles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RoleDefinition' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    RuleSetContent:
      type: object
      additionalProperties: false
      required: [market, vatReimbursable, nonReimbursableCategories, diagnosisGroups, autoSettleMax]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        vatReimbursable: { type: boolean, description: Is VAT on vet invoices reimbursed? }
        nonReimbursableCategories:
          type: array
          items: { type: string, minLength: 1 }
        diagnosisGroups:
          type: object
          description: Diagnosis code -> diagnosis group.
          additionalProperties: { type: string, minLength: 1 }
        autoSettleMax:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Highest payout settled without a claims handler.

    RuleSetDraft:
      type: object
      additionalProperties: false
      required: [content, calculationModel, effectiveFrom]
      properties:
        content: { $ref: '#/components/schemas/RuleSetContent' }
        calculationModel: { type: string, description: 'One of the engine''s calculation models, e.g. vet-care.v1.' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }

    RuleSetVersion:
      type: object
      required: [series, version, status, content, calculationModel, effectiveFrom, revision, createdBy, createdAt]
      properties:
        series: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, in_review, published, retired] }
        content: { $ref: '#/components/schemas/RuleSetContent' }
        calculationModel: { type: string }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        checksum: { type: string, description: sha256 over content, calculation model and effectiveFrom. Set from review on. }
        revision: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        submittedBy: { type: string }
        submittedAt: { $ref: '#/components/schemas/DateTime' }
        publishedBy: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        retiredBy: { type: string }
        retiredAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: string, description: Why the version was returned or retired. }

    SimulationRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }

    SimulatedOutcome:
      type: object
      required: [proposedOutcome, mode, payout]
      properties:
        proposedOutcome: { $ref: '#/components/schemas/Outcome' }
        mode: { type: string, enum: [auto, manual] }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        rulesVersion: { type: string }

    SimulationResult:
      type: object
      required: [rulesVersion, calculationModel, decisions, changed, modeChanged, totals, items]
      properties:
        rulesVersion: { type: string }
        calculationModel: { type: string }
        decisions: { type: integer, minimum: 0, description: Decisions simulated. }
        changed: { type: integer, minimum: 0, description: Decisions whose proposal, mode or payout would change. }
        modeChanged:
          type: object
          required: [autoToManual, manualToAuto]
          properties:
            autoToManual: { type: integer, minimum: 0 }
            manualToAuto: { type: integer, minimum: 0 }
        totals:
          type: array
          description: Payouts per currency. Never added across currencies.
          items:
            type: object
            required: [currency, decisions, storedPayout, simulatedPayout]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              decisions: { type: integer, minimum: 0 }
              storedPayout: { $ref: '#/components/schemas/NonNegativeMoney' }
              simulatedPayout: { $ref: '#/components/schemas/NonNegativeMoney' }
        items:
          type: array
          maxItems: 200
          description: The decisions that would change.
          items:
            type: object
            required: [claimId, decisionId, seq, currency, stored, simulated, payoutDelta, changed]
            properties:
              claimId: { type: string }
              decisionId: { type: string }
              seq: { type: integer, minimum: 1 }
              currency: { $ref: '#/components/schemas/Currency' }
              stored: { $ref: '#/components/schemas/SimulatedOutcome' }
              simulated: { $ref: '#/components/schemas/SimulatedOutcome' }
              payoutDelta: { $ref: '#/components/schemas/Money' }
              changed: { type: boolean }

    ReferenceItem:
      type: object
      required: [kind, code, label, labels, active, revision, changedBy, changedAt]
      properties:
        kind: { type: string, enum: [species, breed, sex] }
        code: { type: string }
        parent: { type: string, description: 'The parent code, e.g. the species of a breed.' }
        label: { type: string, description: 'The label in the language asked for with Accept-Language, else English, else the first language.' }
        labels: { $ref: '#/components/schemas/Labels' }
        active: { type: boolean, description: 'Inactive codes stay readable for stored data but are not offered for new data.' }
        revision: { type: integer, minimum: 1 }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ReferenceItemChange:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels: { $ref: '#/components/schemas/Labels' }
        parent: { type: string, description: 'Required for a new breed: its species. Never changes.' }
        active: { type: boolean, default: true }
        basedOnRevision: { type: integer, minimum: 1, description: 'The current revision. Omitted for a new code.' }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Required when changing an existing code.' }

    Labels:
      type: object
      description: 'Language tag (BCP 47, e.g. sv, en, de-CH) -> label.'
      minProperties: 1
      propertyNames: { pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
      additionalProperties: { type: string, minLength: 1, maxLength: 200 }

    DeductibleTerms:
      type: object
      additionalProperties: false
      required: [fixed, fixedPer, variableBp]
      properties:
        fixed: { $ref: '#/components/schemas/NonNegativeMoney' }
        fixedPer: { type: string, enum: [period, claim, policy_year] }
        periodDays: { type: integer, minimum: 1, maximum: 3650, description: Required when fixedPer is period. }
        periodEndsAtRenewal: { type: boolean }
        variableBp: { type: integer, minimum: 0, maximum: 10000, description: 'Basis points: 2500 = 25 %.' }
        variableBpByAge:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fromAgeYears, bp]
            properties:
              fromAgeYears: { type: integer, minimum: 1 }
              bp: { type: integer, minimum: 0, maximum: 10000 }

    VetCareTerms:
      type: object
      required: [code, annualLimit, deductible, waitingPeriodDays]
      properties:
        code: { type: string, enum: [vet_care] }
        annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
        deductible: { $ref: '#/components/schemas/DeductibleTerms' }
        waitingPeriodDays: { type: integer, minimum: 0 }

    ProductContent:
      type: object
      additionalProperties: false
      required: [market, currency, species, names, ruleSeries, vetCare]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        species:
          type: array
          minItems: 1
          items: { type: string }
          description: Species codes from the reference data.
        names: { $ref: '#/components/schemas/Labels' }
        ruleSeries: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$', description: 'The rule series claims are assessed with, e.g. SE-HUND-VV.' }
        vetCare:
          type: object
          additionalProperties: false
          required: [annualLimits, defaultAnnualLimit, deductibles, defaultDeductible, waitingPeriodDays]
          properties:
            annualLimits:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/NonNegativeMoney' }
            defaultAnnualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductibles:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [code, labels, terms]
                properties:
                  code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
                  labels: { $ref: '#/components/schemas/Labels' }
                  terms: { $ref: '#/components/schemas/DeductibleTerms' }
            defaultDeductible: { type: string }
            waitingPeriodDays: { type: integer, minimum: 0, maximum: 365 }

    ProductDraftUpdate:
      type: object
      additionalProperties: false
      required: [content, salesFrom]
      properties:
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date' }

    ProductDraft:
      type: object
      additionalProperties: false
      required: [version, content, salesFrom]
      properties:
        version: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,31}$' }
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date', description: 'First day not on sale. Omitted: until further notice.' }

    ProductVersion:
      type: object
      required: [product, version, id, name, status, content, salesFrom, revision, createdBy, createdAt]
      properties:
        product: { type: string }
        version: { type: string }
        id: { type: string, description: 'product@version, as policies and claims refer to it.' }
        name: { type: string, description: The name in the language asked for with Accept-Language. }
        status: { type: string, enum: [draft, in_review, published] }
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date' }
        checksum: { type: string, description: sha256 over content and salesFrom. Set from review on. }
        revision: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        submittedBy: { type: string }
        submittedAt: { $ref: '#/components/schemas/DateTime' }
        publishedBy: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        salesEndedBy: { type: string }
        salesEndedAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: string, description: Why the version was returned or its sales ended. }

    SalesEndRequest:
      type: object
      additionalProperties: false
      required: [salesTo, reason]
      properties:
        salesTo: { $ref: '#/components/schemas/Date' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    IdentifierInput:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [microchip, registration, passport] }
        value: { type: string, minLength: 1, maxLength: 60 }

    Animal:
      type: object
      required: [id, revision, market, species, sex, neutered, name, birthDate, allowLookup, changedBy, changedAt]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string, description: Species code from the reference data. Never changes. }
        breed: { type: string, description: Breed code from the reference data. Omitted when unknown. }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean, description: 'Whether a lookup by identifier, e.g. by a clinic, finds the animal (ADR 0025).' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    AnimalSummary:
      type: object
      description: What a lookup shows. No owners and no change history (ADR 0025).
      required: [id, market, species, sex, neutered, name, birthDate, identifiers]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        identifiers:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string, enum: [microchip, registration, passport] }
              value: { type: string }

    AnimalRecord:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          required: [identifiers, ownerships]
          properties:
            identifiers:
              type: array
              items:
                type: object
                required: [type, value, addedBy, addedAt]
                properties:
                  type: { type: string, enum: [microchip, registration, passport] }
                  value: { type: string }
                  addedBy: { type: string }
                  addedAt: { $ref: '#/components/schemas/DateTime' }
            ownerships:
              type: array
              description: Every owner, oldest first. The one without validTo is the current owner.
              items:
                type: object
                required: [seq, partyId, validFrom, recordedBy, recordedAt]
                properties:
                  seq: { type: integer, minimum: 1 }
                  partyId: { type: string }
                  validFrom: { $ref: '#/components/schemas/Date' }
                  validTo: { $ref: '#/components/schemas/Date', description: First day the party no longer owns the animal. }
                  recordedBy: { type: string }
                  recordedAt: { $ref: '#/components/schemas/DateTime' }
                  reason: { type: string }

    RegisterAnimalRequest:
      type: object
      additionalProperties: false
      required: [market, species, sex, name, birthDate, owner]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean, default: false }
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean, default: false, description: 'Open for lookup by identifier (ADR 0025). Closed unless given.' }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/IdentifierInput' }
        owner:
          type: object
          additionalProperties: false
          required: [partyId, from]
          properties:
            partyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
            from: { $ref: '#/components/schemas/Date' }

    CorrectAnimalRequest:
      type: object
      additionalProperties: false
      required: [basedOnRevision, reason, sex, neutered, name, birthDate, allowLookup]
      properties:
        basedOnRevision: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean }

    TransferAnimalRequest:
      type: object
      additionalProperties: false
      required: [partyId, from]
      properties:
        partyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        from: { $ref: '#/components/schemas/Date' }
        reason: { type: string, maxLength: 2000 }

    EmptyRequest:
      type: object
      additionalProperties: false

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    PayoutOrder:
      type: object
      required: [id, claimId, decisionId, policyId, amount, currency, channel]
      description: An increase in a claim's payout, ordered for payment (ADR 0019). The payments module chooses the payee.
      properties:
        id: { type: string }
        claimId: { type: string }
        decisionId: { type: string }
        policyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        channel: { type: string, enum: [clinic_direct, customer] }
        clinicId: { type: string }

    DeviationReasonCode:
      type: string
      description: Why a handler decided against the assessment's proposal.
      enum: [pre_existing_condition, not_covered, insufficient_documentation, incorrect_invoice, other]

    ReplayResult:
      type: object
      required: [decisionId, calculationModel, engineVersion, replayedWith, status, inputHashMatches, differences]
      properties:
        decisionId: { type: string }
        calculationModel: { type: string, description: The calculation model stored with the decision. }
        engineVersion: { type: string, description: The engine version that made the decision. }
        replayedWith:
          type: object
          required: [engineVersion]
          properties:
            engineVersion: { type: string }
        status:
          type: string
          enum: [identical, different, model_unavailable]
          description: |
            `identical`: the stored assessment is reproduced exactly.
            `different`: the result differs; see `differences`.
            `model_unavailable`: this engine no longer has the stored calculation model.
        inputHashMatches:
          type: boolean
          description: The stored input still hashes to the decision's inputHash.
        differences:
          type: array
          maxItems: 50
          items:
            type: object
            required: [path]
            properties:
              path: { type: string, description: 'JSON path in the assessment, e.g. /calculation/payout' }
              stored: {}
              replayed: {}

    Reason:
      type: object
      required: [reason, params]
      properties:
        reason: { type: string, description: 'Stable key, e.g. decision.partial or waiting.within.' }
        params:
          type: object
          additionalProperties:
            type: [string, number]
        message: { type: string, description: Text in the language from Accept-Language. }

    ExplanationStep:
      allOf:
        - $ref: '#/components/schemas/Reason'
        - type: object
          required: [step, amount]
          properties:
            step:
              type: string
              enum: [billed, non_reimbursable, vat_excluded, deductible_fixed, deductible_fixed_in_period, deductible_variable, limit_capped, payout]
            amount:
              type: integer
              description: In the smallest currency unit. Reductions are negative, so the steps add up to the payout.

    DecisionExplanation:
      type: object
      required: [claimId, decisionId, seq, outcome, payout, currency, decidedAt, automated, mainReason, rules, steps, humanReview, basis]
      properties:
        claimId: { type: string }
        decisionId: { type: string }
        seq: { type: integer, minimum: 1 }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        decidedAt: { $ref: '#/components/schemas/DateTime' }
        automated: { type: boolean }
        mainReason:
          $ref: '#/components/schemas/Reason'
          description: The one reason that best explains the outcome.
        rules:
          type: array
          description: Every rule the engine checked, in order.
          items: { $ref: '#/components/schemas/RuleResult' }
        steps:
          type: array
          description: The calculation step by step. Empty when the claim was rejected.
          items: { $ref: '#/components/schemas/ExplanationStep' }
        deviation:
          type: object
          description: Set when a handler decided against the proposal.
          required: [reasonCode, reason]
          properties:
            reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
            reason: { type: string }
            message: { type: string, description: The reason code as text in the language from Accept-Language. }
        reviewRequestId: { type: string, description: Set when this decision answers a review request. }
        humanReview:
          type: object
          required: [available]
          properties:
            available: { type: boolean, description: A human review of this decision can be requested now. }
            openRequestId: { type: string }
        basis:
          type: object
          description: What makes the decision traceable and recalculable.
          required: [rulesVersion, productVersion, policyVersionId, inputHash, calculationModel, engineVersion]
          properties:
            rulesVersion: { type: string }
            productVersion: { type: [string, 'null'] }
            policyVersionId: { type: [string, 'null'] }
            inputHash: { type: string }
            calculationModel: { type: [string, 'null'], description: null for decisions made before evidence was stored. }
            engineVersion: { type: [string, 'null'] }

    ReviewRequestInput:
      type: object
      additionalProperties: false
      properties:
        statement:
          type: string
          maxLength: 4000
          description: The customer's view, in their own words.

    ReviewRequest:
      type: object
      required: [id, claimId, decisionId, decisionSeq, requestedBy, requestedAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        decisionId: { type: string }
        decisionSeq: { type: integer, minimum: 1 }
        requestedBy: { type: string }
        statement: { type: string }
        requestedAt: { $ref: '#/components/schemas/DateTime' }
        closedByDecisionId: { type: string, description: The human decision that closed the request. }
        closedAt: { $ref: '#/components/schemas/DateTime' }

    RegisterClaimResult:
      type: object
      required: [claim, assessment, decision]
      properties:
        claim: { $ref: '#/components/schemas/Claim' }
        assessment: { $ref: '#/components/schemas/Assessment' }
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'

    DecideRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject] }
        reason: { type: string, maxLength: 2000 }
        reasonCode:
          $ref: '#/components/schemas/DeviationReasonCode'
          description: Required, with `reason`, when the decision goes against the proposal.
        expectedInputHash:
          type: string
          description: inputHash from the assessment the handler saw. Rejected with 409 if the basis has changed.

    ReassessRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    Limits:
      type: object
      required: [animalId, policyId, market, currency, coverage, policyYearStart, policyYearEnd, annualLimit, consumed, remaining]
      properties:
        animalId: { type: string }
        policyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        coverage: { type: string, enum: [vet_care] }
        policyYearStart: { $ref: '#/components/schemas/Date' }
        policyYearEnd: { $ref: '#/components/schemas/Date' }
        annualLimit: { $ref: '#/components/schemas/Money' }
        consumed: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }

    ClaimRegisteredEvent:
      type: object
      required: [type, occurredAt, claim]
      properties:
        type: { const: claim.registered }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        claim: { $ref: '#/components/schemas/Claim' }

    ClaimDecidedEvent:
      type: object
      required: [type, occurredAt, decision]
      properties:
        type: { const: claim.decided }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        decision: { $ref: '#/components/schemas/Decision' }

    ClaimReviewRequestedEvent:
      type: object
      required: [type, occurredAt, request]
      properties:
        type: { const: claim.review_requested }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        request: { $ref: '#/components/schemas/ReviewRequest' }

    ClaimDecisionProposedEvent:
      type: object
      required: [type, occurredAt, proposal]
      properties:
        type: { const: claim.decision_proposed }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        proposal: { $ref: '#/components/schemas/DecisionProposal' }

    ClaimProposalReturnedEvent:
      type: object
      required: [type, occurredAt, proposal]
      properties:
        type: { const: claim.proposal_returned }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        proposal: { $ref: '#/components/schemas/DecisionProposal' }

    ClaimPayoutOrderedEvent:
      type: object
      required: [type, occurredAt, order]
      properties:
        type: { const: claim.payout_ordered }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        order: { $ref: '#/components/schemas/PayoutOrder' }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
