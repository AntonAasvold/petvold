openapi: 3.1.0
info:
  title: Petvold API
  version: 0.1.0
  summary: Headless core for pet insurance – claims, rule sets, products, reference data, animals, parties, policies and access.
  description: |
    The contract is the source of truth. The server validates incoming
    requests against the schemas here, and the contract tests validate the responses.

    Conventions:
    - All amounts are integers in the smallest currency unit (`Money`); the currency is on the object.
    - Dates are `YYYY-MM-DD`, points in time ISO 8601 with time zone.
    - Errors are returned as `application/problem+json` (RFC 9457).
    - All creating POST requests require `Idempotency-Key`.
    - Every operation requires one permission, given in `x-permission`
      (e.g. `claims:decide`). The caller's roles come from the token and are
      mapped to permissions per installation. A missing permission gives 403.
    - Every caller has a scope (ADR 0016): the markets in its token, and for
      some roles its own clinic (`clinicId`) or a list of policies
      (`policyIds`). A claim outside the scope answers 404 exactly like a
      claim that does not exist. Registering or previewing a claim outside
      the scope gives 403. A clinic's claims get its `clinicId` from the token.
    - Market (ISO 3166-1) and currency (ISO 4217) are on every claim.
      Amounts are never converted: a claim has the same currency as the policy.
    - Rule outcomes have a stable `reason` and `params`. The text in `message`
      is a convenience in the language requested with `Accept-Language`
      (sv, en; default en).
servers:
  - url: http://localhost:8787
security:
  - bearerAuth: []
tags:
  - name: documents
    description: Files in Petvold's archive, opened through links that expire (ADR 0038).
  - name: claims
    description: Claims for vet care, registered by a clinic or the customer, assessed against the policy and the product's rules.
  - name: decisions
    description: Decisions on claims, with their evidence and explanation (ADR 0018).
  - name: reviews
    description: A person's review of an automated decision, asked for on the customer's behalf (ADR 0018).
  - name: approvals
    description: Decisions above a handler's limit, approved or returned by someone else (ADR 0019).
  - name: access
    description: Who the caller is, and the installation's roles and limits (ADR 0016, 0020).
  - name: rule-sets
    description: Versioned rule sets, tariffs, price terms and underwriting rules, published with four eyes (ADR 0021).
  - name: reference-data
    description: Species, breeds and sexes (ADR 0022).
  - name: products
    description: Product versions with their options, settings and documents, published with four eyes (ADR 0023).
  - name: animals
    description: The animal register, its identifiers and owners, and the clinics' lookup (ADR 0024, 0025).
  - name: parties
    description: Persons and organizations, erasure and retention (ADR 0026, 0028).
  - name: policies
    description: Policies, applications, quotes, proposals and groups (ADR 0029, 0030, 0031).
  - name: previews
    description: A pre-approval for a clinic, without storing anything.
  - name: limits
    description: The consumed and remaining annual limit of a policy.
  - name: notices
    description: Notices the law requires the customer to get, for the insurer's document system (ADR 0032).
  - name: billing
    description: Payer accounts and premium plans, made from the policies' events (ADR 0040).
  - name: webhooks
    x-displayName: webhook subscriptions
    description: |
      Subscriptions that send Petvold's events to the insurer's systems (ADR 0033).
      The events themselves, with the fields of each, are described in the
      events contract `asyncapi.yaml`, next to this one.

  - name: jobs
    x-displayName: runs
    description: |
      Petvold's daily runs (ADR 0037): renewal, expiry and retention, run once a
      day per market, one server at a time, with their history. Pause, resume
      and run now, and the relay's dead letters.

paths:
  /v1/claims:
    get:
      tags: [claims]
      operationId: listClaims
      x-permission: claims:read
      summary: Claims for lists and work queues
      description: |
        Requires the permission `claims:read`. Oldest received first. Only claims
        in the caller's scope: its markets, a clinic's own claims, or the bound
        policies' claims. A work queue is a status:

        - `awaiting-decision`: no decision yet, e.g. sent to a handler
        - `awaiting-approval`: a decision proposal waits for an approver (ADR 0019)
        - `awaiting-information`: a request for information waits for the customer or the clinic (ADR 0036)
        - `review-requested`: the customer asked for a person to review an automated decision (ADR 0018)
        - `decided`
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ClaimStatus' } }
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - { name: policyId, in: query, schema: { type: string } }
        - { name: animalId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of claims
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [claims]
      operationId: registerClaim
      x-permission: claims:register
      summary: Register a claim
      description: |
        Requires the permission `claims:register`.

        The claim is assessed immediately. If every rule is green and the amount
        is below the auto-settle limit, the decision is made automatically
        and returned in `decision`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            examples:
              otit:
                $ref: '#/components/examples/ClaimOtitAuto'
              korsband:
                $ref: '#/components/examples/ClaimKorsbandManual'
              foreStart:
                $ref: '#/components/examples/ClaimBeforePolicy'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterClaimResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}:
    get:
      tags: [claims]
      operationId: getClaim
      x-permission: claims:read
      description: Requires the permission `claims:read`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/assessment:
    get:
      tags: [claims]
      operationId: assessClaim
      x-permission: claims:read
      summary: Current assessment, without storing anything
      description: |
        Requires the permission `claims:read`.

        `knownAt` assesses against the policy as it was known at a given
        point in time (system time). Omitted = now.

        `routing` says why the claim needs a claims handler, or that it may be
        settled automatically: rules to review or that fail, a proposal to
        reject, or a payout above the product's limit for automatic settlement.
        It is worked out on reading and not stored with a decision, so stored
        assessments recompute as before (ADR 0018).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: knownAt
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Assessment, with why it needs a claims handler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentWithRouting' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/decisions:
    get:
      tags: [decisions]
      operationId: listDecisions
      x-permission: claims:read
      description: Requires the permission `claims:read`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All decisions in order, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [decisions]
      operationId: decideClaim
      x-permission: claims:decide
      summary: Make a claims handler decision
      description: |
        Requires the permission `claims:decide`.

        `accept` decides as the assessment proposes. `reject` against a proposal
        to approve is a deviation (ADR 0018): it also requires the permission
        `claims:override` (403 without it), and `reasonCode` and `reason` (422
        without them). The decision records `deviatesFromProposal`.

        Every decision stores its evidence: exactly the input the engine
        assessed, the calculation model and the engine version.

        If the payout exceeds the caller's decision limit in the claim's
        currency, nothing is decided: the answer is `202` with a decision
        proposal that someone else with `claims:approve` must approve
        (ADR 0019). While a proposal is open, no other decision can be made
        on the claim (409). A decision that increases the payout writes the
        event `claim.payout_ordered`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
            examples:
              godkann:
                $ref: '#/components/examples/DecideAccept'
              avsla:
                $ref: '#/components/examples/DecideReject'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Decision made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '202':
          description: The payout exceeds the caller's limit. A proposal awaits approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/decisions/{seq}/explanation:
    get:
      tags: [decisions]
      operationId: explainDecision
      x-permission: claims:read
      summary: Explain a decision
      description: |
        Requires the permission `claims:read`.

        Why the decision came out as it did (ADR 0018, GDPR art. 13–15 and 22):
        the main reason, every rule the engine checked, the calculation step by
        step, a handler's motivation when the decision deviates from the
        proposal, and whether a human review can be requested. Built from the
        stored decision and its evidence, so it is the same today and later.
        Every part has a stable `reason` and `params`; `message` is the text in
        the language from `Accept-Language`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionExplanation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/decisions/{seq}/replays:
    post:
      tags: [decisions]
      operationId: replayDecision
      x-permission: claims:read
      summary: Recalculate a stored decision from its evidence
      description: |
        Requires the permission `claims:read`.

        Runs the decision's stored evidence (input, rules and calculation model)
        through the engine again and compares the result with the stored
        assessment (ADR 0018). Nothing is stored or booked, so no
        `Idempotency-Key` is needed. `identical: true` proves the decision can
        be reproduced exactly. Decisions made before evidence was stored give 404.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The result of the recalculation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/reassessments:
    post:
      tags: [decisions]
      operationId: reassessClaim
      x-permission: claims:reassess
      summary: Reassess a decided claim
      description: |
        Requires the permission `claims:reassess`.

        Reassesses the claim against the current basis, e.g. after a retroactive
        policy change. If the basis has changed, a new decision is created and
        the ledger books the difference. 204 if nothing changed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassessRequest' }
            examples:
              omprovning:
                $ref: '#/components/examples/Reassess'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: New decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '204':
          description: Basis unchanged, no new decision
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/claims/{claimId}/decisions/{seq}/review-requests:
    post:
      tags: [reviews]
      operationId: requestReview
      x-permission: claims:request-review
      summary: Request a human review of an automated decision
      description: |
        Requires the permission `claims:request-review`.

        The customer's right to human review, to state their view and to
        contest an automated decision (ADR 0018, GDPR art. 22). Allowed for
        the claim's latest decision when it is automated (`automated: true`),
        and only one open request per claim (409 otherwise). The request is
        open until a claims handler decides the claim; that decision is the
        review, carries `reviewRequestId` and closes the request.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Seq'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequestInput' }
            examples:
              withStatement:
                $ref: '#/components/examples/ReviewRequestWithStatement'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The request is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/review-requests:
    get:
      tags: [reviews]
      operationId: listReviewRequests
      x-permission: claims:read
      summary: List the claim's review requests
      description: Requires the permission `claims:read`. Oldest first, open and closed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewRequest' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/proposals:
    get:
      tags: [approvals]
      operationId: listProposals
      x-permission: claims:read
      summary: List the claim's decision proposals
      description: Requires the permission `claims:read`. Oldest first, open and closed.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The proposals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DecisionProposal' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/claims/{claimId}/proposals/{proposalId}/approvals:
    post:
      tags: [approvals]
      operationId: approveProposal
      x-permission: claims:approve
      summary: Approve a decision proposal
      description: |
        Requires the permission `claims:approve`.

        Turns an open proposal into a decision (ADR 0019). The approver must
        not be the proposer (403, four eyes), and the payout must be within
        the approver's limit (403). The engine assesses the claim again; if
        the basis is no longer the one the proposal was made on, the approval
        is refused (409) and the proposal must be returned. The decision is
        booked as usual and records `approvedBy` and `proposalId`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Approved; the decision is made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/withdrawals:
    post:
      tags: [claims]
      operationId: withdrawClaim
      x-permission: claims:register
      summary: The customer withdraws the claim
      description: |
        Requires the permission `claims:register`.

        Closes the claim without a decision (ADR 0036). Only before any
        decision; after one, correct or reassess the claim instead. Open
        decision proposals are returned with the reason, and the reserve is
        released. Nothing of the limit is consumed. Cannot be undone.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawClaimRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimClosure' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/corrections:
    post:
      tags: [claims]
      operationId: correctClaim
      x-permission: claims:register
      summary: Correct the claim's details
      description: |
        Requires the permission `claims:register`.

        The claim gets a new revision; earlier ones are kept (`GET …/revisions`),
        and each decision names the revision it was made on (ADR 0036). Treatment
        dates, diagnosis, invoice lines and channel can be corrected. A claim on
        the wrong policy, animal, market or currency is dismissed and registered
        anew. Not on a closed claim or one with an open decision proposal.

        After a decision:
        - **made by a person:** the claim is reopened (`reopened`) and waits for a
          new decision by a person. The machine never replaces a person's judgement.
        - **automated:** it is assessed again. With the same outcome and payout the
          decision stands. With another outcome that may still be settled
          automatically, a new automated decision books the difference
          (`decision`). Otherwise the claim is reopened for a handler.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectClaimRequest' }
            examples:
              diagnosis:
                $ref: '#/components/examples/CorrectDiagnosis'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/attachments:
    get:
      tags: [claims]
      operationId: listClaimAttachments
      x-permission: claims:read
      summary: The claim's attachments
      description: Requires the permission `claims:read`. Oldest first, also those a later one replaced.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of attachments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimAttachment' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [claims]
      operationId: addClaimAttachment
      x-permission: claims:register
      summary: Add a document to the claim, as a reference to the archive
      description: |
        Requires the permission `claims:register`.

        Petvold keeps the address in the insurer's archive and the checksum,
        never the file (ADR 0036). An attachment never changes; a new one may
        replace it (`replaces`). Every decision keeps the attachments in force
        when it was made, by id and checksum, in its explanation's `basis`. They
        are not input to the rules, so earlier decisions recalculate as before.
        Not on a closed claim.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentInput' }
            examples:
              invoice:
                $ref: '#/components/examples/AttachmentInvoice'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimAttachment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/documents:
    post:
      tags: [documents]
      operationId: uploadClaimDocument
      x-permission: claims:register
      summary: Upload a file to the claim's archive
      description: |
        Requires the permission `claims:register`.

        The file is kept in Petvold's archive (ADR 0038): at most 25 MB, a PDF,
        JPEG, PNG or HEIC whose content matches the media type. Petvold
        computes the checksum itself. The document belongs to the claim and
        concerns the policyholder, so it is in the customer's list of
        documents. It never changes. Open it with a link (`…/links`).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/revisions:
    get:
      tags: [claims]
      operationId: listClaimRevisions
      x-permission: claims:read
      summary: The claim's revisions
      description: Requires the permission `claims:read`. Oldest first, revision 1 as registered and then each correction.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimRevision' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/information-requests:
    get:
      tags: [claims]
      operationId: listInformationRequests
      x-permission: claims:read
      summary: The claim's requests for information
      description: Requires the permission `claims:read`. Oldest first.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InformationRequest' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [claims]
      operationId: requestInformation
      x-permission: claims:request-information
      summary: Ask the customer or the clinic for more information
      description: |
        Requires the permission `claims:request-information`.

        The claim waits in `awaiting-information` until the request is answered,
        cancelled or expires (ADR 0036). The days to the reminder and the due
        date come from the product's claims rules (`informationRequest`, 14 and
        30 days if not set), unless `dueDate` is given. A daily run reminds and
        expires requests (job `claims.information-requests`). An expired request
        never rejects the claim: it goes back to a claims handler.

        Not on a closed claim or one with an open decision proposal, and one open
        request per recipient. A decision waits until no request is open.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InformationRequestInput' }
            examples:
              invoice:
                $ref: '#/components/examples/InformationRequestClinic'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InformationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/information-requests/{requestId}/answers:
    post:
      tags: [claims]
      operationId: answerInformationRequest
      x-permission: claims:register
      summary: Register that the information came in
      description: |
        Requires the permission `claims:register`.

        Closes the request as answered, also after it expired, and the claim
        goes back to the queue. `receivedAt` sets when the basis was complete
        (`basisCompleteAt`, FAL 7 kap. 1 §).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/InformationRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InformationAnswerInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InformationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/information-requests/{requestId}/cancellations:
    post:
      tags: [claims]
      operationId: cancelInformationRequest
      x-permission: claims:request-information
      summary: Cancel an open request for information
      description: |
        Requires the permission `claims:request-information`.

        The request is no longer needed, e.g. the handler got the information
        another way. It does not move `basisCompleteAt`. Closing the claim
        cancels its open requests too.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/InformationRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelInformationRequestInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InformationRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/dismissals:
    post:
      tags: [claims]
      operationId: dismissClaim
      x-permission: claims:decide
      summary: Dismiss the claim, e.g. as a duplicate
      description: |
        Requires the permission `claims:decide`.

        Closes the claim without a decision (ADR 0036): a duplicate, a claim
        registered in error, or one that is not a claim. Not a rejection: no
        decision, explanation or review. Only before any decision. Open
        decision proposals are returned with the reason, and the reserve is
        released. Cannot be undone.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissClaimRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimClosure' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claims/{claimId}/proposals/{proposalId}/returns:
    post:
      tags: [approvals]
      operationId: returnProposal
      x-permission: claims:approve
      summary: Return a decision proposal without a decision
      description: |
        Requires the permission `claims:approve`.

        Closes an open proposal with a reason. Nothing is decided or booked,
        and a new decision can be made on the claim.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnProposalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/documents:
    get:
      tags: [documents]
      operationId: listPartyDocuments
      x-permission: parties:read
      summary: Every document about a customer, wherever it is kept
      description: |
        Requires the permission `parties:read`. One list, newest first (ADR 0038 point 8):
        - `source: petvold`: files in Petvold's archive (needs `documents:read`). Open one with `POST /v1/documents/{id}/links`.
        - `source: insurer`, `type: notice`: notices the insurer's document system sent, with its archive id and checksum (needs `notices:read`).
        - `source: insurer`, `type: attachment`: claim attachments in the insurer's archive, with their address (needs `claims:read`).

        Each entry is only there if the caller may see what it belongs to, within the scope.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerDocument' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/notices/{noticeId}/documents:
    post:
      tags: [documents]
      operationId: renderNoticeDocument
      x-permission: notices:deliver
      summary: Make the notice a PDF from Petvold's template
      description: |
        Requires the permission `notices:deliver`.

        Petvold fills its template for the notice's type, market and language
        with the notice's content, and the recipient's name and address, the
        animal's name and the reasons' texts read now. Gotenberg turns it into
        PDF/A (ADR 0038). The document belongs to the notice, concerns its
        recipient, and keeps the template's version and checksum and the data's
        hash. Making it again gives a new document. 503 without a PDF renderer
        (PETVOLD_GOTENBERG_URL), 422 for a type without a template.
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      x-permission: documents:read
      summary: Documents of a customer, a claim or a policy
      description: |
        Requires the permission `documents:read`, and for each document the right
        to what it belongs to: `claims:read` for a claim, `policies:read` for a
        policy and `notices:read` for a notice, within the caller's scope. A
        customer's list (`partyId`) also needs `parties:read`. Newest first.
        Give one of partyId, claimId, policyId and noticeId.
      parameters:
        - { name: partyId, in: query, schema: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' } }
        - { name: claimId, in: query, schema: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' } }
        - { name: policyId, in: query, schema: { type: string, pattern: '^pol_[A-Za-z0-9_]+$' } }
        - { name: noticeId, in: query, schema: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Document' } }
                  nextCursor: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      x-permission: documents:read
      summary: A document's record
      description: Requires the permission `documents:read` and the right to what the document belongs to. The file is opened with a link.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/documents/{documentId}/links:
    get:
      tags: [documents]
      operationId: listDocumentLinks
      x-permission: documents:read
      summary: The document's links, and when each was opened
      description: Requires the permission `documents:read` and the right to what the document belongs to. Newest first. Who has seen the document (GDPR art. 15).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of links
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [documents]
      operationId: createDocumentLink
      x-permission: documents:read
      summary: A link to the document that expires
      description: |
        Requires the permission `documents:read` and the right to what the
        document belongs to. A link for the customer (`audience: customer`) also
        needs `documents:share`.

        The address is `{base}/d/{token}`: a random id and a signature, naming
        neither the document nor the customer (ADR 0038). It works until
        `expiresAt`: for a person here 15 minutes, for the customer 60 seconds
        to 7 days (default 15 minutes). Every opening is logged, and a link can
        be revoked. An erased document gets no links (410).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentLinkRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentLinkCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/documents/{documentId}/links/{linkId}/revocations:
    post:
      tags: [documents]
      operationId: revokeDocumentLink
      x-permission: documents:share
      summary: Revoke a link
      description: Requires the permission `documents:share` and the right to what the document belongs to. The link stops working at once.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/DocumentLinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentLink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me:
    get:
      tags: [access]
      operationId: getMe
      x-permission: signed-in
      summary: Who the caller is and what it may do
      description: |
        Requires only a valid token. For a user interface: which menus to show
        and which buttons to enable. The answer follows the role settings in
        force (ADR 0020), so a change applies at the next call.

        Roles in the token that the installation does not know are listed in
        `unknownRoles` and give nothing. The API still checks every call; this
        answer only helps the interface not to offer what would be refused.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /v1/settings/roles:
    get:
      tags: [access]
      operationId: getRoles
      x-permission: access:read
      summary: The role settings in force
      description: |
        Requires the permission `access:read`.

        Which permissions, binding and amount limits each role has in this
        installation (ADR 0016, 0019, 0020). Changes apply at once.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConfig' }

  /v1/settings/roles/versions:
    get:
      tags: [access]
      operationId: listRoleVersions
      x-permission: access:read
      summary: The history of the role settings
      description: Requires the permission `access:read`. Every version, oldest first. Versions never change.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoleConfig' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
    post:
      tags: [access]
      operationId: changeRoles
      x-permission: access:manage
      summary: Store a new version of the role settings
      description: |
        Requires the permission `access:manage`.

        Replaces the whole role set with a new version (ADR 0020), e.g. to
        raise a handler's decision limit. Refused when:
        - `basedOnVersion` is not the current version: someone else changed
          the settings in between (409)
        - the change touches a role the caller holds: nobody raises their own
          limits or removes their own access (403)
        - a permission, binding, currency or limit is invalid, or the reason
          is empty (422)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRolesRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The new version, in force at once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConfig' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets:
    get:
      tags: [rule-sets]
      operationId: listRuleSetSeries
      x-permission: rules:read
      summary: Every series of claims rules, tariffs, price terms and underwriting rules
      description: Requires the permission `rules:read`. Sorted by series, with what each holds and its versions' states.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of series
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: 
                    type: array
                    items:
                      type: object
                      required: [series, kind, versions]
                      properties:
                        series: { type: string }
                        kind: { type: string, enum: [claims-rules, tariff, price-terms, underwriting] }
                        versions:
                          type: array
                          items:
                            type: object
                            required: [version, status, effectiveFrom]
                            properties:
                              version: { type: integer }
                              status: { type: string, enum: [draft, in_review, published, retired] }
                              effectiveFrom: { $ref: '#/components/schemas/Date' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions:
    get:
      tags: [rule-sets]
      operationId: listRuleSetVersions
      x-permission: rules:read
      summary: The versions of a rule series
      description: |
        Requires the permission `rules:read`.

        A rule series (e.g. `SE-HUND-VV`) holds a product's claims rules as
        numbered versions (ADR 0018, 0021). Lifecycle: `draft` → `in_review` →
        `published` → `retired`. The claims engine uses the published version
        with the latest `effectiveFrom` not after the treatment date.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RuleSetVersion' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
    post:
      tags: [rule-sets]
      operationId: createRuleSetDraft
      x-permission: rules:write
      summary: Create a draft with the next version number
      description: Requires the permission `rules:write`. The calculation model must be one the engine has.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSetDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}:
    get:
      tags: [rule-sets]
      operationId: getRuleSetVersion
      x-permission: rules:read
      summary: One version of a rule series
      description: Requires the permission `rules:read`.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      tags: [rule-sets]
      operationId: updateRuleSetDraft
      x-permission: rules:write
      summary: Change a draft
      description: Requires the permission `rules:write`. Only drafts can change (409 otherwise).
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSetDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The changed draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/publications:
    post:
      tags: [rule-sets]
      operationId: publishRuleSet
      x-permission: rules:publish
      summary: Publish a version in review
      description: |
        Requires the permission `rules:publish`.

        Someone other than the submitter (403, four eyes). From `effectiveFrom`, new assessments use it. A published version never changes. Two published versions in a series cannot apply from the same date (409).
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/retirements:
    post:
      tags: [rule-sets]
      operationId: retireRuleSet
      x-permission: rules:publish
      summary: Retire a published version
      description: |
        Requires the permission `rules:publish`.

        Needs a reason. New assessments no longer use it; stored decisions keep their rules in their evidence.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/returns:
    post:
      tags: [rule-sets]
      operationId: returnRuleSet
      x-permission: rules:publish
      summary: Return a version in review to draft
      description: |
        Requires the permission `rules:publish`.

        Needs a reason. The checksum is removed, and the draft can change again.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/simulations:
    post:
      tags: [rule-sets]
      operationId: simulateRuleSet
      x-permission: rules:simulate
      summary: Simulate a rule set version against stored decisions
      description: |
        Requires the permission `rules:simulate`.

        Runs the version's rules (a draft or any other version) against the
        stored evidence of decisions made in [`from`, `to`): each claim's
        latest decision, from the same series, within the caller's scope
        (ADR 0018). Shows how many decisions would change, moves between
        automatic and manual handling, and payouts per currency. Nothing is
        stored or booked, so no `Idempotency-Key` is needed. Each decision is
        simulated on its own; knock-on effects between claims, such as
        deductible periods, are not simulated. A tariff version answers `422`
        until prices are stored with policies (ADR 0030).
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/rule-sets/{series}/versions/{version}/submissions:
    post:
      tags: [rule-sets]
      operationId: submitRuleSet
      x-permission: rules:write
      summary: Submit a draft for review
      description: |
        Requires the permission `rules:write`.

        Locks the content and computes its checksum.
      parameters:
        - $ref: '#/components/parameters/Series'
        - $ref: '#/components/parameters/RuleSetVersionNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The version after the step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/reference-data/{kind}:
    get:
      tags: [reference-data]
      operationId: listReferenceItems
      x-permission: catalog:read
      summary: The codes of a kind of reference data
      description: |
        Requires the permission `catalog:read`.

        Reference data are the code lists other data point at: `species`,
        `breed` and `sex` (ADR 0022). A code never changes and is never
        deleted; it is deactivated instead. `label` is in the language asked
        for with `Accept-Language`, and `labels` has every language.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - name: parent
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
          in: query
          description: Only the children of this code, e.g. the breeds of `dog`.
          schema: { type: string }
        - name: active
          in: query
          description: Only active (`true`) or inactive (`false`) codes. Omitted means both.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The latest revision of every code, ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceItem' }

                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }

  /v1/reference-data/{kind}/{code}:
    get:
      tags: [reference-data]
      operationId: getReferenceItem
      x-permission: catalog:read
      summary: One code
      description: Requires the permission `catalog:read`.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The latest revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
    put:
      tags: [reference-data]
      operationId: putReferenceItem
      x-permission: catalog:write
      summary: Create a code or store a new revision of it
      description: |
        Requires the permission `catalog:write`.

        - A new code: omit `basedOnRevision`. A breed needs an active `parent` species.
        - A change: `basedOnRevision` is the current revision, and `reason` is required.
          Another revision stored since gives `409`.
        - The parent never changes. Deactivate with `active: false`.
        - Repeating a change that is already stored returns it unchanged, so a retry is safe.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceItemChange' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The code was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
        '200':
          description: The new revision, or the stored one if nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/reference-data/{kind}/{code}/revisions:
    get:
      tags: [reference-data]
      operationId: listReferenceItemRevisions
      x-permission: catalog:read
      summary: Every revision of a code
      description: Requires the permission `catalog:read`. Shows who changed what, when and why.
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: All revisions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceItem' }

                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }

  /v1/product-versions:
    get:
      tags: [products]
      operationId: listProductVersionsOnSale
      x-permission: catalog:read
      summary: Published product versions on sale on a date
      description: |
        Requires the permission `catalog:read`.

        At most one version of each product is on sale on a day (ADR 0023).
        `name` is in the language asked for with `Accept-Language`.
      parameters:
        - name: onSale
          in: query
          required: true
          description: The date the versions are on sale.
          schema: { $ref: '#/components/schemas/Date' }
        - name: market
          in: query
          schema: { $ref: '#/components/schemas/Market' }
        - name: species
          in: query
          description: A species code from the reference data, e.g. `dog`.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The versions on sale, ordered by product
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductVersion' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products:
    get:
      tags: [products]
      operationId: listProducts
      x-permission: catalog:read
      summary: Every product with its versions
      description: Requires the permission `catalog:read`. Sorted by product; each product's versions oldest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: One page of products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: 
                    type: array
                    items:
                      type: object
                      required: [product, versions]
                      properties:
                        product: { type: string }
                        versions: { type: array, items: { $ref: '#/components/schemas/ProductVersion' } }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions:
    get:
      tags: [products]
      operationId: listProductVersions
      x-permission: catalog:read
      summary: The versions of a product
      description: |
        Requires the permission `catalog:read`.

        A product version (e.g. `SE-HUND-VV-LIV@2026.2`) says what can be sold:
        market, currency, species, sales period, the rule series claims are
        assessed with, and the options for vet care (ADR 0021, 0023).
        Lifecycle: `draft` → `in_review` → `published`, with four eyes.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: All versions, ordered by sales start
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductVersion' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
    post:
      tags: [products]
      operationId: createProductDraft
      x-permission: catalog:write
      summary: Create a draft of a product version
      description: Requires the permission `catalog:write`. The version label is chosen by the author, e.g. `2026.2`.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}:
    get:
      tags: [products]
      operationId: getProductVersion
      x-permission: catalog:read
      summary: One product version
      description: Requires the permission `catalog:read`.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
    put:
      tags: [products]
      operationId: updateProductDraft
      x-permission: catalog:write
      summary: Change a draft
      description: Requires the permission `catalog:write`. Only drafts can change.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraftUpdate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The changed draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/publications:
    post:
      tags: [products]
      operationId: publishProductVersion
      x-permission: catalog:publish
      summary: Publish a version in review
      description: Requires the permission `catalog:publish`, and someone other than the submitter (four eyes). No other version of the product may be on sale in the same period. A published version never changes.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/returns:
    post:
      tags: [products]
      operationId: returnProductVersion
      x-permission: catalog:publish
      summary: Return a version in review to draft
      description: Requires the permission `catalog:publish`. Needs a reason.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/sales-endings:
    post:
      tags: [products]
      operationId: endProductSales
      x-permission: catalog:publish
      summary: Bring the end of sales forward
      description: Requires the permission `catalog:publish`. Never before today, and never later than an earlier end. Policies already written keep the version and its rule series.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesEndRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/submissions:
    post:
      tags: [products]
      operationId: submitProductVersion
      x-permission: catalog:write
      summary: Submit a draft for review
      description: Requires the permission `catalog:write`. Locks the content and computes its checksum. Every species must be active, and the rule series must have a published version in force when sales start.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The product version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVersion' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/products/{product}/versions/{version}/vet-care-terms:
    get:
      tags: [products]
      operationId: getVetCareTerms
      x-permission: catalog:read
      summary: The vet care terms for a customer's choices
      description: |
        Requires the permission `catalog:read`. The terms a policy gets when
        written with these choices. A choice left out takes the product's default.
      parameters:
        - $ref: '#/components/parameters/Product'
        - $ref: '#/components/parameters/ProductVersionLabel'
        - name: annualLimit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: deductible
          in: query
          description: The code of a deductible option, e.g. `standard`.
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VetCareTerms' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animal-summaries:
    get:
      tags: [animals]
      operationId: lookupAnimal
      x-permission: animals:lookup
      summary: Look up an animal by identifier, e.g. a clinic reading a microchip
      description: |
        Requires the permission `animals:lookup`. Give exactly one identifier.
        Finds the animal only if it is open for lookup (`allowLookup`) and in
        one of the caller's markets. Shows the details and identifiers, never
        the owners or the change history (ADR 0025). An animal that is not
        found, closed or outside the markets all give an empty list.
      parameters:
        - { name: microchip, in: query, schema: { type: string }, description: '15 digits (ISO 11784). Spaces and hyphens are ignored.' }
        - { name: registration, in: query, schema: { type: string } }
        - { name: passport, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The animal, or an empty list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1
                    items: { $ref: '#/components/schemas/AnimalSummary' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals:
    get:
      tags: [animals]
      operationId: findAnimals
      x-permission: animals:read
      summary: Find animals by identifier or owner
      description: |
        Requires the permission `animals:read`. Give exactly one of the filters.
        Only animals in the caller's markets are returned. Roles bound to a
        clinic or to policies see no animals (ADR 0024); a clinic uses
        `GET /v1/animal-summaries` instead (ADR 0025).
      parameters:
        - { name: microchip, in: query, schema: { type: string }, description: '15 digits (ISO 11784). Spaces and hyphens are ignored.' }
        - { name: registration, in: query, schema: { type: string } }
        - { name: passport, in: query, schema: { type: string } }
        - { name: ownerPartyId, in: query, schema: { type: string }, description: 'Animals the party owns today.' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The animals found
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AnimalRecord' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [animals]
      operationId: registerAnimal
      x-permission: animals:write
      summary: Register an animal with its first owner
      description: |
        Requires the permission `animals:write`. Species, breed and sex are
        codes from the reference data; the breed must belong to the species.
        An identifier that another animal has gives `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}:
    get:
      tags: [animals]
      operationId: getAnimal
      x-permission: animals:read
      summary: An animal with its identifiers and owners
      description: Requires the permission `animals:read`. An animal outside the caller's markets answers 404.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
    put:
      tags: [animals]
      operationId: correctAnimal
      x-permission: animals:write
      summary: Correct or update an animal's details
      description: |
        Requires the permission `animals:write`. A new revision with a reason,
        e.g. neutered, a corrected breed or a date of death. `basedOnRevision`
        must be the current revision. Market and species never change.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}/identifiers:
    post:
      tags: [animals]
      operationId: addAnimalIdentifier
      x-permission: animals:write
      summary: Add an identifier
      description: Requires the permission `animals:write`. Identifiers are never removed. Adding one the animal already has returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentifierInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}/ownerships:
    post:
      tags: [animals]
      operationId: transferAnimal
      x-permission: animals:write
      summary: Change owner from a date
      description: Requires the permission `animals:write`. The current ownership ends the day the new one starts. Not after the animal died.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferAnimalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/animals/{animalId}/revisions:
    get:
      tags: [animals]
      operationId: listAnimalRevisions
      x-permission: animals:read
      summary: Every revision of an animal's details
      description: Requires the permission `animals:read`. Shows who changed what, when and why.
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: All revisions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Animal' }

                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }

  /v1/litters:
    post:
      tags: [animals]
      operationId: registerLitter
      x-permission: animals:write
      summary: Register a litter with all its animals
      description: |
        Requires the permission `animals:write`. Registers every animal in the
        litter at once, owned by the breeder from the birth date (ADR 0027).
        The dam and sire, if given, must be registered animals of the species in
        the same market, born before the litter. Without a breed, the animals
        get the parents' breed when both have the same one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLitterRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The litter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Litter' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/litters/{litterId}:
    get:
      tags: [animals]
      operationId: getLitter
      x-permission: animals:read
      summary: A litter with its parents, breeder and animals
      description: Requires the permission `animals:read`. A litter outside the caller's markets answers 404.
      parameters:
        - name: litterId
          in: path
          required: true
          schema: { type: string, pattern: '^lit_[A-Za-z0-9]+$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The litter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Litter' }

  /v1/erasure-requests:
    get:
      tags: [parties]
      operationId: listErasureRequests
      x-permission: parties:privacy
      summary: Erasure requests, oldest first
      description: Requires the permission `parties:privacy`. Only requests for parties in the caller's markets.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, decided] } }
        - { name: partyId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ErasureRequest' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/erasure-requests/{requestId}:
    get:
      tags: [parties]
      operationId: getErasureRequest
      x-permission: parties:privacy
      summary: An erasure request with its decision
      description: Requires the permission `parties:privacy`.
      parameters:
        - $ref: '#/components/parameters/ErasureRequestId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }

  /v1/erasure-requests/{requestId}/approvals:
    post:
      tags: [parties]
      operationId: approveErasure
      x-permission: parties:erase
      summary: Approve an erasure request and anonymize the party
      description: |
        Requires the permission `parties:erase`. Not by the one who asked
        (`403`, four eyes). Removes the party's personal data from every
        revision and its identifiers. Cannot be undone (ADR 0028).
      parameters:
        - $ref: '#/components/parameters/ErasureRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureApprovalInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The decided request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/erasure-requests/{requestId}/rejections:
    post:
      tags: [parties]
      operationId: rejectErasure
      x-permission: parties:privacy
      summary: Reject an erasure request
      description: |
        Requires the permission `parties:privacy`. A request from the data
        subject is rejected when the data must be kept (GDPR article 17.3); it
        then needs `restrictUntil`, and the party is restricted until that date
        (article 18): only callers with `parties:privacy` see it.
      parameters:
        - $ref: '#/components/parameters/ErasureRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureRejectionInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The decided request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties:
    post:
      tags: [parties]
      operationId: registerParty
      x-permission: parties:write
      summary: Register a person or an organization
      description: |
        Requires the permission `parties:write`. A person has `givenName` and
        `familyName`, an organization has `name`. A personal or organization
        number that another party has gives `409`. Swedish numbers are checked
        (date and check digit).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPartyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/searches:
    post:
      tags: [parties]
      operationId: searchParties
      x-permission: parties:read
      summary: Find a party by personal or organization number, or by name or email
      description: |
        Requires the permission `parties:read`. The number or text is sent in
        the body, so it never ends up in URLs or access logs (ADR 0026, 0039).
        Only parties in the caller's markets are returned, and personal numbers
        are masked. A text finds parties whose name or email contains it, at
        most 50, sorted by name; a restricted party only for parties:privacy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartySearchRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The party, or an empty list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/PartyRecord' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}:
    get:
      tags: [parties]
      operationId: getParty
      x-permission: parties:read
      summary: A party with its identifiers
      description: Requires the permission `parties:read`. A party outside the caller's markets, or any party for a role bound to a clinic or to policies, answers 404.
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
    put:
      tags: [parties]
      operationId: changeParty
      x-permission: parties:write
      summary: Change a party's details
      description: |
        Requires the permission `parties:write`. Replaces all details with a new
        revision; details left out are removed. Kind and market never change.
      parameters:
        - $ref: '#/components/parameters/PartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePartyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/erasure-requests:
    post:
      tags: [parties]
      operationId: requestPartyErasure
      x-permission: parties:privacy
      summary: Ask for a party to be anonymized
      description: |
        Requires the permission `parties:privacy` (ADR 0028). Someone else
        approves or rejects the request. A party has at most one undecided
        request; another gives `409`.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureRequestInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/identifiers:
    post:
      tags: [parties]
      operationId: addPartyIdentifier
      x-permission: parties:write
      summary: Add a personal or organization number
      description: Requires the permission `parties:write`. Adding one the party already has returns it unchanged. A number removed from another party may be added (ADR 0039).
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyIdentifierInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/identifiers/{identifierId}/removals:
    post:
      tags: [parties]
      operationId: removePartyIdentifier
      x-permission: parties:write
      summary: Remove a personal or organization number
      description: |
        Requires the permission `parties:write` (ADR 0039). The number stays as history with who,
        when and why, and no longer counts: it may then be added to the right party.
        To correct a number, remove it and add the right one. The identifier's id is
        used, since a personal number is shown masked and never put in an address.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - { name: identifierId, in: path, required: true, schema: { type: string, pattern: '^pid_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/restrictions:
    post:
      tags: [parties]
      operationId: restrictParty
      x-permission: parties:privacy
      summary: Restrict the processing of a party (GDPR article 18)
      description: |
        Requires the permission `parties:privacy` (ADR 0039). The party is restricted up to and
        including `until`, a date after today: only callers with parties:privacy see it,
        and nothing new may point at it. The latest restriction or lifting is in force,
        also against a rejected erasure request.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictPartyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/restriction-liftings:
    post:
      tags: [parties]
      operationId: liftPartyRestriction
      x-permission: parties:privacy
      summary: Lift the restriction of a party
      description: |
        Requires the permission `parties:privacy` (ADR 0039). 409 if the party is not restricted.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/endings:
    post:
      tags: [parties]
      operationId: endParty
      x-permission: parties:write
      summary: End a party (deceased, dissolved or another cause)
      description: |
        Requires the permission `parties:write` (ADR 0039). An ended party cannot become a
        policyholder, owner or recipient of anything new; its details may still change,
        e.g. an estate's address, and it is erased by the retention rules (ADR 0028).
        409 while it is the policyholder of a policy in force: cancel or transfer the
        policy first. The problem's detail then names the policies.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndPartyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/reopenings:
    post:
      tags: [parties]
      operationId: reopenParty
      x-permission: parties:write
      summary: Reopen an ended party
      description: |
        Requires the permission `parties:write` (ADR 0039), e.g. for a party ended by mistake.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The party
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/parties/{partyId}/revisions:
    get:
      tags: [parties]
      operationId: listPartyRevisions
      x-permission: parties:read
      summary: Every revision of a party's details, oldest first
      description: Requires the permission `parties:read`. Shows who changed what, when and why.
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Party' }

                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }

  /v1/retention-runs:
    post:
      tags: [parties]
      operationId: runRetention
      x-permission: parties:retention
      summary: Ask for anonymization of every party whose retention has ended
      description: |
        Requires the permission `parties:retention`. Checks every party in the
        caller's markets: a party is due when no relation is ongoing and the
        retention after its last relation has ended. With `dryRun` only lists
        them; otherwise each gets an erasure request (`retention-expired`) that
        a privacy officer approves or rejects. Meant to run on a schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionRunRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: What the run found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionRunResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/settings/retention:
    get:
      tags: [parties]
      operationId: getRetentionSettings
      x-permission: parties:privacy
      summary: How long parties are kept after their last relation, per market
      description: |
        Requires the permission `parties:privacy` (ADR 0028). Version 1 is
        Petvold's suggestion (Sweden: ten years); the insurer is responsible
        for the values.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }

  /v1/settings/retention/versions:
    get:
      tags: [parties]
      operationId: listRetentionSettings
      x-permission: parties:privacy
      summary: Every version of the retention settings, oldest first
      description: Requires the permission `parties:privacy`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RetentionSettings' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
    post:
      tags: [parties]
      operationId: changeRetentionSettings
      x-permission: parties:erase
      summary: Change the retention settings
      description: |
        Requires the permission `parties:erase`, since a shorter retention leads
        to earlier anonymization. Replaces every market's rule with a new
        version. A market left out is no longer erased automatically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRetentionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/application-expiry-runs:
    post:
      tags: [policies]
      operationId: expireApplications
      x-permission: policies:renew
      summary: End referred applications not decided by their deadline
      description: Requires the permission `policies:renew`, like the other scheduled policy jobs. Every `referred` application in the caller's markets whose `deadline` has passed becomes `expired`. Running it twice is harmless.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The applications that expired
          content:
            application/json:
              schema:
                type: object
                required: [expired]
                properties:
                  expired: { type: array, items: { $ref: '#/components/schemas/Application' } }

  /v1/application-questions:
    get:
      tags: [policies]
      operationId: applicationQuestions
      x-permission: policies:quote
      summary: The underwriting questions to ask for a product and a species
      description: |
        Requires the permission `policies:quote` (ADR 0031). The questions in
        the underwriting rules in force on `date` (default today) for the
        product version, in order, with the text in the caller's language
        (`Accept-Language`) and in every language the rules have. The channel
        asks them and sends the answers with the application. A product
        without underwriting rules answers `409`.
      parameters:
        - { name: productVersion, in: query, required: true, schema: { type: string } }
        - { name: species, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, schema: { $ref: '#/components/schemas/Date' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The questions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationQuestions' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/applications:
    post:
      tags: [policies]
      operationId: apply
      x-permission: policies:write
      summary: Apply for a policy on a product with underwriting rules
      description: |
        Requires the permission `policies:write` (ADR 0031). Takes what
        `POST /v1/policies` takes, and the `answers` to the product's
        underwriting questions (`GET /v1/application-questions`). The rules in
        force today decide, and the application is stored with the evidence:
        the questions answered, every check, the rules' version and checksum.

        - `accepted`: the policy is issued in the same transaction, with any
          riders on its first term. `policyId` points at it.
        - `referred`: the application waits for a person (step 3).
        - `declined`: stored with the reason codes, which the channel explains
          to the customer (FAL 7 kap. 6 §).

        All three answer `201`. A product without underwriting rules answers
        `422`: issue the policy with `POST /v1/policies`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [policies]
      operationId: listApplications
      x-permission: policies:read
      summary: Applications, oldest first
      description: |
        Requires the permission `policies:read`. `status=referred` is the queue
        for manual underwriting. Only applications in the caller's markets; a
        role bound to a clinic or to policies sees none.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [accepted, referred, declined, withdrawn, expired] } }
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - { name: animalId, in: query, schema: { type: string } }
        - { name: policyholderPartyId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The applications
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/applications/{applicationId}:
    get:
      tags: [policies]
      operationId: getApplication
      x-permission: policies:read
      summary: An application with its evidence
      description: Requires the permission `policies:read`. An application outside the caller's scope answers 404.
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, pattern: '^app_[A-Za-z0-9]+$' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }

  /v1/applications/{applicationId}/decisions:
    post:
      tags: [policies]
      operationId: decideApplication
      x-permission: policies:underwrite
      summary: Decide on a referred application
      description: |
        Requires the permission `policies:underwrite` (ADR 0031), which the
        role `underwriter` has. Only an application that waits (`referred`,
        by its `deadline`) can be decided, once (`409` otherwise).

        - `accept` issues the policy at the premium the customer applied at.
          If today's tariff gives another price, the applied price is kept as a
          manual one with its reason. The riders are the rules' proposals, or
          the ones given (`source: manual`). `startDate` moves a start that has
          passed.
        - `decline` needs a reason code, which the channel explains to the
          customer (FAL 7 kap. 6 §).

        Both need `note`: the grounds, kept with the decision.
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, pattern: '^app_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationDecisionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The application with its decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/applications/{applicationId}/withdrawals:
    post:
      tags: [policies]
      operationId: withdrawApplication
      x-permission: policies:write
      summary: Withdraw an application that waits for a person
      description: Requires the permission `policies:write`. For the channel, e.g. when the customer no longer wants the policy. Only a `referred` application (`409` otherwise).
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, pattern: '^app_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationWithdrawalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The withdrawn application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies:
    post:
      tags: [policies]
      operationId: issuePolicy
      x-permission: policies:write
      summary: Issue a policy for an animal
      description: |
        Requires the permission `policies:write` (ADR 0029). The animal and the
        policyholder must exist in the market, and the product version must be
        on sale on the start date and cover the animal's species. A policy never
        starts before the day it is issued, and an animal has one policy at a
        time (`409`). The first term is one year. A product with a tariff is
        priced by it; otherwise the caller gives the premium for the term.
        The customer's `acceptance` is stored on the transaction (ADR 0031).
        A product with underwriting rules answers `422`: send an application
        (`POST /v1/applications`) instead. This operation is removed in /v2.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePolicyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRecord' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [policies]
      operationId: findPolicies
      x-permission: policies:read
      summary: Policies for an animal or a policyholder
      description: Requires the permission `policies:read`. Give exactly one filter. Only policies in the caller's scope are returned.
      parameters:
        - { name: animalId, in: query, schema: { type: string } }
        - { name: policyholderPartyId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The policies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyRecord' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}:
    get:
      tags: [policies]
      operationId: getPolicy
      x-permission: policies:read
      summary: A policy with its terms and current versions
      description: Requires the permission `policies:read`. A policy outside the caller's scope answers 404.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRecord' }

  /v1/policies/{policyId}/cancellations:
    post:
      tags: [policies]
      operationId: cancelPolicy
      x-permission: policies:write
      summary: End a policy
      description: |
        Requires the permission `policies:write` (ADR 0029). The reason decides
        from when, following the market's law and the product's setting:

        - `customer-term-end`: at the end of the term. Nothing changes now; the policy is not renewed.
        - `customer-immediate`: the day after notice (or a later `effectiveDate`), if the product allows it, with the rest of the premium refunded.
        - `withdrawal`: within the withdrawal period after issue, the day after notice.
        - `need-ceased`: from `effectiveDate`, possibly in the past, e.g. the day the animal died. Needs a note.
        - `insurer-term-end`: at the end of the term, with notice before it.
        - `insurer-breach`: after the notice period from `receivedOn` (the day sent). Needs a note.
        - `unpaid-premium`: after the notice period from `receivedOn`.

        `receivedOn` is the day the notice reached or left the insurer
        (default today). Versions from the effective date are superseded by
        a cancelled one, and the refund is the premium per day for the days
        lost. An earlier cancellation still in force gives `409`.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelPolicyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/changes:
    post:
      tags: [policies]
      operationId: changePolicy
      x-permission: policies:write
      summary: Change the choices from a day during the term
      description: |
        Requires the permission `policies:write` (ADR 0029). New annual limit
        or deductible from `from`, today or later, in the policy's latest term.
        `premium` is the premium for a whole term at the new choices (given by
        the caller until the tariff exists); the days left are charged at the
        new rate, and `change.premiumAdjustment` says what that costs or refunds.
        The term never changes: the change is stored with it, and the versions
        from `from` follow it. A renewal keeps the changed choices.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePolicyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/history:
    get:
      tags: [policies]
      operationId: getPolicyHistory
      x-permission: policies:read
      summary: Every version, superseded ones too, and every transaction
      description: |
        Requires the permission `policies:read`. Shows what applied on each day
        and when it became known (ADR 0006).
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: object
                required: [versions, transactions]
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/PolicyVersion' } }
                  transactions: { type: array, items: { $ref: '#/components/schemas/PolicyTransaction' } }

  /v1/policies/{policyId}/reinstatements:
    post:
      tags: [policies]
      operationId: reinstatePolicy
      x-permission: policies:write
      summary: Reverse the latest cancellation
      description: |
        Requires the permission `policies:write`. Only when the cancellation is
        the policy's latest transaction, e.g. a death registered by mistake.
        The versions it superseded apply again, and the refund is reversed.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReinstatePolicyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The reinstatement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/renewals:
    post:
      tags: [policies]
      operationId: renewPolicy
      x-permission: policies:write
      summary: Renew a policy with its next term
      description: |
        Requires the permission `policies:write` (ADR 0029). The next term
        starts the day the last one ends, with the product's version on sale
        that day (or `productVersion`), the same choices, and the same premium
        unless `premium` is given (no tariff yet, M4). Used for the policies the
        renewal run lists for a decision. A cancellation that applies at the end
        of the term gives `409`.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewPolicyRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The renewal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/snapshot:
    get:
      tags: [policies]
      operationId: getPolicySnapshot
      x-permission: policies:read
      summary: The policy as the claims engine sees it on a date
      description: |
        Requires the permission `policies:read`. The version in force on `date`,
        as known at `knownAt` (omitted: now), with the term's product version,
        vet care terms and policy year. `404` if no version applies.
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: knownAt, in: query, schema: { type: string, format: date-time } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicySnapshot' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-groups:
    post:
      tags: [policies]
      operationId: createPolicyGroup
      x-permission: policies:write
      summary: Create a group for a litter or a household
      description: |
        Requires the permission `policies:write` (ADR 0007). A group has one
        policyholder, who holds every member's policy while it is a member. A
        litter group refers to the litter in the animal register. Later the
        group gets one invoice and a group discount; it never affects claims.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePolicyGroupRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGroup' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [policies]
      operationId: findPolicyGroups
      x-permission: policies:read
      summary: Groups of a policyholder, or that a policy is or was in
      description: Requires the permission `policies:read`. Give exactly one filter.
      parameters:
        - { name: policyholderPartyId, in: query, schema: { type: string } }
        - { name: policyId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PolicyGroup' } }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-groups/{groupId}:
    get:
      tags: [policies]
      operationId: getPolicyGroup
      x-permission: policies:read
      summary: A group with its members over time
      description: Requires the permission `policies:read`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGroup' }

  /v1/policy-groups/{groupId}/members:
    post:
      tags: [policies]
      operationId: addPolicyGroupMember
      x-permission: policies:write
      summary: Add a policy to the group from a day
      description: |
        Requires the permission `policies:write`. From `from` (default today,
        or the policy's start if later). The group's policyholder must hold the
        policy that day, and a policy is in one group at a time (`409`). When
        the animal is sold, the policy leaves the group from the day of sale.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGroupMemberRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGroup' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-groups/{groupId}/members/{policyId}/endings:
    post:
      tags: [policies]
      operationId: endPolicyGroupMember
      x-permission: policies:write
      summary: A policy leaves the group from a day
      description: Requires the permission `policies:write`. From `to` (default today), with a reason.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndGroupMemberRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyGroup' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-proposal-expiry-runs:
    post:
      tags: [policies]
      operationId: expirePolicyProposals
      x-permission: policies:renew
      summary: End policies whose transfer was not accepted in time
      description: |
        Requires the permission `policies:renew`. Every pending transfer whose
        deadline has passed ends the policy from the day of sale, since the
        need for insurance ceased. Meant to run daily.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The proposals that expired
          content:
            application/json:
              schema:
                type: object
                required: [expired]
                properties:
                  expired: { type: array, items: { $ref: '#/components/schemas/PolicyProposal' } }

  /v1/policy-proposals:
    get:
      tags: [policies]
      operationId: listPolicyProposals
      x-permission: policies:read
      summary: Proposals from the animal register's events
      description: |
        Requires the permission `policies:read` (ADR 0029). When an animal is
        sold, its policy gets a transfer proposal; when it dies, a cancellation
        proposal. Oldest first, only in the caller's scope.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, decided] } }
        - { name: policyId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The proposals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PolicyProposal' } }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-proposals/{proposalId}:
    get:
      tags: [policies]
      operationId: getPolicyProposal
      x-permission: policies:read
      summary: A proposal with its decision
      description: Requires the permission `policies:read`.
      parameters:
        - $ref: '#/components/parameters/PolicyProposalId'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyProposal' }

  /v1/policy-proposals/{proposalId}/acceptances:
    post:
      tags: [policies]
      operationId: acceptPolicyProposal
      x-permission: policies:write
      summary: Accept a proposal
      description: |
        Requires the permission `policies:write`. A transfer is accepted when
        the new owner has accepted the terms, by the deadline: give the
        `channel` and any `reference`. The policy then changes policyholder
        from the day of sale, as a new version, and the premium for the days
        from the sale is moved to the new policyholder. A death ends the policy
        from the day of death.
      parameters:
        - $ref: '#/components/parameters/PolicyProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptProposalRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The decided proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyProposal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policy-proposals/{proposalId}/rejections:
    post:
      tags: [policies]
      operationId: rejectPolicyProposal
      x-permission: policies:write
      summary: Reject a proposal
      description: |
        Requires the permission `policies:write`. A rejected transfer (the new
        owner does not want the policy) ends it from the day of sale. A
        rejected death, e.g. registered on the wrong animal, changes nothing.
      parameters:
        - $ref: '#/components/parameters/PolicyProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The decided proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyProposal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/quotes:
    post:
      tags: [policies]
      operationId: quote
      x-permission: policies:quote
      summary: A price indication
      description: |
        Requires the permission `policies:quote` (ADR 0030). What the policy
        would cost from `startDate` with these choices, with the product's
        tariff in force that day and every step of the price. Nothing is
        stored. Give a registered animal (`animalId`) or the facts (`animal`),
        and the policyholder (`policyholderPartyId`, whose postal code gives
        the zone) or a `postalCode`. A caller bound to a clinic or to policies,
        such as a customer portal, gives the facts and the postal code. The
        postal code is never returned, only its zone. A product without a
        tariff gives `409`. With `answers`, the quote also runs the product's
        underwriting rules and says what an application would lead to.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The price indication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/renewal-runs:
    post:
      tags: [policies]
      operationId: runRenewals
      x-permission: policies:renew
      summary: Renew every policy up for renewal
      description: |
        Requires the permission `policies:renew`. Every policy in the caller's
        markets whose term ends within its product's `renewalLeadDays` is
        renewed, unless a cancellation applies at the end of the term. What
        cannot be renewed as it is, e.g. because the product is no longer sold
        or the animal has died, is listed under `needsDecision`. With `dryRun`
        nothing is stored. Meant to run daily.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewalRunRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: What the run did
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalRunResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/claim-previews:
    post:
      tags: [previews]
      operationId: previewClaim
      x-permission: claims:preview
      summary: Pre-approval, e.g. at the clinic's checkout
      description: |
        Requires the permission `claims:preview`.

        Assesses a draft without storing or reserving anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
            examples:
              otit:
                $ref: '#/components/examples/ClaimOtitAuto'
              korsband:
                $ref: '#/components/examples/ClaimKorsbandManual'
              foreStart:
                $ref: '#/components/examples/ClaimBeforePolicy'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/policies/{policyId}/limits:
    get:
      tags: [limits]
      operationId: getLimits
      x-permission: limits:read
      summary: Consumed and remaining annual limit
      description: Requires the permission `limits:read`. A policy covers one animal (ADR 0007), so the policy is enough.
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        - name: onDate
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Amounts for the policy year the date falls in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Limits' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/payer-accounts:
    get:
      tags: [billing]
      operationId: listPayerAccounts
      x-permission: billing:read
      summary: Payer accounts, oldest first
      description: |
        Requires the permission `billing:read` (ADR 0040). A payer account is made
        when the first policy of a policyholder is issued in a market and
        currency; later policies join it. Only accounts in the caller's markets;
        a role bound to policies or a clinic sees none.
      parameters:
        - { name: partyId, in: query, schema: { type: string } }
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayerAccount' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/payer-accounts/{accountId}:
    get:
      tags: [billing]
      operationId: getPayerAccount
      x-permission: billing:read
      summary: A payer account
      description: Requires the permission `billing:read`. An account outside the caller's scope answers 404.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, pattern: '^bac_[A-Za-z0-9]+$' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayerAccount' }

  /v1/invoices:
    get:
      tags: [billing]
      operationId: listInvoices
      x-permission: billing:read
      summary: Invoices, oldest first
      description: |
        Requires the permission `billing:read` (ADR 0040). The invoicing run
        (`billing.invoicing`, daily per market) puts every installment due within
        the plan's lead time on one invoice per payer account. An invoice never
        changes. Only invoices in the caller's markets; a role bound to policies
        sees an invoice only if every line is on its policies, and a clinic none.
      parameters:
        - { name: accountId, in: query, schema: { type: string } }
        - { name: policyId, in: query, schema: { type: string }, description: Invoices with a line on the policy. }
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The invoices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/invoices/{invoiceId}:
    get:
      tags: [billing]
      operationId: getInvoice
      x-permission: billing:read
      summary: An invoice
      description: Requires the permission `billing:read`. An invoice outside the caller's scope answers 404.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, pattern: '^inv_[A-Za-z0-9]+$' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }

  /v1/premium-plans:
    get:
      tags: [billing]
      operationId: listPremiumPlans
      x-permission: billing:read
      summary: Premium plans of a policy or an account, oldest first
      description: |
        Requires the permission `billing:read` (ADR 0040). `policy.issued` and
        `policy.renewed` each give a plan for the term: the premium split into
        installments by the payment interval, with each installment's period,
        due date and amount. A plan never changes; a change is a new plan.
        `policyId` or `accountId` is required. Only plans in the caller's
        markets; a role bound to policies sees only its policies' plans.
      parameters:
        - { name: policyId, in: query, schema: { type: string } }
        - { name: accountId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PremiumPlanRecord' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/notices:
    get:
      tags: [notices]
      operationId: listNotices
      x-permission: notices:read
      summary: Notices to the customer, oldest first
      description: |
        Requires the permission `notices:read` (ADR 0032). Petvold makes a notice
        when the law requires the customer to be told something: a policy issued,
        renewed or cancelled, or an application declined. The insurer's document
        system reads `status=pending`, makes and sends the document, and reports
        each attempt with `POST /v1/notices/{noticeId}/deliveries`.

        - `attention=true`: the queue for a person, failed, overdue and incomplete unsent notices.
        - `overdue=true`: not sent and `dueBy` has passed.
        - `late=true`: first sent after `dueBy`. For `insurer-termination` a person
          checks whether the effective date still holds; Petvold never moves it.

        Only notices in the caller's markets; a role bound to policies sees only
        notices on its policies, and one bound to a clinic none.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, sent, failed] } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/NoticeType' } }
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - { name: policyId, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string } }
        - { name: invoiceId, in: query, schema: { type: string } }
        - { name: recipientPartyId, in: query, schema: { type: string } }
        - { name: attention, in: query, schema: { type: boolean } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: late, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The notices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notice' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/notices/{noticeId}:
    get:
      tags: [notices]
      operationId: getNotice
      x-permission: notices:read
      summary: A notice with its deliveries
      description: Requires the permission `notices:read`. A notice outside the caller's scope answers 404.
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }

  /v1/notices/{noticeId}/deliveries:
    post:
      tags: [notices]
      operationId: reportDelivery
      x-permission: notices:deliver
      summary: Report that a notice was sent, or that sending failed
      description: |
        Requires the permission `notices:deliver`: the insurer's document system
        (ADR 0032). `sent` needs the channel, the time it was sent, the
        document's id in the insurer's archive and its sha256, so it can be shown
        later which document the customer got. `failed` needs a reason without
        personal data, and puts the notice in the queue. A delivery never
        changes; a resend is another report.
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The notice with the delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/settings/notices:
    get:
      tags: [notices]
      operationId: getNoticeSettings
      x-permission: notices:read
      summary: The insurer's notice settings per market
      description: |
        Requires the permission `notices:read` (ADR 0032). Per market: the days
        "promptly" gives, the types the law does not require that are turned
        off, and texts per language, such as how a decision is reviewed. Version
        1 is empty: Petvold's rules apply, and the insurer writes its texts.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeSettings' }

  /v1/settings/notices/versions:
    get:
      tags: [notices]
      operationId: listNoticeSettings
      x-permission: notices:read
      summary: Every version of the notice settings, oldest first
      description: Requires the permission `notices:read`. Each notice names the version it was made with (`settingsVersion`).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NoticeSettings' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
    post:
      tags: [notices]
      operationId: changeNoticeSettings
      x-permission: notices:configure
      summary: Change the notice settings
      description: |
        Requires the permission `notices:configure`. Replaces every market's
        settings with a new version, based on the version in force (`409`
        otherwise). A type the market's law requires cannot be turned off.
        Notices already made keep what they were made with.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeNoticeSettingsRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeSettings' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/webhook-subscriptions:
    get:
      tags: [webhooks]
      operationId: listWebhookSubscriptions
      x-permission: webhooks:read
      summary: Webhook subscriptions, oldest first
      description: Requires the permission `webhooks:read` (ADR 0033). Only subscriptions whose markets lie within the caller's. Never the secrets.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [webhooks]
      operationId: createWebhookSubscription
      x-permission: webhooks:manage
      summary: Subscribe an address to events
      description: |
        Requires the permission `webhooks:manage` (ADR 0033). Petvold sends each
        matching event as a CloudEvent (`application/cloudevents+json`), signed
        as Standard Webhooks: the headers `webhook-id`, `webhook-timestamp` and
        `webhook-signature`, the HMAC-SHA256 of `id.timestamp.body` with the
        secret. The secret is in this answer only; store it.

        The address must use https and must not point at a local or private
        address, unless the installation allows the host. The markets must lie
        within the caller's; only a caller with every market may give `*`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The subscription and its secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionWithSecret' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/webhook-subscriptions/{subscriptionId}:
    get:
      tags: [webhooks]
      operationId: getWebhookSubscription
      x-permission: webhooks:read
      summary: A webhook subscription
      description: Requires the permission `webhooks:read`. Outside the caller's markets it answers 404.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
    put:
      tags: [webhooks]
      operationId: changeWebhookSubscription
      x-permission: webhooks:manage
      summary: Change the address, types, markets or status
      description: |
        Requires the permission `webhooks:manage`. Based on the revision in
        force (`409` otherwise). `status: active` turns a disabled subscription
        on again, e.g. after the receiver answered 410 Gone; its pending
        deliveries are sent.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionChange' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The changed subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/webhook-subscriptions/{subscriptionId}/secret-rotations:
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      x-permission: webhooks:manage
      summary: A new secret
      description: Requires the permission `webhooks:manage`. The previous secret also signs for 24 hours, so `webhook-signature` has two signatures meanwhile and the receiver can switch without losing events.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The subscription and its new secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionWithSecret' }

  /v1/webhook-subscriptions/{subscriptionId}/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      x-permission: webhooks:read
      summary: The subscription's deliveries, oldest first
      description: |
        Requires the permission `webhooks:read`. `pending` waits for its next
        attempt, `delivered` was answered with 2xx, and `dead` gave up after
        three days or on 410 Gone.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, dead] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/webhook-deliveries:
    get:
      tags: [webhooks]
      operationId: listAllWebhookDeliveries
      x-permission: webhooks:read
      summary: Deliveries across subscriptions, oldest first
      description: |
        Requires the permission `webhooks:read`. `status=dead` is the list for a
        person: events that did not arrive in three days, or whose receiver
        answered 410 Gone. Only deliveries of subscriptions within the caller's
        markets.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, dead] } }
        - { name: subscriptionId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/webhook-subscriptions/{subscriptionId}/deliveries/{deliveryId}/retries:
    post:
      tags: [webhooks]
      operationId: retryWebhookDelivery
      x-permission: webhooks:manage
      summary: Send a dead delivery again
      description: |
        Requires the permission `webhooks:manage`. Only a `dead` delivery
        (`409` otherwise), and not one given up more than 30 days ago, whose
        data is removed. It gets three new days of attempts.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
        - { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: The delivery, pending again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/webhook-subscriptions/{subscriptionId}/delivery-retries:
    post:
      tags: [webhooks]
      operationId: retryWebhookDeliveries
      x-permission: webhooks:manage
      summary: Send every dead delivery of a subscription again
      description: Requires the permission `webhooks:manage`. E.g. after the receiver was down for days. Deliveries whose data is removed are left as they are.
      parameters:
        - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: '^whs_[A-Za-z0-9]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: How many were sent again
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties:
                  retried: { type: integer, minimum: 0 }


  /v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      x-permission: jobs:read
      summary: The runs, with schedule, pause and the latest and next run per market
      description: |
        Requires the permission `jobs:read`. Every job the scheduler knows, and
        for each market within the caller's markets the latest run and when the
        next scheduled one is due.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/jobs/{job}:
    get:
      tags: [jobs]
      operationId: getJob
      x-permission: jobs:read
      summary: A job, with what was done to it
      description: Requires the permission `jobs:read`. The job as in the list, and its latest pauses and resumptions.
      parameters:
        - $ref: '#/components/parameters/Job'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/jobs/{job}/runs:
    get:
      tags: [jobs]
      operationId: listJobRuns
      x-permission: jobs:read
      summary: The job's history, newest first
      description: |
        Requires the permission `jobs:read`. Runs within the caller's markets,
        kept for 400 days. A result holds counts and ids, never personal data.
      parameters:
        - $ref: '#/components/parameters/Job'
        - { name: market, in: query, schema: { $ref: '#/components/schemas/Market' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/JobRun' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [jobs]
      operationId: runJob
      x-permission: jobs:operate
      summary: Run the job now in a market
      description: |
        Requires the permission `jobs:operate`. Runs at once, also when the job
        is paused, and answers with the run when it is done. With `dryRun`
        nothing is stored by the job, for the jobs that can (renewal and
        retention). `409` when another server is running it in the market.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunJobRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: The run, succeeded or failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRun' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/jobs/{job}/pauses:
    post:
      tags: [jobs]
      operationId: pauseJob
      x-permission: jobs:operate
      summary: Pause the job in every market
      description: |
        Requires the permission `jobs:operate`. Takes effect at once, without
        four eyes: whoever sees a job go wrong should be able to stop it. The
        scheduler skips it until it is resumed; "Run now" still works. Kept with
        who, when and why. `409` if it is paused already.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobControlRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPause' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/jobs/{job}/resumptions:
    post:
      tags: [jobs]
      operationId: resumeJob
      x-permission: jobs:operate
      summary: Resume a paused job
      description: |
        Requires the permission `jobs:operate`. A day that was missed while it
        was paused runs once at the next round. `409` if it is not paused.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobControlRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobControl' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/jobs/{job}/schedule-changes:
    get:
      tags: [jobs]
      operationId: listScheduleChanges
      x-permission: jobs:read
      summary: Proposed, approved and rejected changes of the job's schedule, newest first
      description: Requires the permission `jobs:read`.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleChange' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [jobs]
      operationId: proposeScheduleChange
      x-permission: jobs:configure
      summary: Propose a new time for the job, or that it is turned off
      description: |
        Requires the permission `jobs:configure`. Nothing changes until another
        person with `jobs:configure` approves it (four eyes, ADR 0037): turning
        off renewal or retention affects customers and the law. A job has at
        most one change waiting (`409`). Only daily jobs have a time.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeScheduleChangeRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Waiting for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/jobs/{job}/schedule-changes/{changeId}/approvals:
    post:
      tags: [jobs]
      operationId: approveScheduleChange
      x-permission: jobs:configure
      summary: Approve a schedule change, by someone other than the proposer
      description: |
        Requires the permission `jobs:configure`, and that the caller did not
        propose it (`403`). The change becomes the job's schedule at once, and
        the scheduler uses it from its next round. `409` if it is not waiting.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/ScheduleChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/jobs/{job}/schedule-changes/{changeId}/rejections:
    post:
      tags: [jobs]
      operationId: rejectScheduleChange
      x-permission: jobs:configure
      summary: Reject a schedule change with a reason
      description: Requires the permission `jobs:configure`. The proposer may withdraw their own change this way. `409` if it is not waiting.
      parameters:
        - $ref: '#/components/parameters/Job'
        - $ref: '#/components/parameters/ScheduleChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobControlRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/relay-dead-letters:
    get:
      tags: [jobs]
      operationId: listRelayDeadLetters
      x-permission: jobs:read
      summary: Events the relay set aside, oldest first
      description: |
        Requires the permission `jobs:read`. An event that could not be
        delivered within Petvold after ten attempts (ADR 0008). It stays
        unpublished in its module's outbox until it is sent again. Ids and the
        error only, never the event.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The dead letters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RelayDeadLetter' }
                  nextCursor: { type: string, description: 'Give it as cursor for the next page. Omitted on the last page.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/relay-dead-letters/{deadLetter}/retries:
    post:
      tags: [jobs]
      operationId: retryRelayDeadLetter
      x-permission: jobs:operate
      summary: Send a dead letter again
      description: |
        Requires the permission `jobs:operate`. The relay forgets it and tries
        the event from the start at its next round. Fix the cause first, or it
        becomes a dead letter again after ten attempts.
      parameters:
        - { name: deadLetter, in: path, required: true, description: 'source:eventId, e.g. claims:42', schema: { type: string, pattern: '^[a-z]+:[A-Za-z0-9_-]+$' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204': { description: Sent again at the relay's next round }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ScheduleChangeId:
      name: changeId
      in: path
      required: true
      schema: { type: string, pattern: '^jsc_[A-Za-z0-9]+$' }
    Job:
      name: job
      in: path
      required: true
      description: The job's name, e.g. policies.renewal.
      schema: { type: string, pattern: '^[a-z]+\.[a-z-]+$' }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, pattern: '^clm_[A-Za-z0-9_]+$' }
    ReferenceKind:
      name: kind
      in: path
      required: true
      description: The kind of reference data.
      schema: { type: string, enum: [species, breed, sex] }
    ReferenceCode:
      name: code
      in: path
      required: true
      description: The code, e.g. `dog` or `dog-labrador-retriever`. Never changes.
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
    Product:
      name: product
      in: path
      required: true
      description: The product, e.g. SE-HUND-VV-LIV.
      schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$' }
    ProductVersionLabel:
      name: version
      in: path
      required: true
      description: The version label, e.g. 2026.2.
      schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,31}$' }
    ErasureRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: '^era_[A-Za-z0-9]+$' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, pattern: '^pgr_[A-Za-z0-9]+$' }
    Limit:
      name: limit
      in: query
      description: Items per page, 1-200. Default 50.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The nextCursor from the previous page (ADR 0002). Opaque.
      schema: { type: string, maxLength: 200 }
    PolicyProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, pattern: '^ppr_[A-Za-z0-9]+$' }
    PolicyIdPath:
      name: policyId
      in: path
      required: true
      schema: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
    AnimalId:
      name: animalId
      in: path
      required: true
      schema: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
    Series:
      name: series
      in: path
      required: true
      description: The rule series, e.g. SE-HUND-VV.
      schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$' }
    RuleSetVersionNo:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, pattern: '^prp_[A-Za-z0-9]+$' }
    Seq:
      name: seq
      in: path
      required: true
      description: The decision's sequence number on the claim, 1 for the first.
      schema: { type: integer, minimum: 1 }
    InformationRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: '^inf_[A-Za-z0-9]+$' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: '^doc_[A-Za-z0-9_]+$' }
    DocumentLinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string, pattern: '^lnk_[A-Za-z0-9_-]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    Unavailable:
      description: A service it needs is not configured or does not answer, e.g. the PDF renderer
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: It is no longer there, e.g. an erased document
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: No valid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller lacks the operation's permission (`x-permission`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict with the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  examples:
    AttachmentInvoice:
      summary: The clinic's specified invoice in the insurer's archive
      value:
        kind: invoice
        mediaType: application/pdf
        size: 184320
        sha256: 9f2c4e1a7b3d5f6e8a0c2b4d6f8e1a3c5b7d9f0e2a4c6b8d0f1e3a5c7b9d1f3e
        url: https://archive.example.test/docs/7c1f9e2a
    CorrectDiagnosis:
      summary: The diagnosis code was registered wrong
      value: { diagnosisCode: ORA-OTIT, reason: 'The record says otitis, not a cruciate ligament.', expectedRevision: 1 }
    InformationRequestClinic:
      summary: The clinic sends the specified invoice and the record
      value: { recipient: clinic, items: [itemised-invoice, medical-record], note: 'Specified invoice and the record from the first visit.' }
    ClaimOtitAuto:
      summary: Ear infection – settled automatically
      description: |
        SEK 4,000 billed. Every rule green and below the auto-settle limit.
        Expected outcome: approved immediately, SEK 1,500 payout (SEK 2,000 fixed
        deductible, 25 % variable). Change `id` and `claimNo` to send it again.
      value:
        id: clm_ex_otit
        claimNo: EX-0001
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: clinic_direct
        treatmentFrom: '2026-11-11'
        treatmentTo: '2026-11-11'
        diagnosisCode: ORA-OTIT
        lines:
          - { id: l1, description: Examination, category: examination, amount: 65000 }
          - { id: l2, description: Ear flush and medication, category: medication, amount: 335000 }
    ClaimKorsbandManual:
      summary: Cruciate ligament injury – goes to a handler
      description: |
        SEK 18,640 billed for TPLO surgery. Bella has a rider in the same
        diagnosis group and the amount is above the auto-settle limit.
        Expected outcome: no decision; the assessment proposes a partial payout
        (food is not reimbursed) and waits for a handler.
      value:
        id: clm_ex_korsband
        claimNo: EX-0002
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: clinic_direct
        treatmentFrom: '2026-11-11'
        treatmentTo: '2026-11-13'
        diagnosisCode: ORT-KORSBAND-V
        lines:
          - { id: l1, description: Examination orthopaedics, category: examination, amount: 85000 }
          - { id: l2, description: X-ray hind legs, category: diagnostics, amount: 290000 }
          - { id: l3, description: Sedation and anaesthesia, category: anaesthesia, amount: 124000 }
          - { id: l4, description: TPLO surgery left, category: surgery, amount: 1240000 }
          - { id: l5, description: Pain relief 10 days, category: medication, amount: 83000 }
          - { id: l6, description: Prescription food, category: food, amount: 42000 }
    ClaimBeforePolicy:
      summary: Treatment before the policy year starts – rejected
      description: |
        The treatment date is before the policy version that exists.
        Expected outcome: rejection is proposed because no policy applied on that date.
      value:
        id: clm_ex_fore_start
        claimNo: EX-0003
        policyId: pol_bella
        animalId: ani_bella
        market: SE
        currency: SEK
        channel: customer
        treatmentFrom: '2026-03-20'
        treatmentTo: '2026-03-20'
        diagnosisCode: GI-ENTERIT
        lines:
          - { id: l1, description: Examination, category: examination, amount: 80000 }
    DecideAccept:
      summary: Accept as proposed
      description: Add `expectedInputHash` from the assessment to guard against a stale basis.
      value:
        action: accept
        reason: The rider covers the right hind leg; the injury is on the left.
    DecideReject:
      summary: Reject against the proposal (needs claims:override)
      value:
        action: reject
        reasonCode: pre_existing_condition
        reason: The injury is covered by the rider.
    ReviewRequestWithStatement:
      summary: The customer contests an automatic decision
      value:
        statement: The ear infection started after the waiting period, see the attached journal.
    Reassess:
      summary: Reassess after a change
      value:
        reason: The policy has been changed retroactively.

  schemas:
    Job:
      type: object
      required: [id, schedule, markets]
      properties:
        id: { type: string, description: 'The job''s name, e.g. policies.renewal.' }
        schedule: { $ref: '#/components/schemas/JobSchedule' }
        paused: { $ref: '#/components/schemas/JobPause' }
        pendingChange: { $ref: '#/components/schemas/ScheduleChange' }
        markets:
          type: array
          items:
            type: object
            required: [market]
            properties:
              market: { $ref: '#/components/schemas/Market' }
              nextRunAt: { $ref: '#/components/schemas/DateTime', description: When the next scheduled run is due. Omitted while paused. }
              lastRun: { $ref: '#/components/schemas/JobRun' }

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          required: [controls]
          properties:
            controls:
              type: array
              description: The latest pauses and resumptions, newest first.
              items: { $ref: '#/components/schemas/JobControl' }

    JobSchedule:
      type: object
      required: [kind]
      description: 'daily: at a time of day in each market''s time zone. interval: every so many seconds.'
      properties:
        kind: { type: string, enum: [daily, interval] }
        at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        seconds: { type: integer, minimum: 1 }
        enabled: { type: boolean, description: false when turned off with four eyes. "Run now" still works. }
        version: { type: integer, minimum: 0, description: The installation's approved setting it comes from; 0 for the default. }

    JobRun:
      type: object
      required: [id, job, market, trigger, startedBy, startedAt, dryRun, status]
      properties:
        id: { type: string }
        job: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        trigger: { type: string, enum: [schedule, manual, api], description: 'schedule: by the scheduler. manual: "Run now". api: an old run operation.' }
        startedBy: { type: string }
        startedAt: { $ref: '#/components/schemas/DateTime' }
        scheduledFor: { $ref: '#/components/schemas/Date', description: The market's day a scheduled run was for. }
        dryRun: { type: boolean }
        status: { type: string, enum: [running, succeeded, failed, skipped] }
        finishedAt: { $ref: '#/components/schemas/DateTime' }
        result: { type: object, additionalProperties: true, description: Counts and ids, never personal data. }
        error: { type: string }

    JobPause:
      type: object
      required: [job, pausedBy, pausedAt, reason]
      properties:
        job: { type: string }
        pausedBy: { type: string }
        pausedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    JobControl:
      type: object
      required: [id, job, action, by, at, reason]
      properties:
        id: { type: string }
        job: { type: string }
        action: { type: string, enum: [pause, resume] }
        by: { type: string }
        at: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ScheduleChange:
      type: object
      required: [id, job, at, enabled, reason, proposedBy, proposedAt, status]
      properties:
        id: { type: string }
        job: { type: string }
        at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        enabled: { type: boolean }
        reason: { type: string }
        proposedBy: { type: string }
        proposedAt: { $ref: '#/components/schemas/DateTime' }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedBy: { type: string }
        decidedAt: { $ref: '#/components/schemas/DateTime' }
        decisionReason: { type: string, description: Why it was rejected. }

    ProposeScheduleChangeRequest:
      type: object
      additionalProperties: false
      required: [at, enabled, reason]
      properties:
        at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: The time of day in each market's time zone. }
        enabled: { type: boolean, description: false turns the job off. }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    RunJobRequest:
      type: object
      additionalProperties: false
      required: [market]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        dryRun: { type: boolean, default: false }

    JobControlRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    RelayDeadLetter:
      type: object
      required: [id, source, eventId, attempts, lastError, deadAt]
      properties:
        id: { type: string, description: 'source:eventId, for sending it again.' }
        source: { type: string, description: The module's outbox, e.g. claims or policies. }
        eventId: { type: string }
        attempts: { type: integer, minimum: 1 }
        lastError: { type: string }
        deadAt: { $ref: '#/components/schemas/DateTime' }

    Money:
      type: integer
      description: Amount in the smallest currency unit (cents, pence …).
    NonNegativeMoney:
      type: integer
      minimum: 0
      description: Amount in the smallest currency unit, never negative.
    Market:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2, e.g. SE, NO, DK, FI, DE.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217, e.g. SEK, NOK, DKK, EUR.
    Date:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      format: date
    DateTime:
      type: string
      format: date-time

    ClaimLine:
      type: object
      additionalProperties: false
      required: [id, description, category, amount]
      properties:
        id: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        category:
          type: string
          description: Category per the product's claims rules, e.g. examination, surgery, food.
        diagnosisCode: { type: string }
        amount:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Amount including VAT.
        vat:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: The VAT part of amount, if the invoice states it.

    ClaimFields:
      type: object
      required: [policyId, animalId, market, currency, channel, treatmentFrom, treatmentTo, diagnosisCode, lines]
      properties:
        id:
          type: string
          pattern: '^clm_[A-Za-z0-9_]+$'
          description: 'Unique, e.g. clm_021877. Given by the server when the client leaves it out (ADR 0036).'
        claimNo:
          type: string
          minLength: 1
          description: |
            Unique. Given by the server when the client leaves it out: the
            market's prefix, the year the claim was received and a number from
            the year's series, e.g. S-2026-000123 (ADR 0036). A client that
            keeps its own numbers may send them.
        policyId: { type: string, minLength: 1 }
        animalId: { type: string, minLength: 1 }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        channel: { type: string, enum: [clinic_direct, customer] }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        treatmentTo: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ClaimLine' }

    ClaimInput:
      description: What the client sends. receivedAt is set by the server.
      allOf:
        - $ref: '#/components/schemas/ClaimFields'
      unevaluatedProperties: false

    Claim:
      allOf:
        - $ref: '#/components/schemas/ClaimFields'
        - type: object
          required: [id, claimNo, receivedAt, revision]
          properties:
            revision:
              type: integer
              minimum: 1
              description: 1 as registered, one more for each correction (ADR 0036). Give it as expectedRevision when correcting.
            reopened:
              type: boolean
              description: A correction after the latest decision reopened the claim; it waits for a new decision by a person. Omitted when false.
            id: { type: string, description: Always set on a stored claim. }
            claimNo: { type: string, description: Always set on a stored claim. }
            receivedAt: { $ref: '#/components/schemas/DateTime' }
            closure: { $ref: '#/components/schemas/ClaimClosure', description: Set when the claim was withdrawn or dismissed. }
            basisCompleteAt:
              $ref: '#/components/schemas/DateTime'
              description: |
                When the basis was complete, for FAL 7 kap. 1 § (ADR 0036): when the
                claim was received, or later, when a request for information was
                answered or expired. Omitted while a request is open.
            informationMissing:
              type: boolean
              description: The latest request for information expired without an answer. Omitted when false.
            daysSinceBasisComplete:
              type: integer
              minimum: 0
              description: Whole days from basisCompleteAt to now. The insurer pays within a month of it (FAL 7 kap. 1 §).
            clinicId:
              type: string
              description: The clinic that submitted the claim, taken from the caller's token. Never set by the client.
      unevaluatedProperties: false

    RuleResult:
      type: object
      required: [code, status, reason, params]
      properties:
        code:
          type: string
          enum: [POLICY_FOUND, POLICY_ACTIVE, ANIMAL_MATCHES, MARKET_CURRENCY, WAITING_PERIOD, COVERAGE, RIDER, DIAGNOSIS_KNOWN, LIMIT]
        status: { type: string, enum: [pass, fail, review, info] }
        reason:
          type: string
          description: Stable key, e.g. rider.possible. Use it for logic and your own translations.
        params:
          type: object
          additionalProperties:
            type: [string, number]
        message:
          type: string
          description: Text in the language from Accept-Language.

    Calculation:
      type: object
      required:
        - currency
        - billed
        - nonReimbursable
        - vatExcluded
        - base
        - opensDeductiblePeriod
        - deductibleFixed
        - deductibleVariableBp
        - deductibleVariable
        - payableBeforeLimit
        - annualLimit
        - consumedBefore
        - remainingBefore
        - payout
        - customerShare
        - cappedByLimit
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        billed: { $ref: '#/components/schemas/Money' }
        nonReimbursable: { $ref: '#/components/schemas/Money' }
        vatExcluded:
          $ref: '#/components/schemas/Money'
          description: VAT that is not reimbursed in the market.
        base: { $ref: '#/components/schemas/Money' }
        opensDeductiblePeriod: { type: boolean }
        deductibleFixed: { $ref: '#/components/schemas/Money' }
        deductibleVariableBp:
          type: integer
          description: Variable deductible in basis points (2500 = 25 %), after age adjustment.
        deductibleVariable: { $ref: '#/components/schemas/Money' }
        payableBeforeLimit: { $ref: '#/components/schemas/Money' }
        annualLimit: { $ref: '#/components/schemas/Money' }
        consumedBefore: { $ref: '#/components/schemas/Money' }
        remainingBefore: { $ref: '#/components/schemas/Money' }
        payout: { $ref: '#/components/schemas/Money' }
        customerShare: { $ref: '#/components/schemas/Money' }
        cappedByLimit: { type: boolean }

    AssessmentWithRouting:
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - type: object
          required: [routing]
          properties:
            routing: { $ref: '#/components/schemas/ClaimRouting' }

    ClaimRouting:
      type: object
      required: [mode, reasons]
      description: Why the claim needs a claims handler. Empty reasons when it may be settled automatically.
      properties:
        mode: { type: string, enum: [auto, manual] }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/Reason' }
          description: |
            - routing.rule_review: a rule asks for a person, params.code and params.rule
            - routing.rule_fail: a rule is not met, params.code and params.rule
            - routing.proposal_rejected: the proposal is to reject, which a person decides
            - routing.above_auto_limit: params.payout above params.limit, in params.currency

    Assessment:
      type: object
      required: [claimId, market, currency, policyVersionId, productVersion, rulesVersion, rules, calculation, proposedOutcome, mode, diagnosisGroup, inputHash]
      properties:
        claimId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        policyVersionId: { type: [string, 'null'] }
        productVersion: { type: [string, 'null'] }
        rulesVersion: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RuleResult' }
        calculation:
          oneOf:
            - $ref: '#/components/schemas/Calculation'
            - type: 'null'
        proposedOutcome: { $ref: '#/components/schemas/Outcome' }
        mode:
          type: string
          enum: [auto, manual]
          description: auto = may be settled without a claims handler.
        diagnosisGroup: { type: [string, 'null'] }
        inputHash:
          type: string
          description: Hash of the whole basis. Send it as expectedInputHash when deciding.

    Outcome:
      type: string
      enum: [approved, partial, rejected]

    Decision:
      type: object
      required: [id, claimId, seq, outcome, payout, assessment, decidedBy, decidedAt, deviatesFromProposal, automated]
      properties:
        id: { type: string }
        claimId: { type: string }
        seq: { type: integer, minimum: 1 }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        assessment: { $ref: '#/components/schemas/Assessment' }
        decidedBy: { type: string }
        decidedAt: { $ref: '#/components/schemas/DateTime' }
        claimRevision: { type: integer, minimum: 2, description: The claim's revision the decision was made on (ADR 0036). Omitted, revision 1. }
        reason: { type: string }
        deviatesFromProposal:
          type: boolean
          description: True if the handler decided against the assessment's proposal. Then `reasonCode` and `reason` are always set.
        reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
        automated:
          type: boolean
          description: |
            True if no person judged the outcome (automatic settlement or
            reassessment). The customer may request a human review of an
            automated decision.
        reviewRequestId:
          type: string
          description: Set when this decision is the human review of a request.
        approvedBy:
          type: string
          description: Set when the decision needed approval (ADR 0019). Never the same as `decidedBy`.
        proposalId:
          type: string
          description: The proposal the approval turned into this decision.

    DecisionProposal:
      type: object
      required: [id, claimId, action, outcome, payout, currency, inputHash, proposedBy, proposedAt, deviatesFromProposal, proposerLimit, status]
      properties:
        id: { type: string }
        claimId: { type: string }
        action: { type: string, enum: [accept, reject] }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        inputHash: { type: string, description: The basis the proposal was made on. An approval requires the same basis. }
        proposedBy: { type: string }
        proposedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }
        reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
        deviatesFromProposal: { type: boolean }
        proposerLimit:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: The proposer's limit in the claim's currency, which the payout exceeded.
        status: { type: string, enum: [open, approved, returned] }
        closedBy: { type: string }
        closedAt: { $ref: '#/components/schemas/DateTime' }
        decisionId: { type: string, description: The decision the approval became. }
        returnReason: { type: string }

    ApproveRequest:
      type: object
      additionalProperties: false
      description: Empty for now. An object, so fields can be added later.

    WithdrawClaimRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    DismissClaimRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, reason]
      properties:
        reasonCode: { $ref: '#/components/schemas/DismissalReason' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        duplicateOf:
          type: string
          pattern: '^clm_[A-Za-z0-9_]+$'
          description: The claim this one duplicates. Required for, and only for, reasonCode duplicate.

    DismissalReason:
      type: string
      enum: [duplicate, registered-in-error, not-a-claim]

    ClaimClosure:
      type: object
      additionalProperties: false
      description: A claim closed without a decision (ADR 0036).
      required: [id, claimId, kind, reason, closedBy, closedAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        kind: { type: string, enum: [withdrawn, dismissed] }
        reasonCode: { $ref: '#/components/schemas/DismissalReason' }
        reason: { type: string }
        duplicateOf: { type: string }
        closedBy: { type: string }
        closedAt: { $ref: '#/components/schemas/DateTime' }

    Empty:
      type: object
      additionalProperties: false
      description: No fields.

    DocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: 'The file, at most 25 MB: application/pdf, image/jpeg, image/png or image/heic. Its own content type in the part.' }

    Document:
      type: object
      additionalProperties: false
      required: [id, kind, mediaType, size, sha256, owner, partyIds, market, createdBy, createdAt]
      description: A file in Petvold's archive (ADR 0038). The record; the file is opened with a link.
      properties:
        id: { type: string }
        kind: { type: string, enum: [uploaded, generated] }
        mediaType: { type: string }
        size: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        filename: { type: string }
        owner:
          type: object
          additionalProperties: false
          description: What it belongs to. Access to the document follows it.
          properties:
            claimId: { type: string }
            policyId: { type: string }
            noticeId: { type: string }
        partyIds: { type: array, items: { type: string }, description: The parties it concerns, set when it was made. }
        market: { $ref: '#/components/schemas/Market' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        erasedAt: { $ref: '#/components/schemas/DateTime', description: The file was removed by retention; the record stays. }
        template:
          type: object
          additionalProperties: false
          required: [name, market, language, version, checksum, dataHash]
          description: A generated document's template, its version and checksum, and the hash of the data (canonical JSON) it was filled with.
          properties:
            name: { type: string }
            market: { $ref: '#/components/schemas/Market' }
            language: { type: string }
            version: { type: integer, minimum: 1 }
            checksum: { type: string }
            dataHash: { type: string }

    CustomerDocument:
      type: object
      additionalProperties: false
      required: [source, type, at]
      description: A document about a customer, in Petvold's archive or the insurer's.
      properties:
        source: { type: string, enum: [petvold, insurer], description: 'Where the file is: petvold opens with a link; insurer opens in the insurer''s archive.' }
        type: { type: string, enum: [attachment, notice] }
        at: { $ref: '#/components/schemas/DateTime', description: 'Added, made or sent.' }
        documentId: { type: string, description: 'source petvold: the document.' }
        kind: { type: string, enum: [invoice, medical-record, referral, photo, other], description: An attachment's kind. }
        filename: { type: string }
        mediaType: { type: string }
        size: { type: integer }
        sha256: { type: string }
        url: { type: string, description: 'source insurer, type attachment: the address in the insurer''s archive.' }
        archiveId: { type: string, description: 'source insurer, type notice: the document''s id in the insurer''s archive.' }
        channel: { type: string, description: 'type notice: how it was sent.' }
        noticeType: { $ref: '#/components/schemas/NoticeType' }
        noticeId: { type: string }
        attachmentId: { type: string }
        claimId: { type: string }
        policyId: { type: string }
        erased: { type: boolean, description: The file was removed by retention; it cannot be opened. }

    DocumentLinkRequest:
      type: object
      additionalProperties: false
      required: [audience]
      properties:
        audience: { type: string, enum: [internal, customer], description: 'internal: a person here, 15 minutes. customer: given to the customer, needs documents:share.' }
        seconds: { type: integer, minimum: 60, maximum: 604800, description: 'How long it works. Omitted: 15 minutes. A link for a person here works 15 minutes at most.' }

    DocumentLink:
      type: object
      additionalProperties: false
      required: [id, documentId, audience, createdBy, createdAt, expiresAt, accesses]
      properties:
        id: { type: string }
        documentId: { type: string }
        audience: { type: string, enum: [internal, customer] }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
        revokedBy: { type: string }
        revokedAt: { $ref: '#/components/schemas/DateTime' }
        accesses: { type: array, items: { $ref: '#/components/schemas/DateTime' }, description: When it was opened, oldest first. }

    DocumentLinkCreated:
      type: object
      additionalProperties: false
      required: [link, url]
      properties:
        link: { $ref: '#/components/schemas/DocumentLink' }
        url: { type: string, description: 'The address to open, {base}/d/{token}. Not stored by Petvold: create a new link when it is needed again.' }

    AttachmentInput:
      type: object
      additionalProperties: false
      required: [kind, mediaType, size, sha256, url]
      properties:
        kind: { type: string, enum: [invoice, medical-record, referral, photo, other] }
        mediaType: { type: string, pattern: '^[A-Za-z]+/[A-Za-z0-9.+-]+$', description: 'e.g. application/pdf' }
        size: { type: integer, minimum: 1, description: In bytes. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        url: { type: string, maxLength: 2000, description: "Where the file is in the insurer's archive: an https address or a URN. Petvold never stores the file." }
        informationRequestId: { type: string, pattern: '^inf_[A-Za-z0-9]+$', description: The request for information it answers. }
        replaces: { type: string, description: The attachment it replaces, which then no longer counts. An attachment is replaced once. }

    ClaimAttachment:
      type: object
      additionalProperties: false
      required: [id, claimId, kind, mediaType, size, sha256, url, addedBy, addedAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        kind: { type: string, enum: [invoice, medical-record, referral, photo, other] }
        mediaType: { type: string }
        size: { type: integer }
        sha256: { type: string }
        url: { type: string }
        informationRequestId: { type: string }
        replaces: { type: string }
        addedBy: { type: string }
        addedAt: { $ref: '#/components/schemas/DateTime' }

    CorrectClaimRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedRevision]
      description: The new details. Fields left out keep their value. Policy, animal, market and currency cannot be corrected.
      properties:
        channel: { type: string, enum: [clinic_direct, customer] }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        treatmentTo: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ClaimLine' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expectedRevision: { type: integer, minimum: 1, description: The revision corrected. Another revision in between gives 409. }

    ClaimCorrection:
      type: object
      additionalProperties: false
      required: [id, claimId, revision, fields, reason, correctedBy, correctedAt, reopens]
      properties:
        id: { type: string }
        claimId: { type: string }
        revision: { type: integer, minimum: 2, description: The revision the correction made. }
        fields:
          type: array
          items: { type: string, enum: [channel, treatmentFrom, treatmentTo, diagnosisCode, lines] }
        reason: { type: string }
        correctedBy: { type: string }
        correctedAt: { $ref: '#/components/schemas/DateTime' }
        reopens: { type: boolean, description: The claim waits for a new decision by a person. }

    ClaimRevision:
      type: object
      additionalProperties: false
      required: [revision, data]
      properties:
        revision: { type: integer, minimum: 1 }
        data:
          type: object
          required: [channel, treatmentFrom, treatmentTo, diagnosisCode, lines]
          properties:
            channel: { type: string, enum: [clinic_direct, customer] }
            treatmentFrom: { $ref: '#/components/schemas/Date' }
            treatmentTo: { $ref: '#/components/schemas/Date' }
            diagnosisCode: { type: string }
            lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
        correction: { $ref: '#/components/schemas/ClaimCorrection', description: Omitted for revision 1. }

    CorrectionResult:
      type: object
      additionalProperties: false
      required: [correction, claim]
      properties:
        correction: { $ref: '#/components/schemas/ClaimCorrection' }
        claim: { $ref: '#/components/schemas/Claim' }
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
          description: A new automated decision, when the latest decision was automated and the outcome changed.

    InformationItem:
      type: string
      enum: [itemised-invoice, medical-record, referral, other]

    InformationRequestInput:
      type: object
      additionalProperties: false
      required: [recipient, items, note]
      properties:
        recipient: { type: string, enum: [customer, clinic] }
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/InformationItem' }
        note: { type: string, minLength: 1, maxLength: 4000, description: 'What is missing, in the handler''s words. Stays inside Petvold.' }
        dueDate:
          $ref: '#/components/schemas/Date'
          description: The last day to answer, after today and at most 365 days ahead. Omitted, from the product's claims rules.

    InformationAnswerInput:
      type: object
      additionalProperties: false
      properties:
        receivedAt:
          $ref: '#/components/schemas/DateTime'
          description: When the information came in. Omitted, now. Not in the future or before the request.
        note: { type: string, minLength: 1, maxLength: 4000 }

    CancelInformationRequestInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 4000 }

    InformationRequest:
      type: object
      additionalProperties: false
      description: A request for more information before the claim can be decided (ADR 0036).
      required: [id, claimId, recipient, items, note, dueDate, rulesVersion, requestedBy, requestedAt, status]
      properties:
        id: { type: string }
        claimId: { type: string }
        recipient: { type: string, enum: [customer, clinic] }
        items: { type: array, items: { $ref: '#/components/schemas/InformationItem' } }
        note: { type: string }
        dueDate: { $ref: '#/components/schemas/Date', description: The last day to answer, in the claim's market. It expires the day after. }
        remindOn: { $ref: '#/components/schemas/Date', description: The day a reminder is due while it is open. Omitted, no reminder. }
        rulesVersion: { type: string, description: "The claims rules the days came from, or 'default'." }
        requestedBy: { type: string }
        requestedAt: { $ref: '#/components/schemas/DateTime' }
        status:
          type: string
          enum: [open, answered, expired, cancelled]
          description: An expired request never rejects the claim; a claims handler decides on what there is.
        remindedAt: { $ref: '#/components/schemas/DateTime' }
        receivedAt: { $ref: '#/components/schemas/DateTime', description: When the information came in. Set when answered. }
        closedBy: { type: string }
        closedAt: { $ref: '#/components/schemas/DateTime' }
        closingNote: { type: string }

    ClaimStatus:
      type: string
      enum: [awaiting-decision, awaiting-approval, awaiting-information, review-requested, decided, withdrawn, dismissed]
      description: |
        Where the claim is in its handling. withdrawn and dismissed are closed
        without a decision, and awaiting-information has an open request for
        information (ADR 0036). New states may be added: a client shows
        an unknown state as it is, rather than failing.

    ReturnProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    AmountLimits:
      type: object
      description: Highest payout per currency in the smallest unit. A currency that is missing has the limit 0.
      propertyNames: { pattern: '^[A-Z]{3}$' }
      additionalProperties: { type: integer, minimum: 0 }

    RoleDefinition:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string, pattern: '^[a-z-]+:[a-z-]+$' }
        bindsTo: { type: string, enum: [clinic, policies] }
        decisionLimits: { $ref: '#/components/schemas/AmountLimits' }
        approvalLimits: { $ref: '#/components/schemas/AmountLimits' }

    Me:
      type: object
      additionalProperties: false
      required: [subject, roles, permissions, scope]
      properties:
        subject: { type: string }
        roles:
          description: The caller's roles that the installation knows.
          type: array
          items: { type: string }
        unknownRoles:
          type: array
          items: { type: string }
        permissions:
          description: Sorted. Includes permissions checked inside an operation, such as `claims:override` and `policies:price-override`.
          type: array
          items: { type: string }
        scope:
          type: object
          additionalProperties: false
          required: [markets]
          properties:
            markets:
              description: The markets the caller works in, or `*` for every market.
              oneOf:
                - { type: string, const: '*' }
                - { type: array, items: { $ref: '#/components/schemas/Market' } }
            clinicId: { type: string, description: Set when a role binds the caller to its clinic. }
            policyIds: { type: array, items: { type: string }, description: Set when a role binds the caller to its policies. }
        decisionLimits:
          description: |
            Only with `claims:decide`. The highest payout per currency the caller
            may decide alone (ADR 0019). `null`: no limit. A missing currency has the limit 0.
          oneOf:
            - { type: 'null' }
            - { type: object, additionalProperties: { type: integer, minimum: 0 } }
        approvalLimits:
          description: Only with `claims:approve`. As `decisionLimits`, for approving proposals.
          oneOf:
            - { type: 'null' }
            - { type: object, additionalProperties: { type: integer, minimum: 0 } }

    RoleConfig:
      type: object
      required: [version, roles, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        roles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RoleDefinition' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ChangeRolesRequest:
      type: object
      additionalProperties: false
      required: [basedOnVersion, roles, reason]
      properties:
        basedOnVersion: { type: integer, minimum: 1, description: The version the change was made from. }
        roles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RoleDefinition' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    RuleSetContent:
      description: Claims rules, a tariff (calculation model tariff.v1), price terms (price-terms.v1, ADR 0030) or underwriting rules (underwriting.v1, ADR 0031).
      oneOf:
        - $ref: '#/components/schemas/ClaimsRulesContent'
        - $ref: '#/components/schemas/TariffContent'
        - $ref: '#/components/schemas/PriceTermsContent'
        - $ref: '#/components/schemas/UnderwritingContent'

    UnderwritingContent:
      type: object
      additionalProperties: false
      description: |
        Underwriting rules (ADR 0031): whether an application for a new policy
        is accepted, accepted with riders, referred to a person or declined.
        The strictest outcome wins. Every refer and decline has a reason code
        the channel explains, since a refusal needs reasons (FAL 7 kap. 6 §).
      required: [market, ageLimits, questions, answerRules, breedRules]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        ageLimits:
          type: array
          minItems: 1
          description: Per species, the age on the start date. A species not listed is declined (species-not-covered).
          items:
            type: object
            additionalProperties: false
            required: [species, minAgeDays]
            properties:
              species: { type: string }
              minAgeDays: { type: integer, minimum: 0 }
              maxAgeYears: { type: integer, minimum: 0, description: 'The highest age in whole years, e.g. 9: until the day before the 10th birthday.' }
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, type, labels]
            properties:
              id: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
              type: { type: string, enum: [boolean, diagnoses], description: 'diagnoses: answered yes with the diagnosis codes.' }
              labels: { type: object, minProperties: 1, additionalProperties: { type: string, minLength: 1 }, description: 'The question per language, e.g. { "sv": "…", "en": "…" }.' }
              species: { type: array, minItems: 1, items: { type: string }, description: 'Asked only for these species. Omitted: every species.' }
        answerRules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question, outcome, reason]
            properties:
              question: { type: string }
              outcome: { type: string, enum: [rider, refer, decline] }
              reason: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
              onlyFor: { type: array, minItems: 1, items: { type: string }, description: 'For a diagnoses question: only if a declared code is listed.' }
              diagnosisCodes: { type: array, minItems: 1, items: { type: string }, description: 'For a rider: codes excluded besides the declared ones.' }
              riderDescription: { type: string, minLength: 1 }
        breedRules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [breed, outcome, reason]
            properties:
              breed: { type: string }
              outcome: { type: string, enum: [refer, decline] }
              reason: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }

    TariffContent:
      type: object
      additionalProperties: false
      description: |
        A tariff (ADR 0030). Amounts in minor units for a year; factors in basis
        points (10 000 = 1.0). The price is the base premium times the factors
        for age, breed group, deductible and zone, at least the minimum, rounded
        half up to a multiple of roundTo.
      required: [market, currency, basePremiums, ageBands, breedGroups, defaultBreedGroup, breedGroupFactors, deductibleFactors, zones, defaultZone, zoneFactors, minimumAnnual, roundTo]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        basePremiums:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [species, annualLimit, amount]
            properties:
              species: { type: string }
              annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
              amount: { $ref: '#/components/schemas/NonNegativeMoney' }
        ageBands:
          type: array
          description: The highest fromYears not above the animal's age on the term's first day applies.
          items:
            type: object
            additionalProperties: false
            required: [species, fromYears, bp]
            properties:
              species: { type: string }
              fromYears: { type: integer, minimum: 0 }
              bp: { type: integer, minimum: 1 }
        breedGroups: { type: object, description: Breed code -> risk group., additionalProperties: { type: string } }
        defaultBreedGroup: { type: string }
        breedGroupFactors: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        deductibleFactors: { type: object, description: Deductible option -> factor., additionalProperties: { type: integer, minimum: 1 } }
        zones: { type: object, description: Postal code prefix -> zone. The longest match applies., additionalProperties: { type: string } }
        defaultZone: { type: string }
        zoneFactors: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        minimumAnnual: { $ref: '#/components/schemas/NonNegativeMoney' }
        roundTo: { type: integer, minimum: 1, description: 'e.g. 100: whole kronor.' }

    PriceTermsContent:
      type: object
      additionalProperties: false
      description: |
        Price terms (ADR 0030): discounts after the tariff's base price, in
        basis points of it (1 000 = 10 %). For a group, the best matching
        discount applies; a campaign code adds its own. Together never more
        than maxTotalDiscountBp, and never below the tariff's minimum premium.
      required: [market, currency, groupDiscounts, campaigns, maxTotalDiscountBp]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        groupDiscounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, fromMember, bp]
            properties:
              kind: { type: string, enum: [litter, household, any] }
              fromMember: { type: integer, minimum: 1, description: 'e.g. 2: the second animal in the group and later.' }
              bp: { type: integer, minimum: 0, maximum: 10000 }
        campaigns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, validFrom, bp, newPoliciesOnly]
            properties:
              code: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,31}$' }
              validFrom: { $ref: '#/components/schemas/Date' }
              validTo: { $ref: '#/components/schemas/Date', description: 'Exclusive. For terms starting before it.' }
              bp: { type: integer, minimum: 0, maximum: 10000 }
              newPoliciesOnly: { type: boolean, description: Not at renewal. }
        maxTotalDiscountBp: { type: integer, minimum: 0, maximum: 10000 }

    ClaimsRulesContent:
      type: object
      additionalProperties: false
      required: [market, vatReimbursable, nonReimbursableCategories, diagnosisGroups, autoSettleMax]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        vatReimbursable: { type: boolean, description: Is VAT on vet invoices reimbursed? }
        nonReimbursableCategories:
          type: array
          items: { type: string, minLength: 1 }
        diagnosisGroups:
          type: object
          description: Diagnosis code -> diagnosis group.
          additionalProperties: { type: string, minLength: 1 }
        autoSettleMax:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Highest payout settled without a claims handler.
        informationRequest:
          type: object
          additionalProperties: false
          required: [reminderAfterDays, expiresAfterDays]
          description: Days to the reminder and the due date of a request for information (ADR 0036). Omitted, 14 and 30.
          properties:
            reminderAfterDays: { type: integer, minimum: 1, maximum: 365 }
            expiresAfterDays: { type: integer, minimum: 1, maximum: 365 }

    RuleSetDraft:
      type: object
      additionalProperties: false
      required: [content, calculationModel, effectiveFrom]
      properties:
        content: { $ref: '#/components/schemas/RuleSetContent' }
        calculationModel: { type: string, description: 'One of the engine''s calculation models, e.g. vet-care.v1; tariff.v1 for a tariff; price-terms.v1 for price terms (ADR 0030); underwriting.v1 for underwriting rules (ADR 0031).' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }

    RuleSetVersion:
      type: object
      required: [series, version, status, content, calculationModel, effectiveFrom, revision, createdBy, createdAt]
      properties:
        series: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, in_review, published, retired] }
        content: { $ref: '#/components/schemas/RuleSetContent' }
        calculationModel: { type: string }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        checksum: { type: string, description: sha256 over content, calculation model and effectiveFrom. Set from review on. }
        revision: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        submittedBy: { type: string }
        submittedAt: { $ref: '#/components/schemas/DateTime' }
        publishedBy: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        retiredBy: { type: string }
        retiredAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: string, description: Why the version was returned or retired. }

    SimulationRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }

    SimulatedOutcome:
      type: object
      required: [proposedOutcome, mode, payout]
      properties:
        proposedOutcome: { $ref: '#/components/schemas/Outcome' }
        mode: { type: string, enum: [auto, manual] }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        rulesVersion: { type: string }

    SimulationResult:
      type: object
      required: [rulesVersion, calculationModel, decisions, changed, modeChanged, totals, items]
      properties:
        rulesVersion: { type: string }
        calculationModel: { type: string }
        decisions: { type: integer, minimum: 0, description: Decisions simulated. }
        changed: { type: integer, minimum: 0, description: Decisions whose proposal, mode or payout would change. }
        modeChanged:
          type: object
          required: [autoToManual, manualToAuto]
          properties:
            autoToManual: { type: integer, minimum: 0 }
            manualToAuto: { type: integer, minimum: 0 }
        totals:
          type: array
          description: Payouts per currency. Never added across currencies.
          items:
            type: object
            required: [currency, decisions, storedPayout, simulatedPayout]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              decisions: { type: integer, minimum: 0 }
              storedPayout: { $ref: '#/components/schemas/NonNegativeMoney' }
              simulatedPayout: { $ref: '#/components/schemas/NonNegativeMoney' }
        items:
          type: array
          maxItems: 200
          description: The decisions that would change.
          items:
            type: object
            required: [claimId, decisionId, seq, currency, stored, simulated, payoutDelta, changed]
            properties:
              claimId: { type: string }
              decisionId: { type: string }
              seq: { type: integer, minimum: 1 }
              currency: { $ref: '#/components/schemas/Currency' }
              stored: { $ref: '#/components/schemas/SimulatedOutcome' }
              simulated: { $ref: '#/components/schemas/SimulatedOutcome' }
              payoutDelta: { $ref: '#/components/schemas/Money' }
              changed: { type: boolean }

    ReferenceItem:
      type: object
      required: [kind, code, label, labels, active, revision, changedBy, changedAt]
      properties:
        kind: { type: string, enum: [species, breed, sex] }
        code: { type: string }
        parent: { type: string, description: 'The parent code, e.g. the species of a breed.' }
        label: { type: string, description: 'The label in the language asked for with Accept-Language, else English, else the first language.' }
        labels: { $ref: '#/components/schemas/Labels' }
        active: { type: boolean, description: 'Inactive codes stay readable for stored data but are not offered for new data.' }
        revision: { type: integer, minimum: 1 }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ReferenceItemChange:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels: { $ref: '#/components/schemas/Labels' }
        parent: { type: string, description: 'Required for a new breed: its species. Never changes.' }
        active: { type: boolean, default: true }
        basedOnRevision: { type: integer, minimum: 1, description: 'The current revision. Omitted for a new code.' }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Required when changing an existing code.' }

    Labels:
      type: object
      description: 'Language tag (BCP 47, e.g. sv, en, de-CH) -> label.'
      minProperties: 1
      propertyNames: { pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
      additionalProperties: { type: string, minLength: 1, maxLength: 200 }

    DeductibleTerms:
      type: object
      additionalProperties: false
      required: [fixed, fixedPer, variableBp]
      properties:
        fixed: { $ref: '#/components/schemas/NonNegativeMoney' }
        fixedPer: { type: string, enum: [period, claim, policy_year] }
        periodDays: { type: integer, minimum: 1, maximum: 3650, description: Required when fixedPer is period. }
        periodEndsAtRenewal: { type: boolean }
        variableBp: { type: integer, minimum: 0, maximum: 10000, description: 'Basis points: 2500 = 25 %.' }
        variableBpByAge:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fromAgeYears, bp]
            properties:
              fromAgeYears: { type: integer, minimum: 1 }
              bp: { type: integer, minimum: 0, maximum: 10000 }

    VetCareTerms:
      type: object
      required: [code, annualLimit, deductible, waitingPeriodDays]
      properties:
        code: { type: string, enum: [vet_care] }
        annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
        deductible: { $ref: '#/components/schemas/DeductibleTerms' }
        waitingPeriodDays: { type: integer, minimum: 0 }

    ProductContent:
      type: object
      additionalProperties: false
      required: [market, currency, species, names, ruleSeries, vetCare]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        species:
          type: array
          minItems: 1
          items: { type: string }
          description: Species codes from the reference data.
        names: { $ref: '#/components/schemas/Labels' }
        ruleSeries: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,63}$', description: 'The rule series claims are assessed with, e.g. SE-HUND-VV.' }
        priceTermsSeries: { type: string, description: 'The price terms series: discounts after the base price (ADR 0030). Only with tariffSeries. At review, a version must be in force when sales start.' }
        tariffSeries: { type: string, description: 'The tariff series that prices it (ADR 0030). Omitted: the premium is given by hand. At review, a version must be in force when sales start and cover every species, annual limit and deductible option.' }
        underwritingSeries: { type: string, description: 'The underwriting rules series (ADR 0031): new policies are applied for with POST /v1/applications. Omitted: policies are issued directly. At review, a version must be in force when sales start, for the market and with age limits for every species.' }
        documents:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ProductDocument' }
          description: 'The documents of the version per type and language (ADR 0032), locked by the checksum at review. When there are any, review needs terms, pre-contract and ipid in the market''s language (SE: sv), and an acceptance must name the terms and pre-contract the customer was shown.'
        policy:
          type: object
          additionalProperties: false
          description: How the product's policies behave over time (ADR 0029). Omitted settings get their defaults.
          properties:
            midTermCancellation:
              type: string
              enum: [term-end, immediate]
              default: term-end
              description: 'The customer''s cancellation during a term: at the end of the term (binding period), or the day after notice with the rest of the premium refunded.'
            termMonths: { type: integer, minimum: 1, maximum: 12, default: 12, description: 'The length of a term in months, at issue and at each renewal. The market''s law sets the maximum.' }
            renewalLeadDays: { type: integer, minimum: 1, maximum: 120, default: 45, description: 'Days before the term ends that it is renewed. Shorter than the term.' }
            transferAcceptanceDays: { type: integer, minimum: 1, maximum: 90, default: 30, description: Days a new owner has to accept a transferred policy. }
            applicationExpiryDays: { type: integer, minimum: 1, maximum: 90, default: 30, description: 'Days an application referred to a person may wait before the expiry run ends it (ADR 0031).' }
            maxStartAheadDays: { type: integer, minimum: 0, maximum: 365, default: 90, description: 'How many days after the day of issue a new policy may start. The price and the underwriting are set on the day of issue. 0, it starts the same day.' }
        billing:
          type: object
          additionalProperties: false
          description: How the product's premium is paid (ADR 0040). Omitted settings get their defaults.
          properties:
            paymentIntervals:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/PaymentInterval' }
              default: [year]
              description: The payment intervals a customer may choose.
            defaultPaymentInterval:
              allOf: [{ $ref: '#/components/schemas/PaymentInterval' }]
              default: year
              description: The interval when none is chosen. One of paymentIntervals.
            installmentFee: { type: integer, minimum: 0, maximum: 100000, default: 0, description: 'A fee per installment in minor units of the product''s currency, taken only when the interval is shorter than a year.' }
            invoiceLeadDays: { type: integer, minimum: 1, maximum: 60, default: 31, description: 'Days before an installment is due that the invoicing run puts it on an invoice. A later premium is due at the earliest a month after the invoice (SE: FAL 5 kap. 1 §), so a shorter lead moves its due date.' }
        vetCare:
          type: object
          additionalProperties: false
          required: [annualLimits, defaultAnnualLimit, deductibles, defaultDeductible, waitingPeriodDays]
          properties:
            annualLimits:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/NonNegativeMoney' }
            defaultAnnualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductibles:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [code, labels, terms]
                properties:
                  code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
                  labels: { $ref: '#/components/schemas/Labels' }
                  terms: { $ref: '#/components/schemas/DeductibleTerms' }
            defaultDeductible: { type: string }
            waitingPeriodDays: { type: integer, minimum: 0, maximum: 365 }

    PaymentInterval:
      type: string
      enum: [year, half-year, quarter, month]
      description: How often the premium is paid (ADR 0040).

    ProductDraftUpdate:
      type: object
      additionalProperties: false
      required: [content, salesFrom]
      properties:
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date' }

    ProductDraft:
      type: object
      additionalProperties: false
      required: [version, content, salesFrom]
      properties:
        version: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,31}$' }
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date', description: 'First day not on sale. Omitted: until further notice.' }

    ProductVersion:
      type: object
      required: [product, version, id, name, status, content, salesFrom, revision, createdBy, createdAt]
      properties:
        product: { type: string }
        version: { type: string }
        id: { type: string, description: 'product@version, as policies and claims refer to it.' }
        name: { type: string, description: The name in the language asked for with Accept-Language. }
        status: { type: string, enum: [draft, in_review, published] }
        content: { $ref: '#/components/schemas/ProductContent' }
        salesFrom: { $ref: '#/components/schemas/Date' }
        salesTo: { $ref: '#/components/schemas/Date' }
        checksum: { type: string, description: sha256 over content and salesFrom. Set from review on. }
        revision: { type: integer, minimum: 1 }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        submittedBy: { type: string }
        submittedAt: { $ref: '#/components/schemas/DateTime' }
        publishedBy: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        salesEndedBy: { type: string }
        salesEndedAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: string, description: Why the version was returned or its sales ended. }

    SalesEndRequest:
      type: object
      additionalProperties: false
      required: [salesTo, reason]
      properties:
        salesTo: { $ref: '#/components/schemas/Date' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    PartyIdentifierInput:
      type: object
      additionalProperties: false
      required: [type, country, value]
      properties:
        type: { type: string, enum: [personal-number, organization-number] }
        country: { type: string, pattern: '^[A-Z]{2}$', description: The country that issued the number. }
        value: { type: string, minLength: 1, maxLength: 40 }

    PartySearchRequest:
      oneOf:
        - $ref: '#/components/schemas/PartyIdentifierInput'
        - type: object
          additionalProperties: false
          required: [text]
          properties:
            text: { type: string, minLength: 2, maxLength: 100, description: 'A part of the name (given and family name, or the organization''s name) or email, case insensitive.' }

    RestrictPartyRequest:
      type: object
      additionalProperties: false
      required: [until, reason]
      properties:
        until: { $ref: '#/components/schemas/Date', description: Restricted up to and including this date, after today. }
        reason: { type: string, minLength: 1, maxLength: 500 }

    EndPartyRequest:
      type: object
      additionalProperties: false
      required: [cause, on, reason]
      properties:
        cause: { type: string, enum: [deceased, dissolved, other], description: 'deceased: a person; dissolved: an organization.' }
        on: { $ref: '#/components/schemas/Date', description: The day it ended, not after today. }
        reason: { type: string, minLength: 1, maxLength: 500, description: 'e.g. the death certificate received.' }

    PartyIdentifierShown:
      type: object
      required: [id, type, country, value, masked, addedBy, addedAt]
      properties:
        id: { type: string, pattern: '^pid_[A-Za-z0-9]+$' }
        type: { type: string, enum: [personal-number, organization-number] }
        country: { type: string }
        value: { type: string, description: 'Personal numbers are masked, e.g. 19850312-****.' }
        masked: { type: boolean }
        addedBy: { type: string }
        addedAt: { $ref: '#/components/schemas/DateTime' }
        removedBy: { type: string }
        removedAt: { $ref: '#/components/schemas/DateTime' }
        removalReason: { type: string }

    Address:
      type: object
      additionalProperties: false
      required: [street, postalCode, city, country]
      properties:
        street: { type: string, minLength: 1, maxLength: 200 }
        postalCode: { type: string, minLength: 1, maxLength: 12 }
        city: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, pattern: '^[A-Z]{2}$' }

    PartyDetails:
      type: object
      properties:
        givenName: { type: string, maxLength: 100, description: Persons only. }
        familyName: { type: string, maxLength: 100, description: Persons only. }
        birthDate: { $ref: '#/components/schemas/Date' }
        name: { type: string, maxLength: 200, description: Organizations only. }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 20, description: 'International format, e.g. +46701234567.' }
        address: { $ref: '#/components/schemas/Address' }
        language: { type: string, pattern: '^[a-z]{2}$', description: 'Preferred language, ISO 639-1.' }

    Party:
      allOf:
        - $ref: '#/components/schemas/PartyDetails'
        - type: object
          required: [id, revision, kind, market, changedBy, changedAt]
          properties:
            id: { type: string }
            revision: { type: integer, minimum: 1 }
            kind: { type: string, enum: [person, organization] }
            market: { $ref: '#/components/schemas/Market' }
            changedBy: { type: string }
            changedAt: { $ref: '#/components/schemas/DateTime' }
            reason: { type: string }
            anonymized: { type: boolean, enum: [true], description: 'The personal data is removed (ADR 0028).' }

    PartyRecord:
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          required: [identifiers]
          properties:
            restrictedUntil: { $ref: '#/components/schemas/Date', description: 'Restricted (GDPR article 18) up to and including this date. While restricted, only callers with parties:privacy see the party.' }
            identifiers:
              type: array
              description: The numbers in force.
              items: { $ref: '#/components/schemas/PartyIdentifierShown' }
            removedIdentifiers:
              type: array
              description: Numbers removed with a reason (ADR 0039), as history.
              items: { $ref: '#/components/schemas/PartyIdentifierShown' }
            ended:
              type: object
              required: [cause, on, endedBy, endedAt]
              description: 'Ended (ADR 0039): nothing new may point at the party.'
              properties:
                cause: { type: string, enum: [deceased, dissolved, other] }
                on: { $ref: '#/components/schemas/Date' }
                reason: { type: string }
                endedBy: { type: string }
                endedAt: { $ref: '#/components/schemas/DateTime' }

    IssuePolicyRequest:
      type: object
      additionalProperties: false
      required: [market, animalId, policyholderPartyId, productVersion, startDate, acceptance]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        acceptance: { $ref: '#/components/schemas/AcceptanceInput' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        policyholderPartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        productVersion: { type: string, description: 'e.g. SE-HUND-VV-LIV@2026.2' }
        startDate: { $ref: '#/components/schemas/Date' }
        vetCare:
          type: object
          additionalProperties: false
          description: The customer's choices. Omitted ones get the product's defaults.
          properties:
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductible: { type: string, description: A deductible option code from the product. }
        premium:
          type: object
          additionalProperties: false
          required: [amount, currency]
          description: 'The premium for the whole term. Omitted: the product''s tariff prices it (ADR 0030). For a product with a tariff, a different premium is a manual price: it needs priceOverride and the permission policies:price-override. Required for a product without a tariff.'
          properties:
            amount: { $ref: '#/components/schemas/NonNegativeMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
        priceOverride: { $ref: '#/components/schemas/PriceOverride' }
        groupId: { type: string, pattern: '^pgr_[A-Za-z0-9]+$', description: A group the policy joins from its start; gives the group discount. }
        campaignCode: { type: string, maxLength: 32 }

    NoticeType:
      type: string
      enum: [policy-confirmation, renewal-notice, insurer-termination, cancellation-confirmation, application-declined, transfer-offer, claim-decision, claim-information-request, claim-information-reminder, claim-information-expired, invoice]
      description: |
        - policy-confirmation: the written confirmation after issue (SE: FAL 2 kap. 4 §), schema policy-confirmation.v1
        - renewal-notice: the new term and what changed (FAL 3 kap. 5 §), renewal-notice.v1
        - insurer-termination: the insurer's cancellation (FAL 3 kap. 3 och 7 §§, 5 kap. 2 §), insurer-termination.v1
        - cancellation-confirmation: the customer's cancellation confirmed (not required by law), cancellation-confirmation.v1
        - application-declined: the refusal with reasons (FAL 7 kap. 6 §), application-declined.v1
        - transfer-offer: the offer to the new owner of a sold animal to take over the policy (ADR 0029, not required by law), transfer-offer.v1
        - claim-decision: the claims decision with the calculation and how it is reviewed (ADR 0036; SE: FAL 7 kap. 1 §, GDPR art. 22.3), claim-decision.v1
        - claim-information-request: what the customer must send (FAL 7 kap. 1 §), claim-information-request.v1. Only for a request to the customer.
        - claim-information-reminder: the reminder of an open request, claim-information-reminder.v1
        - claim-information-expired: the request expired; a handler decides on what there is (not required by law), claim-information-expired.v1
        - invoice: the demand for premium (ADR 0040; SE: FAL 5 kap. 1 §), invoice.v1. To be sent on its issue date, since the time to pay counts from it.

    WebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, eventTypes, markets]
      properties:
        url: { type: string, maxLength: 2000, description: 'https, e.g. https://hooks.example.com/petvold. Not a local or private address.' }
        eventTypes:
          type: array
          minItems: 1
          items: { type: string, pattern: '^(\*|[a-z]+\.(\*|[a-z_]+))$' }
          description: 'Patterns: `*`, a group such as `policy.*`, or a type. Public types: policy.issued, policy.changed, policy.renewed, policy.transferred, policy.cancelled, policy.reinstated, application.received, application.accepted, application.referred, application.declined, application.withdrawn, application.expired, proposal.created.'
        markets:
          oneOf:
            - { type: array, minItems: 1, items: { $ref: '#/components/schemas/Market' } }
            - { const: '*' }
        description: { type: string, maxLength: 200, description: 'e.g. CRM or the document system' }

    WebhookSubscriptionChange:
      type: object
      additionalProperties: false
      required: [basedOnRevision, url, eventTypes, markets, status]
      description: The whole subscription as it should be, based on the revision in force.
      properties:
        basedOnRevision: { type: integer, minimum: 1 }
        url: { $ref: '#/components/schemas/WebhookSubscriptionRequest/properties/url' }
        eventTypes: { $ref: '#/components/schemas/WebhookSubscriptionRequest/properties/eventTypes' }
        markets: { $ref: '#/components/schemas/WebhookSubscriptionRequest/properties/markets' }
        description: { $ref: '#/components/schemas/WebhookSubscriptionRequest/properties/description' }
        status: { type: string, enum: [active, disabled] }

    WebhookSubscription:
      type: object
      required: [id, url, eventTypes, markets, status, revision, createdBy, createdAt, changedBy, changedAt]
      properties:
        id: { type: string, pattern: '^whs_[A-Za-z0-9]+$' }
        url: { type: string }
        eventTypes: { type: array, items: { type: string } }
        markets:
          oneOf:
            - { type: array, items: { $ref: '#/components/schemas/Market' } }
            - { const: '*' }
        description: { type: string }
        status: { type: string, enum: [active, disabled] }
        disabledReason: { type: string, description: 'Why it is disabled, e.g. the receiver answered 410 Gone.' }
        revision: { type: integer, minimum: 1 }
        previousSecretUntil: { $ref: '#/components/schemas/DateTime', description: Until when the previous secret also signs. }
        failingSince: { $ref: '#/components/schemas/DateTime', description: 'Since when every attempt has failed. After five days the subscription is disabled. Cleared by a delivery.' }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }

    WebhookSubscriptionWithSecret:
      type: object
      required: [subscription, secret]
      properties:
        subscription: { $ref: '#/components/schemas/WebhookSubscription' }
        secret: { type: string, pattern: '^whsec_', description: 'The signing secret, as Standard Webhooks writes it. Shown only here.' }

    CloudEvent:
      type: object
      description: An event as Petvold sends it (CloudEvents 1.0, ADR 0033). `data` has ids and fields that are not personal data.
      required: [specversion, id, source, type, subject, time, datacontenttype, market, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string, description: The event's id. The same at every attempt; use it to recognize repeats. }
        source: { type: string, description: 'e.g. /petvold/policies' }
        type: { type: string, description: 'e.g. petvold.policy.issued.v1' }
        subject: { type: string, description: 'The resource, e.g. pol_91c2…' }
        time: { $ref: '#/components/schemas/DateTime' }
        datacontenttype: { const: application/json }
        market: { $ref: '#/components/schemas/Market' }
        data: { type: object, additionalProperties: true }

    WebhookDelivery:
      type: object
      required: [id, subscriptionId, eventId, eventType, event, status, attempts, nextAttemptAt, createdAt]
      properties:
        id: { type: string, pattern: '^whd_[A-Za-z0-9]+$' }
        subscriptionId: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        event: { $ref: '#/components/schemas/CloudEvent' }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { $ref: '#/components/schemas/DateTime' }
        lastAttemptAt: { $ref: '#/components/schemas/DateTime' }
        lastStatus: { type: integer, description: The receiver's HTTP status at the last attempt. }
        lastError: { type: string }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        retriedAt: { $ref: '#/components/schemas/DateTime', description: When a person sent it again. The three days count from here. }
        prunedAt: { $ref: '#/components/schemas/DateTime', description: 'When the data of the event was removed, 30 days after it was delivered or given up. event.data is then empty.' }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    MarketNoticeSettings:
      type: object
      additionalProperties: false
      properties:
        documentMaker: { type: string, enum: [insurer, petvold], description: 'Who makes the notices'' documents (ADR 0038). Omitted: insurer, the insurer''s document system. petvold: Petvold makes the PDF of the types it has templates for (claim-decision, policy-confirmation) when the notice is made, and the notice gets it as document; other types stay with the insurer. Needs a PDF renderer (PETVOLD_GOTENBERG_URL), else 422.' }
        promptlyDays: { type: integer, minimum: 1, maximum: 30, description: 'Days that "promptly" gives. Omitted: Petvold''s default (SE: 3).' }
        disabledTypes: { type: array, items: { $ref: '#/components/schemas/NoticeType' }, description: Types the law does not require that are not made. }
        texts:
          type: object
          description: Language (ISO 639-1) -> texts. A notice gets the texts in its language, else the market's.
          propertyNames: { pattern: '^[a-z]{2}$' }
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              sender: { type: string, minLength: 1, maxLength: 2000, description: 'Who the notice is from. Copied to every notice as content.sender.' }
              review: { type: string, minLength: 1, maxLength: 2000, description: 'How a decision is reviewed (SE: FAL 7 kap. 6 §). Copied to application-declined as content.review; without it the notice is incomplete.' }
              payment: { type: string, minLength: 1, maxLength: 2000, description: 'Where and how an invoice is paid, e.g. the bankgiro number. Copied to invoice as content.payment; without it the notice is incomplete.' }

    NoticeSettings:
      type: object
      required: [version, markets, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        markets:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MarketNoticeSettings' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ChangeNoticeSettingsRequest:
      type: object
      additionalProperties: false
      required: [basedOnVersion, markets, reason]
      properties:
        basedOnVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        markets:
          type: object
          propertyNames: { pattern: '^[A-Z]{2}$' }
          additionalProperties: { $ref: '#/components/schemas/MarketNoticeSettings' }

    PayerAccount:
      type: object
      additionalProperties: false
      required: [id, partyId, market, currency, paymentMethod, createdAt]
      description: One payer per party, market and currency (ADR 0040). The payer is the policyholder.
      properties:
        id: { type: string, pattern: '^bac_[A-Za-z0-9]+$' }
        partyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        paymentMethod: { type: string, enum: [invoice], description: 'How the payer pays. Autogiro, direct debit, Swish and card come with the payments module.' }
        createdAt: { type: string, format: date-time }

    Invoice:
      type: object
      additionalProperties: false
      required: [id, number, accountId, partyId, market, currency, issueDate, dueDate, reference, lines, total, createdBy, createdAt]
      description: An invoice (ADR 0040). Never changes; a correction is a credit note.
      properties:
        id: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
        number: { type: string, description: 'From the market''s unbroken series per year, e.g. SE-2026-000001.' }
        accountId: { type: string }
        partyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date, description: "The earliest line's due date, but never before any line may be due by law: a new policy's first premium fourteen days after the invoice, a later premium a month after (SE: FAL 5 kap. 1 §)." }
        reference:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type: { type: string, enum: [ocr, rf], description: 'ocr: Bankgirot''s OCR with a length and a check digit. rf: ISO 11649.' }
            value: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [planId, policyId, termNo, seq, periodStart, periodEnd, premium, tax, fee, amount]
            properties:
              planId: { type: string }
              policyId: { type: string }
              termNo: { type: integer, minimum: 1 }
              seq: { type: integer, minimum: 1, description: "The installment's seq in the plan." }
              periodStart: { type: string, format: date }
              periodEnd: { type: string, format: date, description: Exclusive. }
              premium: { type: integer, minimum: 0 }
              tax: { type: integer, minimum: 0 }
              fee: { type: integer, minimum: 0 }
              amount: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        createdBy: { type: string, description: "Who ran the invoicing: 'scheduler' or a person." }
        createdAt: { type: string, format: date-time }

    PremiumPlanRecord:
      type: object
      additionalProperties: false
      required: [id, accountId, policyId, termNo, market, productVersion, source, input, plan, createdAt]
      description: The premium plan for one term of a policy (ADR 0040). Never changes.
      properties:
        id: { type: string, pattern: '^ppl_[A-Za-z0-9]+$' }
        accountId: { type: string }
        policyId: { type: string }
        termNo: { type: integer, minimum: 1 }
        market: { $ref: '#/components/schemas/Market' }
        productVersion: { type: string }
        source:
          type: object
          additionalProperties: false
          required: [eventId, eventType, occurredAt]
          description: The policy event it was made from.
          properties:
            eventId: { type: string }
            eventType: { type: string }
            occurredAt: { type: string, format: date-time }
        input:
          type: object
          additionalProperties: false
          required: [currency, termStart, termEnd, termPremium, interval]
          description: What the plan was computed from, so it can be computed again (ADR 0018).
          properties:
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            termStart: { type: string, format: date }
            termEnd: { type: string, format: date, description: Exclusive. }
            termPremium: { type: integer, minimum: 0 }
            interval: { $ref: '#/components/schemas/PaymentInterval' }
            installmentFee: { type: integer, minimum: 0 }
            premiumTaxBp: { type: integer, minimum: 0 }
            firstPremium:
              type: object
              additionalProperties: false
              required: [noticeSentOn, payWithinDays]
              description: 'The first premium of a new policy: due payWithinDays after the notice, never before the term starts (SE: FAL 5 kap. 1 §).'
              properties:
                noticeSentOn: { type: string, format: date }
                payWithinDays: { type: integer, minimum: 0 }
        plan: { $ref: '#/components/schemas/PremiumPlan' }
        invoiceLeadDays: { type: integer, minimum: 1, maximum: 60, description: "The product's lead time when the plan was made. Omitted: 31." }
        createdAt: { type: string, format: date-time }

    PremiumPlan:
      type: object
      additionalProperties: false
      required: [model, currency, termStart, termEnd, interval, termPremium, premiumTaxBp, tax, fees, total, installments, inputHash]
      properties:
        model: { type: string, enum: [premium-plan.v1], description: 'The calculation model. A change in the result is a new model.' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        termStart: { type: string, format: date }
        termEnd: { type: string, format: date, description: Exclusive. }
        interval: { $ref: '#/components/schemas/PaymentInterval' }
        termPremium: { type: integer, minimum: 0 }
        premiumTaxBp: { type: integer, minimum: 0 }
        tax: { type: integer, minimum: 0, description: Tax on the term premium, rounded half up once. }
        fees: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, description: termPremium + tax + fees. }
        installments:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [seq, periodStart, periodEnd, dueDate, premium, tax, fee, amount]
            properties:
              seq: { type: integer, minimum: 1 }
              periodStart: { type: string, format: date }
              periodEnd: { type: string, format: date, description: Exclusive. }
              dueDate: { type: string, format: date }
              premium: { type: integer, minimum: 0 }
              tax: { type: integer, minimum: 0 }
              fee: { type: integer, minimum: 0 }
              amount: { type: integer, minimum: 0, description: premium + tax + fee. }
        inputHash: { type: string, pattern: '^[0-9a-f]{64}$' }

    Notice:
      type: object
      required: [id, type, schema, market, recipientPartyId, language, source, legalBasis, dueBy, content, status, createdAt, deliveries]
      properties:
        id: { type: string, pattern: '^ntc_[A-Za-z0-9]+$' }
        type: { $ref: '#/components/schemas/NoticeType' }
        schema: { type: string, description: 'The content schema, e.g. renewal-notice.v1. A new legal requirement gives a new version.' }
        market: { $ref: '#/components/schemas/Market' }
        recipientPartyId: { type: string, description: The party the notice is for. Read name and address from the party when sending. }
        language: { type: string, pattern: '^[a-z]{2}$', description: 'The party''s language, else the market''s. Choose the template by it.' }
        policyId: { type: string }
        applicationId: { type: string }
        invoiceId: { type: string, description: 'An invoice (ADR 0040). It may hold several policies, so the notice has no policyId.' }
        source:
          type: object
          required: [eventId, eventType, occurredAt]
          description: The event the notice was made from. One notice of a type per event.
          properties:
            eventId: { type: string }
            eventType: { type: string }
            occurredAt: { $ref: '#/components/schemas/DateTime' }
        legalBasis: { type: array, items: { type: string }, description: The provisions that require it. Empty for a notice the law does not require. }
        dueBy: { $ref: '#/components/schemas/Date', description: 'The last day to send it: promptly after the event, the first day of a renewed term, or for the insurer''s cancellation the day it says it sent it, and for an invoice its issue date.' }
        content:
          type: object
          additionalProperties: true
          description: |
            What the law requires, as fields, per schema. No names or addresses.
            - policy-confirmation.v1 and renewal-notice.v1: policyId, animalId, termNo, productVersion, startDate, endDate, premium, vetCare, deductibleOption, riders. The confirmation adds acceptedDocuments; the renewal adds changes (product-version, premium, vet-care, riders) and previous.
            - insurer-termination.v1 and cancellation-confirmation.v1: policyId, animalId, reason, receivedOn, effectiveDate, refund; the insurer's grounds, and for unpaid premium voidIfPaidBefore.
            - application-declined.v1: applicationId, animalId, productVersion, reasons (codes) and decidedBy (rules or person), and review from the settings.
            - transfer-offer.v1: policyId, animalId, proposalId, fromPartyId, from, deadline, and the term as in the confirmation.
            - claim-decision.v1: claimId, claimNo, policyId, animalId, decisionId, seq, outcome, payout, automated, mainReason and steps (keys and values, as the decision's explanation), deviation when a handler decided against the proposal, reviewAvailable, and review from the settings.
            - claim-information-request.v1 and claim-information-reminder.v1: claimId, claimNo, policyId, animalId, requestId, items, note, dueDate.
            - claim-information-expired.v1: the same without note, and decidedOnAvailableBasis.
            - invoice.v1: invoiceId, invoiceNo, issueDate, dueDate, total, reference (type and value), lines (policyId, periodStart, periodEnd, premium, tax, fee, amount), and payment from the settings.
            Every type gets sender from the settings when it is set.
        status: { type: string, enum: [pending, sent, failed], description: 'sent once any delivery was sent; failed if every delivery failed.' }
        late: { type: boolean, description: First sent after dueBy. }
        overdue: { type: boolean, description: Not sent and dueBy has passed. }
        incomplete: { type: array, items: { type: string }, description: 'Texts the insurer''s settings lacked when it was made, e.g. review. Unsent, it is in the queue (attention=true).' }
        settingsVersion: { type: integer, minimum: 1, description: 'The version of the notice settings it was made with. Omitted: made before the settings existed.' }
        documentMaker: { type: string, enum: [insurer, petvold], description: 'Who makes its document, from the market''s setting when it was made (ADR 0038).' }
        document:
          type: object
          required: [id, sha256, madeBy, madeAt]
          description: 'documentMaker petvold: the PDF Petvold made, in its archive (GET /v1/documents/{id}). notice.document_made says when it is there; send it, then report the delivery without documentId and sha256.'
          properties:
            id: { type: string, pattern: '^doc_[A-Za-z0-9_]+$' }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            madeBy: { type: string }
            madeAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }

    Delivery:
      type: object
      required: [id, outcome, reportedBy, reportedAt]
      properties:
        id: { type: string, pattern: '^ndl_[A-Za-z0-9]+$' }
        outcome: { type: string, enum: [sent, failed] }
        channel: { type: string, enum: [letter, email, digital-mailbox, customer-portal] }
        sentAt: { $ref: '#/components/schemas/DateTime' }
        documentId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        reason: { type: string }
        reportedBy: { type: string }
        reportedAt: { $ref: '#/components/schemas/DateTime' }

    DeliveryRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [sent, failed] }
        channel: { type: string, enum: [letter, email, digital-mailbox, customer-portal], description: Required when sent. }
        sentAt: { $ref: '#/components/schemas/DateTime', description: 'When it was sent. Required when sent; not in the future.' }
        documentId: { type: string, maxLength: 200, description: 'The document''s id in the insurer''s archive. Required when sent, unless Petvold made the document (documentMaker petvold): then omitted, and Petvold''s document is recorded.' }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: 'sha256 of the document''s bytes. Required when sent, unless Petvold made the document.' }
        reason: { type: string, maxLength: 500, description: 'Why it failed, e.g. a missing address. Required when failed. No personal data.' }

    AcceptanceInput:
      type: object
      additionalProperties: false
      required: [channel, acceptedAt]
      description: How the customer accepted the offer (ADR 0031). Petvold adds the time it received it.
      properties:
        channel: { type: string, minLength: 1, maxLength: 40, description: 'e.g. web, app, phone or paper.' }
        reference: { type: string, maxLength: 200, description: 'e.g. a session id, a signing reference or a recording.' }
        acceptedAt: { $ref: '#/components/schemas/DateTime', description: When the customer accepted, as the channel says. Not in the future. }
        documents:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AcceptedDocument' }
          description: 'The product version''s documents the channel showed the customer (ADR 0032), as GET /v1/products lists them. Required for a product with documents: at least terms and pre-contract. A document the version does not have, or another checksum, gives 422.'

    ProductDocument:
      type: object
      additionalProperties: false
      required: [type, language, uri, sha256]
      description: A document in the insurer's archive (ADR 0032). Petvold keeps the address and checksum, not the document.
      properties:
        type: { type: string, enum: [terms, pre-contract, ipid], description: 'terms: the full terms; pre-contract: information before the contract; ipid: the insurance product information document (IDD art. 20).' }
        language: { type: string, pattern: '^[a-z]{2}$', description: ISO 639-1. }
        uri: { type: string, maxLength: 500, description: 'Where the archive keeps it, e.g. https://documents.example.com/terms-sv.pdf.' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: sha256 of the document's bytes. }

    AcceptedDocument:
      type: object
      additionalProperties: false
      required: [type, language, sha256]
      description: A product document the customer was shown (ADR 0032).
      properties:
        type: { type: string, enum: [terms, pre-contract, ipid] }
        language: { type: string, pattern: '^[a-z]{2}$' }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }

    ApplicationRequest:
      type: object
      additionalProperties: false
      required: [market, animalId, policyholderPartyId, productVersion, startDate, acceptance, answers]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        acceptance: { $ref: '#/components/schemas/AcceptanceInput' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        policyholderPartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        productVersion: { type: string, description: 'e.g. SE-HUND-VV-LIV@2026.2' }
        startDate: { $ref: '#/components/schemas/Date' }
        vetCare:
          type: object
          additionalProperties: false
          description: The customer's choices. Omitted ones get the product's defaults.
          properties:
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductible: { type: string, description: A deductible option code from the product. }
        premium:
          type: object
          additionalProperties: false
          required: [amount, currency]
          description: 'The premium for the whole term. Omitted: the product''s tariff prices it (ADR 0030). For a product with a tariff, a different premium is a manual price: it needs priceOverride and the permission policies:price-override. Required for a product without a tariff.'
          properties:
            amount: { $ref: '#/components/schemas/NonNegativeMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
        priceOverride: { $ref: '#/components/schemas/PriceOverride' }
        groupId: { type: string, pattern: '^pgr_[A-Za-z0-9]+$', description: A group the policy joins from its start; gives the group discount. }
        campaignCode: { type: string, maxLength: 32 }
        answers:
          type: array
          description: An answer to every question for the animal's species (GET /v1/application-questions).
          items: { $ref: '#/components/schemas/UnderwritingAnswer' }

    UnderwritingAnswer:
      type: object
      additionalProperties: false
      required: [question, value]
      properties:
        question: { type: string }
        value: { type: boolean }
        diagnosisCodes: { type: array, minItems: 1, items: { type: string }, description: 'For a diagnoses question answered yes: the declared diagnoses (reference data).' }

    UnderwritingResult:
      type: object
      required: [outcome, riders, reasons, checks, facts, inputHash]
      properties:
        outcome: { type: string, enum: [accept, accept-with-riders, refer, decline] }
        riders:
          type: array
          items:
            type: object
            required: [diagnosisCodes, description, question, reason]
            properties:
              diagnosisCodes: { type: array, items: { type: string } }
              description: { type: string }
              question: { type: string }
              reason: { type: string }
        reasons: { type: array, items: { type: string }, description: Reason codes for refer and decline, which the channel explains. }
        checks:
          type: array
          description: Every check, in order.
          items:
            type: object
            required: [code, result]
            properties:
              code: { type: string, enum: [species, min-age, max-age, breed, answer] }
              result: { type: string, enum: [pass, rider, refer, decline] }
              basis: { oneOf: [{ type: string }, { type: integer }], description: 'e.g. the age, the breed or the question.' }
              reason: { type: string }
        facts:
          type: object
          required: [ageDays, ageYears]
          properties:
            ageDays: { type: integer }
            ageYears: { type: integer }
        rules:
          type: object
          required: [series, version, checksum]
          properties:
            series: { type: string }
            version: { type: integer }
            checksum: { type: string }
        inputHash: { type: string, description: sha256 over the rules and the input; the same application gives the same hash. }

    Application:
      type: object
      required: [id, market, animalId, policyholderPartyId, productVersion, startDate, acceptance, premium, status, underwriting, receivedBy, receivedAt]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        animalId: { type: string }
        policyholderPartyId: { type: string }
        productVersion: { type: string }
        startDate: { $ref: '#/components/schemas/Date' }
        vetCare:
          type: object
          properties:
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductible: { type: string }
        groupId: { type: string }
        campaignCode: { type: string }
        acceptance: { $ref: '#/components/schemas/Acceptance' }
        premium:
          type: object
          required: [amount, currency]
          description: The premium for the term the customer applied at.
          properties:
            amount: { $ref: '#/components/schemas/NonNegativeMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [accepted, referred, declined, withdrawn, expired], description: 'The decision''s outcome, else what the rules gave.' }
        deadline: { $ref: '#/components/schemas/Date', description: 'A referred application: the last day for a decision. After it, the expiry run ends it.' }
        decision:
          type: object
          required: [outcome, decidedBy, decidedAt]
          description: What became of a referred application. It never changes.
          properties:
            outcome: { type: string, enum: [accepted, declined, withdrawn, expired] }
            riders: { type: array, items: { $ref: '#/components/schemas/Rider' } }
            reason: { type: string, description: A decline's reason code. }
            note: { type: string, description: 'The grounds, or why it was withdrawn or expired.' }
            policyId: { type: string }
            decidedBy: { type: string }
            decidedAt: { $ref: '#/components/schemas/DateTime' }
        underwriting:
          type: object
          required: [input, result, engineVersion]
          description: The evidence (ADR 0018). Recomputing with the same rules and input gives the same result.
          properties:
            input:
              type: object
              required: [market, species, birthDate, startDate, answers]
              description: What the rules were run on, with the animal as the register had it.
              properties:
                market: { $ref: '#/components/schemas/Market' }
                species: { type: string }
                breed: { type: string }
                birthDate: { $ref: '#/components/schemas/Date' }
                startDate: { $ref: '#/components/schemas/Date' }
                answers: { type: array, items: { $ref: '#/components/schemas/UnderwritingAnswer' } }
            result: { $ref: '#/components/schemas/UnderwritingResult' }
            engineVersion: { type: string }
        policyId: { type: string, description: The policy an accepted application issued. }
        receivedBy: { type: string }
        receivedAt: { $ref: '#/components/schemas/DateTime' }

    ApplicationDecisionRequest:
      type: object
      additionalProperties: false
      required: [outcome, note]
      properties:
        outcome: { type: string, enum: [accept, decline] }
        note: { type: string, minLength: 1, maxLength: 2000, description: The grounds for the decision. Must not contain more personal data than needed. }
        reason: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', description: 'decline: the reason code, e.g. ongoing-symptoms.' }
        riders:
          type: array
          description: "accept: the riders, replacing the rules' proposals. Omitted: the proposals."
          items:
            type: object
            additionalProperties: false
            required: [diagnosisCodes, description]
            properties:
              diagnosisCodes: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
              description: { type: string, minLength: 1, maxLength: 200 }
        startDate: { $ref: '#/components/schemas/Date', description: 'accept: a later start, when the one applied for has passed.' }

    ApplicationWithdrawalRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }

    ApplicationQuestions:
      type: object
      required: [productVersion, species, rules, questions]
      properties:
        productVersion: { type: string }
        species: { type: string }
        rules:
          type: object
          required: [series, version, checksum]
          properties:
            series: { type: string }
            version: { type: integer }
            checksum: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, type, labels]
            properties:
              id: { type: string }
              type: { type: string, enum: [boolean, diagnoses] }
              label: { type: string, description: 'The text in the caller''s language, else in English or the first language the rules have.' }
              labels: { type: object, additionalProperties: { type: string } }

    Rider:
      type: object
      required: [id, description, diagnosisCodes, validFrom]
      properties:
        id: { type: string }
        description: { type: string }
        diagnosisCodes: { type: array, items: { type: string }, description: Diagnosis codes excluded for this animal. }
        validFrom: { $ref: '#/components/schemas/Date' }
        validTo: { $ref: '#/components/schemas/Date' }
        source: { type: string, enum: [underwriting, manual], description: 'Where it came from (ADR 0031). Omitted: set before ADR 0031.' }
        applicationId: { type: string }
        question: { type: string, description: The underwriting question it answers. }

    PolicyTerm:
      type: object
      required: [policyId, termNo, startDate, endDate, productVersion, currency, vetCare, deductibleOption, premium, riders, transactionId]
      properties:
        policyId: { type: string }
        termNo: { type: integer, minimum: 1 }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date', description: Exclusive. }
        productVersion: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        vetCare: { $ref: '#/components/schemas/VetCareTerms' }
        deductibleOption: { type: string }
        premium: { $ref: '#/components/schemas/NonNegativeMoney' }
        riders: { type: array, items: { $ref: '#/components/schemas/Rider' } }
        transactionId: { type: string }
        pricing: { $ref: '#/components/schemas/TermPricing' }
        changes:
          type: array
          description: Changes of the choices during the term, oldest first.
          items:
            type: object
            required: [changeNo, from, vetCare, deductibleOption, premium, transactionId]
            properties:
              changeNo: { type: integer }
              from: { $ref: '#/components/schemas/Date' }
              vetCare: { $ref: '#/components/schemas/VetCareTerms' }
              deductibleOption: { type: string }
              premium: { $ref: '#/components/schemas/NonNegativeMoney' }
              transactionId: { type: string }
              pricing: { $ref: '#/components/schemas/TermPricing' }

    PolicyVersion:
      type: object
      required: [id, policyId, validFrom, validTo, sysFrom, policyholderPartyId, status, termNo, transactionId]
      properties:
        id: { type: string }
        policyId: { type: string }
        validFrom: { $ref: '#/components/schemas/Date' }
        validTo: { $ref: '#/components/schemas/Date', description: Exclusive. }
        sysFrom: { $ref: '#/components/schemas/DateTime', description: When the version became known. }
        sysTo: { $ref: '#/components/schemas/DateTime', description: When it was superseded. }
        policyholderPartyId: { type: string }
        status: { type: string, enum: [active, cancelled] }
        termNo: { type: integer }
        changeNo: { type: integer, description: The change of the term this version follows. }
        transactionId: { type: string }

    PolicyTransaction:
      type: object
      required: [id, policyId, type, steps, requestedBy, requestedAt]
      properties:
        id: { type: string }
        policyId: { type: string }
        type: { type: string, enum: [issue, cancel, reinstate, renew, transfer, change] }
        steps:
          type: array
          items:
            type: object
            required: [step, at]
            properties:
              step: { type: string, enum: [draft, priced, underwritten, issued] }
              at: { $ref: '#/components/schemas/DateTime' }
              note: { type: string }
        requestedBy: { type: string }
        requestedAt: { $ref: '#/components/schemas/DateTime' }
        supersedes: { type: array, items: { type: string }, description: The versions this transaction ended in system time. }
        issue:
          type: object
          required: [acceptance]
          description: 'How the customer accepted at issue (ADR 0031). Omitted: issued before ADR 0031.'
          properties:
            acceptance: { $ref: '#/components/schemas/Acceptance' }
            applicationId: { type: string }
        cancellation:
          type: object
          required: [reason, receivedOn, effectiveDate, refund]
          properties:
            reason: { $ref: '#/components/schemas/CancellationReason' }
            receivedOn: { $ref: '#/components/schemas/Date' }
            effectiveDate: { $ref: '#/components/schemas/Date', description: The first day the policy no longer applies. }
            refund:
              type: object
              required: [amount, currency]
              description: Premium for the days that no longer apply, to be paid back.
              properties:
                amount: { $ref: '#/components/schemas/NonNegativeMoney' }
                currency: { $ref: '#/components/schemas/Currency' }
            note: { type: string }
        renewal:
          type: object
          required: [termNo, productVersion, premium]
          properties:
            termNo: { type: integer }
            productVersion: { type: string }
            premium:
              type: object
              required: [amount, currency]
              properties:
                amount: { $ref: '#/components/schemas/NonNegativeMoney' }
                currency: { $ref: '#/components/schemas/Currency' }
        transfer:
          type: object
          required: [fromPartyId, toPartyId, from, acceptance, premium]
          properties:
            fromPartyId: { type: string }
            toPartyId: { type: string }
            from: { $ref: '#/components/schemas/Date', description: The day of sale. }
            acceptance: { $ref: '#/components/schemas/Acceptance' }
            premium:
              type: object
              required: [amount, currency]
              description: Premium for the days from the sale, back to the previous policyholder and due from the new one.
              properties:
                amount: { $ref: '#/components/schemas/NonNegativeMoney' }
                currency: { $ref: '#/components/schemas/Currency' }
        change:
          type: object
          required: [termNo, changeNo, from, annualLimit, deductibleOption, premium, premiumAdjustment, reason]
          properties:
            termNo: { type: integer }
            changeNo: { type: integer }
            from: { $ref: '#/components/schemas/Date' }
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductibleOption: { type: string }
            premium:
              type: object
              required: [amount, currency]
              properties:
                amount: { $ref: '#/components/schemas/NonNegativeMoney' }
                currency: { $ref: '#/components/schemas/Currency' }
            premiumAdjustment: { type: integer, description: 'What the change costs for the rest of the term: positive to pay, negative to refund.' }
            reason: { type: string }
        reverses: { type: string, description: A reinstatement's cancellation. }
        note: { type: string }

    CancellationReason:
      type: string
      enum: [customer-term-end, customer-immediate, withdrawal, need-ceased, insurer-term-end, insurer-breach, unpaid-premium]

    CancelPolicyRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/CancellationReason' }
        receivedOn: { $ref: '#/components/schemas/Date', description: 'The day the notice reached the insurer, or the insurer sent it. Default today.' }
        effectiveDate: { $ref: '#/components/schemas/Date', description: 'For need-ceased the day the need ceased; for customer-immediate a later day than the day after notice.' }
        note: { type: string, maxLength: 2000, description: 'Required for need-ceased and insurer-breach. Must not contain personal data.' }

    Acceptance:
      type: object
      required: [channel, acceptedAt]
      properties:
        channel: { type: string, description: 'Where the policyholder accepted the terms, e.g. web, app or phone.' }
        reference: { type: string, description: e.g. a signing reference. }
        acceptedAt: { $ref: '#/components/schemas/DateTime', description: 'At issue: as the channel says. At a transfer: when Petvold recorded it.' }
        receivedAt: { $ref: '#/components/schemas/DateTime', description: At issue, when Petvold received it. }
        documents:
          type: array
          items: { $ref: '#/components/schemas/AcceptedDocument' }
          description: The product documents the customer was shown (ADR 0032), sorted by type and language.

    AcceptProposalRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: { type: string, minLength: 1, maxLength: 40 }
        reference: { type: string, maxLength: 200 }

    PolicyProposal:
      type: object
      required: [id, policyId, market, kind, sourceEventId, details, createdAt]
      properties:
        id: { type: string }
        policyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        kind: { type: string, enum: [transfer, cancel-death] }
        sourceEventId: { type: string, description: The event from the animal register. }
        details:
          type: object
          description: 'A transfer: fromPartyId, toPartyId and from (the day of sale). A death: deceasedOn.'
          properties:
            fromPartyId: { type: string }
            toPartyId: { type: string }
            from: { $ref: '#/components/schemas/Date' }
            deceasedOn: { $ref: '#/components/schemas/Date' }
        deadline: { $ref: '#/components/schemas/Date', description: A transfer not accepted by this day ends the policy from the day of sale. }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        decision:
          type: object
          required: [outcome, decidedBy, decidedAt]
          properties:
            outcome: { type: string, enum: [accepted, rejected, expired] }
            acceptance: { $ref: '#/components/schemas/Acceptance' }
            reason: { type: string }
            transactionId: { type: string }
            decidedBy: { type: string }
            decidedAt: { $ref: '#/components/schemas/DateTime' }

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [market, productVersion, startDate]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        productVersion: { type: string }
        startDate: { $ref: '#/components/schemas/Date' }
        animalId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        animal:
          type: object
          additionalProperties: false
          required: [species, birthDate]
          properties:
            species: { type: string }
            breed: { type: string }
            birthDate: { $ref: '#/components/schemas/Date' }
        policyholderPartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        postalCode: { type: string, maxLength: 12 }
        vetCare:
          type: object
          additionalProperties: false
          properties:
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductible: { type: string }
        groupId: { type: string, pattern: '^pgr_[A-Za-z0-9]+$', description: 'A group the policy would join, for its discount: the animal becomes the next member.' }
        group:
          type: object
          additionalProperties: false
          required: [kind, memberNo]
          description: Instead of groupId, e.g. from a customer portal.
          properties:
            kind: { type: string, enum: [litter, household] }
            memberNo: { type: integer, minimum: 1, description: The animal's place in the group, 1 = the first. }
        campaignCode: { type: string, maxLength: 32 }
        answers:
          type: array
          description: 'Answers to the underwriting questions (ADR 0031): the quote then says what an application would lead to. Nothing is stored.'
          items: { $ref: '#/components/schemas/UnderwritingAnswer' }

    PriceResult:
      type: object
      required: [currency, basePremium, annualPremium, termPremium, breakdown, facts, inputHash]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        basePremium: { $ref: '#/components/schemas/NonNegativeMoney', description: The yearly base price from the tariff, before price terms. }
        annualPremium: { $ref: '#/components/schemas/NonNegativeMoney', description: The yearly premium after price terms. }
        termPremium: { $ref: '#/components/schemas/NonNegativeMoney' }
        breakdown:
          type: array
          description: Every step of the price, in order.
          items:
            type: object
            required: [code, value, amount]
            properties:
              code: { type: string, enum: [base, age, breed-group, deductible, zone, minimum, rounding, group-discount, campaign, discount-cap, term] }
              value: { type: integer, description: A factor in basis points, or an amount in minor units. }
              basis: { description: 'What the factor came from, e.g. the age, the breed group or the zone.', oneOf: [{ type: string }, { type: integer }] }
              amount: { type: integer, description: The amount after the step. }
        facts:
          type: object
          required: [ageYears, breedGroup, zone, termDays, yearDays, discountBp]
          properties:
            discountBp: { type: integer, description: The total discount in basis points. }
            ageYears: { type: integer }
            breedGroup: { type: string }
            zone: { type: string }
            termDays: { type: integer }
            yearDays: { type: integer }
        tariff:
          type: object
          required: [series, version, checksum]
          properties:
            series: { type: string }
            version: { type: integer }
            checksum: { type: string }
        priceTerms:
          type: object
          required: [series, version, checksum]
          properties:
            series: { type: string }
            version: { type: integer }
            checksum: { type: string }
        inputHash: { type: string }

    Quote:
      type: object
      required: [market, productVersion, startDate, endDate, vetCare, deductibleOption, price]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        productVersion: { type: string }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date' }
        vetCare: { $ref: '#/components/schemas/VetCareTerms' }
        deductibleOption: { type: string }
        price: { $ref: '#/components/schemas/PriceResult' }
        underwriting: { $ref: '#/components/schemas/UnderwritingResult', description: 'What an application with the answers would lead to, if answers were given.' }

    ClaimSummary:
      type: object
      required: [id, claimNo, policyId, animalId, market, currency, channel, treatmentFrom, diagnosisCode, receivedAt, status]
      properties:
        id: { type: string }
        claimNo: { type: string }
        policyId: { type: string }
        animalId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        channel: { type: string, enum: [clinic_direct, customer] }
        clinicId: { type: string }
        treatmentFrom: { $ref: '#/components/schemas/Date' }
        diagnosisCode: { type: string }
        receivedAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        latestDecision:
          type: object
          required: [seq, outcome, payout, decidedAt]
          properties:
            seq: { type: integer }
            outcome: { type: string, enum: [approved, partial, rejected] }
            payout: { $ref: '#/components/schemas/NonNegativeMoney' }
            decidedAt: { $ref: '#/components/schemas/DateTime' }
        basisCompleteAt:
          $ref: '#/components/schemas/DateTime'
          description: |
            When the basis was complete, for FAL 7 kap. 1 § (ADR 0036): when the
            claim was received, or later, when a request for information was
            answered or expired. Omitted while a request is open.
        informationMissing:
          type: boolean
          description: The latest request for information expired without an answer. Omitted when false.

    ChangePolicyRequest:
      type: object
      additionalProperties: false
      required: [from, vetCare, reason]
      properties:
        from: { $ref: '#/components/schemas/Date' }
        vetCare:
          type: object
          additionalProperties: false
          description: The new choices. Omitted ones get the product's defaults.
          properties:
            annualLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
            deductible: { type: string }
        premium:
          type: object
          additionalProperties: false
          required: [amount, currency]
          description: 'The premium for a whole term at the new choices. Omitted: the tariff prices it. A different premium needs priceOverride and policies:price-override.'
          properties:
            amount: { $ref: '#/components/schemas/NonNegativeMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
        priceOverride: { $ref: '#/components/schemas/PriceOverride' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    CreatePolicyGroupRequest:
      type: object
      additionalProperties: false
      required: [market, kind, holderPartyId]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        kind: { type: string, enum: [litter, household] }
        holderPartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        litterId: { type: string, pattern: '^lit_[A-Za-z0-9]+$', description: Required for a litter. }

    AddGroupMemberRequest:
      type: object
      additionalProperties: false
      required: [policyId]
      properties:
        policyId: { type: string, pattern: '^pol_[A-Za-z0-9]+$' }
        from: { $ref: '#/components/schemas/Date' }

    EndGroupMemberRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        to: { $ref: '#/components/schemas/Date' }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    PolicyGroup:
      type: object
      required: [id, market, kind, holderPartyId, createdBy, createdAt, members]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        kind: { type: string, enum: [litter, household] }
        holderPartyId: { type: string }
        litterId: { type: string }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        members:
          type: array
          items:
            type: object
            required: [policyId, from, addedBy, addedAt]
            properties:
              policyId: { type: string }
              from: { $ref: '#/components/schemas/Date' }
              to: { $ref: '#/components/schemas/Date', description: The first day it is no longer a member. }
              addedBy: { type: string }
              addedAt: { $ref: '#/components/schemas/DateTime' }
              endedBy: { type: string }
              endedAt: { $ref: '#/components/schemas/DateTime' }
              endReason: { type: string }

    RenewPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        productVersion: { type: string, description: 'Default: the version of the product on sale the day the term starts.' }
        premium:
          type: object
          additionalProperties: false
          required: [amount, currency]
          description: 'Default: the tariff''s price on the renewal day, or the last term''s premium for a product without a tariff. A different premium needs priceOverride and policies:price-override.'
          properties:
            amount: { $ref: '#/components/schemas/NonNegativeMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
        priceOverride: { $ref: '#/components/schemas/PriceOverride' }

    PriceOverride:
      type: object
      additionalProperties: false
      required: [reason]
      description: Why the premium differs from the tariff's (ADR 0030). The computed premium is kept next to it.
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    TermPricing:
      type: object
      required: [result, input]
      description: How the premium was priced (ADR 0030), so it can be explained and recomputed. The zone, never the postal code.
      properties:
        result: { $ref: '#/components/schemas/PriceResult' }
        input: { type: object, description: What the price was computed from, with the zone. }
        override:
          type: object
          required: [computedPremium, reason, by]
          properties:
            computedPremium: { $ref: '#/components/schemas/NonNegativeMoney' }
            reason: { type: string }
            by: { type: string }

    RenewalRunRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun: { type: boolean, default: false }

    RenewalRunResult:
      type: object
      required: [onDate, dryRun, checked, renewed, cancelled, notYet, needsDecision]
      properties:
        onDate: { $ref: '#/components/schemas/Date' }
        dryRun: { type: boolean }
        checked: { type: integer }
        renewed:
          type: array
          items:
            type: object
            required: [policyId, termNo, startDate, endDate, productVersion, premium]
            properties:
              policyId: { type: string }
              termNo: { type: integer }
              startDate: { $ref: '#/components/schemas/Date' }
              endDate: { $ref: '#/components/schemas/Date' }
              productVersion: { type: string }
              premium: { $ref: '#/components/schemas/NonNegativeMoney' }
              transactionId: { type: string, description: Omitted in a dry run. }
        cancelled: { type: integer, description: Not renewed because a cancellation applies at the end of the term. }
        notYet: { type: integer, description: Up for renewal later, by the product's lead time. }
        needsDecision:
          type: array
          items:
            type: object
            required: [policyId, issue, detail]
            properties:
              policyId: { type: string }
              issue: { type: string, enum: [product-not-on-sale, option-not-offered, species-not-covered, term-too-long, animal-died, policyholder-unavailable, price-not-available] }
              detail: { type: string }

    ReinstatePolicyRequest:
      type: object
      additionalProperties: false
      required: [cancellationId, note]
      properties:
        cancellationId: { type: string }
        note: { type: string, minLength: 1, maxLength: 2000 }

    PolicyRecord:
      type: object
      required: [id, market, animalId, inceptionDate, createdBy, createdAt, terms, versions]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        animalId: { type: string }
        inceptionDate: { $ref: '#/components/schemas/Date', description: The waiting period counts from it. }
        createdBy: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        terms: { type: array, items: { $ref: '#/components/schemas/PolicyTerm' } }
        versions: { type: array, description: What is known now, by validity., items: { $ref: '#/components/schemas/PolicyVersion' } }

    PolicySnapshot:
      type: object
      required: [policyId, policyVersionId, market, currency, animalId, animalBirthDate, productVersion, status, validFrom, inceptionDate, policyYearStart, policyYearEnd, riders]
      properties:
        policyId: { type: string }
        policyVersionId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        animalId: { type: string }
        animalBirthDate: { $ref: '#/components/schemas/Date' }
        productVersion: { type: string }
        status: { type: string, enum: [active, cancelled] }
        validFrom: { $ref: '#/components/schemas/Date' }
        validTo: { $ref: '#/components/schemas/Date' }
        inceptionDate: { $ref: '#/components/schemas/Date' }
        policyYearStart: { $ref: '#/components/schemas/Date' }
        policyYearEnd: { $ref: '#/components/schemas/Date' }
        vetCare: { $ref: '#/components/schemas/VetCareTerms' }
        riders: { type: array, items: { $ref: '#/components/schemas/Rider' } }

    RetentionSettings:
      type: object
      required: [version, markets, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        markets:
          type: object
          description: Market -> rule. A market without a rule is never erased automatically.
          additionalProperties:
            type: object
            required: [years]
            properties:
              years: { type: integer, minimum: 1, maximum: 100, description: Whole years after the last relation. }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    ChangeRetentionRequest:
      type: object
      additionalProperties: false
      required: [basedOnVersion, markets, reason]
      properties:
        basedOnVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        markets:
          type: object
          propertyNames: { pattern: '^[A-Z]{2}$' }
          additionalProperties:
            type: object
            additionalProperties: false
            required: [years]
            properties:
              years: { type: integer, minimum: 1, maximum: 100 }

    RetentionRunRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun: { type: boolean, default: false, description: Only list the parties that are due. }

    RetentionRunResult:
      type: object
      required: [onDate, dryRun, settingsVersion, checked, due, ongoing, withinRetention, pendingRequest, marketsWithoutRule]
      properties:
        onDate: { $ref: '#/components/schemas/Date' }
        dryRun: { type: boolean }
        settingsVersion: { type: integer }
        checked: { type: integer, description: Parties checked. }
        due:
          type: array
          items:
            type: object
            required: [partyId, market, lastActivity, retainedUntil]
            properties:
              partyId: { type: string }
              market: { $ref: '#/components/schemas/Market' }
              lastActivity: { $ref: '#/components/schemas/Date' }
              retainedUntil: { $ref: '#/components/schemas/Date' }
              requestId: { type: string, description: The erasure request made. Omitted in a dry run. }
        ongoing: { type: integer, description: Parties kept because a relation is ongoing. }
        withinRetention: { type: integer }
        pendingRequest: { type: integer, description: Parties skipped because they already have an undecided request. }
        marketsWithoutRule: { type: array, items: { type: string } }

    ErasureRequestInput:
      type: object
      additionalProperties: false
      required: [basis, reason]
      properties:
        basis: { type: string, enum: [subject-request, retention-expired], description: 'The data subject asked, or the retention period ended.' }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Must not contain personal data.' }

    ErasureApprovalInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 2000 }

    ErasureRejectionInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        restrictUntil: { $ref: '#/components/schemas/Date', description: 'Required when the data subject asked. A date after today.' }

    ErasureRequest:
      type: object
      required: [id, partyId, market, basis, reason, requestedBy, requestedAt]
      properties:
        id: { type: string }
        partyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        basis: { type: string, enum: [subject-request, retention-expired] }
        reason: { type: string }
        requestedBy: { type: string }
        requestedAt: { $ref: '#/components/schemas/DateTime' }
        decision:
          type: object
          required: [outcome, decidedBy, decidedAt]
          properties:
            outcome: { type: string, enum: [approved, rejected] }
            reason: { type: string }
            restrictUntil: { $ref: '#/components/schemas/Date' }
            decidedBy: { type: string }
            decidedAt: { $ref: '#/components/schemas/DateTime' }

    RegisterPartyRequest:
      type: object
      additionalProperties: false
      required: [kind, market]
      properties:
        kind: { type: string, enum: [person, organization] }
        market: { $ref: '#/components/schemas/Market' }
        givenName: { type: string, maxLength: 100 }
        familyName: { type: string, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
        address: { $ref: '#/components/schemas/Address' }
        language: { type: string, pattern: '^[a-z]{2}$' }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/PartyIdentifierInput' }

    ChangePartyRequest:
      type: object
      additionalProperties: false
      required: [basedOnRevision, reason]
      properties:
        basedOnRevision: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        givenName: { type: string, maxLength: 100 }
        familyName: { type: string, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
        address: { $ref: '#/components/schemas/Address' }
        language: { type: string, pattern: '^[a-z]{2}$' }

    IdentifierInput:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [microchip, registration, passport] }
        value: { type: string, minLength: 1, maxLength: 60 }

    Animal:
      type: object
      required: [id, revision, market, species, sex, neutered, name, birthDate, allowLookup, changedBy, changedAt]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string, description: Species code from the reference data. Never changes. }
        breed: { type: string, description: Breed code from the reference data. Omitted when unknown. }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean, description: 'Whether a lookup by identifier, e.g. by a clinic, finds the animal (ADR 0025).' }
        changedBy: { type: string }
        changedAt: { $ref: '#/components/schemas/DateTime' }
        reason: { type: string }

    AnimalSummary:
      type: object
      description: What a lookup shows. No owners and no change history (ADR 0025).
      required: [id, market, species, sex, neutered, name, birthDate, identifiers]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        identifiers:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string, enum: [microchip, registration, passport] }
              value: { type: string }

    AnimalRecord:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          required: [identifiers, ownerships]
          properties:
            litterId: { type: string, description: The litter the animal was born in, if registered as one (ADR 0027). }
            identifiers:
              type: array
              items:
                type: object
                required: [type, value, addedBy, addedAt]
                properties:
                  type: { type: string, enum: [microchip, registration, passport] }
                  value: { type: string }
                  addedBy: { type: string }
                  addedAt: { $ref: '#/components/schemas/DateTime' }
            ownerships:
              type: array
              description: Every owner, oldest first. The one without validTo is the current owner.
              items:
                type: object
                required: [seq, partyId, validFrom, recordedBy, recordedAt]
                properties:
                  seq: { type: integer, minimum: 1 }
                  partyId: { type: string }
                  validFrom: { $ref: '#/components/schemas/Date' }
                  validTo: { $ref: '#/components/schemas/Date', description: First day the party no longer owns the animal. }
                  recordedBy: { type: string }
                  recordedAt: { $ref: '#/components/schemas/DateTime' }
                  reason: { type: string }

    RegisterAnimalRequest:
      type: object
      additionalProperties: false
      required: [market, species, sex, name, birthDate, owner]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean, default: false }
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean, default: false, description: 'Open for lookup by identifier (ADR 0025). Closed unless given.' }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/IdentifierInput' }
        owner:
          type: object
          additionalProperties: false
          required: [partyId, from]
          properties:
            partyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
            from: { $ref: '#/components/schemas/Date' }

    CorrectAnimalRequest:
      type: object
      additionalProperties: false
      required: [basedOnRevision, reason, sex, neutered, name, birthDate, allowLookup]
      properties:
        basedOnRevision: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        breed: { type: string }
        sex: { type: string }
        neutered: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 100 }
        birthDate: { $ref: '#/components/schemas/Date' }
        deceasedOn: { $ref: '#/components/schemas/Date' }
        allowLookup: { type: boolean }

    Litter:
      type: object
      required: [id, market, species, birthDate, breederPartyId, animalIds, registeredBy, registeredAt]
      properties:
        id: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        damId: { type: string }
        sireId: { type: string }
        breederPartyId: { type: string, description: Owner of every animal in the litter from the birth date. }
        animalIds: { type: array, items: { type: string } }
        registeredBy: { type: string }
        registeredAt: { $ref: '#/components/schemas/DateTime' }

    RegisterLitterRequest:
      type: object
      additionalProperties: false
      required: [market, species, birthDate, breederPartyId, animals]
      properties:
        market: { $ref: '#/components/schemas/Market' }
        species: { type: string }
        birthDate: { $ref: '#/components/schemas/Date' }
        damId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        sireId: { type: string, pattern: '^ani_[A-Za-z0-9]+$' }
        breederPartyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        animals:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [name, sex]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              sex: { type: string }
              breed: { type: string }
              allowLookup: { type: boolean, default: false }
              identifiers:
                type: array
                items: { $ref: '#/components/schemas/IdentifierInput' }

    TransferAnimalRequest:
      type: object
      additionalProperties: false
      required: [partyId, from]
      properties:
        partyId: { type: string, pattern: '^pty_[A-Za-z0-9]{1,64}$' }
        from: { $ref: '#/components/schemas/Date' }
        reason: { type: string, maxLength: 2000 }

    EmptyRequest:
      type: object
      additionalProperties: false

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    PayoutOrder:
      type: object
      required: [id, claimId, decisionId, policyId, amount, currency, channel]
      description: An increase in a claim's payout, ordered for payment (ADR 0019). The payments module chooses the payee.
      properties:
        id: { type: string }
        claimId: { type: string }
        decisionId: { type: string }
        policyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        channel: { type: string, enum: [clinic_direct, customer] }
        clinicId: { type: string }

    DeviationReasonCode:
      type: string
      description: Why a handler decided against the assessment's proposal.
      enum: [pre_existing_condition, not_covered, insufficient_documentation, incorrect_invoice, other]

    ReplayResult:
      type: object
      required: [decisionId, calculationModel, engineVersion, replayedWith, status, inputHashMatches, differences]
      properties:
        decisionId: { type: string }
        calculationModel: { type: string, description: The calculation model stored with the decision. }
        engineVersion: { type: string, description: The engine version that made the decision. }
        replayedWith:
          type: object
          required: [engineVersion]
          properties:
            engineVersion: { type: string }
        status:
          type: string
          enum: [identical, different, model_unavailable]
          description: |
            `identical`: the stored assessment is reproduced exactly.
            `different`: the result differs; see `differences`.
            `model_unavailable`: this engine no longer has the stored calculation model.
        inputHashMatches:
          type: boolean
          description: The stored input still hashes to the decision's inputHash.
        differences:
          type: array
          maxItems: 50
          items:
            type: object
            required: [path]
            properties:
              path: { type: string, description: 'JSON path in the assessment, e.g. /calculation/payout' }
              stored: {}
              replayed: {}

    Reason:
      type: object
      required: [reason, params]
      properties:
        reason: { type: string, description: 'Stable key, e.g. decision.partial or waiting.within.' }
        params:
          type: object
          additionalProperties:
            type: [string, number]
        message: { type: string, description: Text in the language from Accept-Language. }

    ExplanationStep:
      allOf:
        - $ref: '#/components/schemas/Reason'
        - type: object
          required: [step, amount]
          properties:
            step:
              type: string
              enum: [billed, non_reimbursable, vat_excluded, deductible_fixed, deductible_fixed_in_period, deductible_variable, limit_capped, payout]
            amount:
              type: integer
              description: In the smallest currency unit. Reductions are negative, so the steps add up to the payout.

    DecisionExplanation:
      type: object
      required: [claimId, decisionId, seq, outcome, payout, currency, decidedAt, automated, mainReason, rules, steps, humanReview, basis]
      properties:
        claimId: { type: string }
        decisionId: { type: string }
        seq: { type: integer, minimum: 1 }
        outcome: { $ref: '#/components/schemas/Outcome' }
        payout: { $ref: '#/components/schemas/NonNegativeMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        decidedAt: { $ref: '#/components/schemas/DateTime' }
        automated: { type: boolean }
        mainReason:
          $ref: '#/components/schemas/Reason'
          description: The one reason that best explains the outcome.
        rules:
          type: array
          description: Every rule the engine checked, in order.
          items: { $ref: '#/components/schemas/RuleResult' }
        steps:
          type: array
          description: The calculation step by step. Empty when the claim was rejected.
          items: { $ref: '#/components/schemas/ExplanationStep' }
        deviation:
          type: object
          description: Set when a handler decided against the proposal.
          required: [reasonCode, reason]
          properties:
            reasonCode: { $ref: '#/components/schemas/DeviationReasonCode' }
            reason: { type: string }
            message: { type: string, description: The reason code as text in the language from Accept-Language. }
        reviewRequestId: { type: string, description: Set when this decision answers a review request. }
        humanReview:
          type: object
          required: [available]
          properties:
            available: { type: boolean, description: A human review of this decision can be requested now. }
            openRequestId: { type: string }
        basis:
          type: object
          description: What makes the decision traceable and recalculable.
          required: [rulesVersion, productVersion, policyVersionId, inputHash, calculationModel, engineVersion]
          properties:
            rulesVersion: { type: string }
            productVersion: { type: [string, 'null'] }
            policyVersionId: { type: [string, 'null'] }
            inputHash: { type: string }
            calculationModel: { type: [string, 'null'], description: null for decisions made before evidence was stored. }
            engineVersion: { type: [string, 'null'] }
            attachments:
              type: array
              description: The claim's attachments in force when the decision was made, by id and checksum (ADR 0036). Not input to the rules. Omitted for decisions made before attachments were kept.
              items:
                type: object
                additionalProperties: false
                required: [id, sha256]
                properties:
                  id: { type: string }
                  sha256: { type: string }

    ReviewRequestInput:
      type: object
      additionalProperties: false
      properties:
        statement:
          type: string
          maxLength: 4000
          description: The customer's view, in their own words.

    ReviewRequest:
      type: object
      required: [id, claimId, decisionId, decisionSeq, requestedBy, requestedAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        decisionId: { type: string }
        decisionSeq: { type: integer, minimum: 1 }
        requestedBy: { type: string }
        statement: { type: string }
        requestedAt: { $ref: '#/components/schemas/DateTime' }
        closedByDecisionId: { type: string, description: The human decision that closed the request. }
        closedAt: { $ref: '#/components/schemas/DateTime' }

    RegisterClaimResult:
      type: object
      required: [claim, assessment, decision]
      properties:
        claim: { $ref: '#/components/schemas/Claim' }
        assessment: { $ref: '#/components/schemas/Assessment' }
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'

    DecideRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject] }
        reason: { type: string, maxLength: 2000 }
        reasonCode:
          $ref: '#/components/schemas/DeviationReasonCode'
          description: Required, with `reason`, when the decision goes against the proposal.
        expectedInputHash:
          type: string
          description: inputHash from the assessment the handler saw. Rejected with 409 if the basis has changed.

    ReassessRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    Limits:
      type: object
      required: [animalId, policyId, market, currency, coverage, policyYearStart, policyYearEnd, annualLimit, consumed, remaining]
      properties:
        animalId: { type: string }
        policyId: { type: string }
        market: { $ref: '#/components/schemas/Market' }
        currency: { $ref: '#/components/schemas/Currency' }
        coverage: { type: string, enum: [vet_care] }
        policyYearStart: { $ref: '#/components/schemas/Date' }
        policyYearEnd: { $ref: '#/components/schemas/Date' }
        annualLimit: { $ref: '#/components/schemas/Money' }
        consumed: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }







    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
