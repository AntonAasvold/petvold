name: Ear infection is settled automatically
description: |
  SEK 4,000 billed. No open deductible period, so the fixed deductible of
  SEK 2,000 is charged, then 25 % of the rest. Every rule passes and the payout
  is below the auto-settle limit of SEK 10,000.
given: {}
expect:
  proposedOutcome: approved
  mode: auto
  calculation:
    billed: 400000
    deductibleFixed: 200000      # SEK 2,000
    deductibleVariable: 50000    # 25 % of SEK 2,000
    payout: 150000               # SEK 1,500
    opensDeductiblePeriod: true
  rules:
    POLICY_ACTIVE: pass
    WAITING_PERIOD: pass
    RIDER: pass
